 and Hepatitis B, then applied for Instalment 2. Why was she found ineligible?*\n\nInstalment 2 can only be claimed after the birth of the child and completion of the full first immunisation cycle, which includes BCG, OPV, DPT, and Hepatitis-B. All four vaccines must be completed before the instalment can be processed.", "wa_hi": "*एक हितग्राही ने बच्चे का जन्म पंजीकरण कराया और BCG, OPV व हेपेटाइटिस-B के टीके लगवाकर दूसरी किस्त का आवेदन किया। उसे अपात्र क्यों माना गया?*\n\nदूसरी किस्त पहले चक्र का पूरा टीकाकरण होने पर ही मिलती है, जिसमें BCG, OPV, DPT और हेपेटाइटिस-B चारों टीके शामिल हैं। चारों टीके लगने के बाद ही किस्त आगे बढ़ेगी।"}, {"id": "PMMVY-F7", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "Why does the system block childbirth entries before LMP + 140 days?", "q_hi": "सिस्टम LMP के 140 दिन से पहले प्रसव की एंट्री क्यों नहीं लेता?", "alt_en": "Why can't I enter delivery before 140 days of LMP?", "alt_hi": "LMP से 140 दिन से पहले प्रसव की एंट्री क्यों नहीं होती?", "kw": "140 days, childbirth entry blocked, early delivery, 140 दिन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why does the system block childbirth entries before LMP + 140 days?*\n\nA birth before 140 days (approximately 20 weeks) from the LMP is medically considered non-viable. The system blocks such entries to prevent data errors and ensure data integrity.", "wa_hi": "*सिस्टम LMP के 140 दिन से पहले प्रसव की एंट्री क्यों नहीं लेता?*\n\nLMP से 140 दिन (लगभग 20 सप्ताह) से पहले जन्म को चिकित्सा की दृष्टि से जीवित रहने योग्य नहीं माना जाता। गलत एंट्री रोकने और डेटा सही रखने के लिए सिस्टम ऐसी एंट्री रोक देता है।"}, {"id": "PMMVY-F8", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "Why does the system reject childbirth entries after LMP + 300 days?", "q_hi": "सिस्टम LMP के 300 दिन बाद प्रसव की एंट्री क्यों अस्वीकार करता है?", "alt_en": "Why is delivery entry rejected after 300 days of LMP?", "alt_hi": "LMP के 300 दिन बाद प्रसव एंट्री क्यों रिजेक्ट होती है?", "kw": "300 days, childbirth entry rejected, late delivery, 300 दिन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why does the system reject childbirth entries after LMP + 300 days?*\n\nA typical pregnancy lasts approximately 280 days. The system allows a maximum of 300 days to accommodate post-mature pregnancies. Entries beyond this are considered medically improbable and are rejected to maintain data accuracy.", "wa_hi": "*सिस्टम LMP के 300 दिन बाद प्रसव की एंट्री क्यों अस्वीकार करता है?*\n\nसामान्य गर्भावस्था लगभग 280 दिन की होती है। देर से होने वाले प्रसव के लिए सिस्टम अधिकतम 300 दिन तक की छूट देता है। इसके बाद की एंट्री चिकित्सा की दृष्टि से संभव नहीं मानी जाती, इसलिए सही डेटा के लिए उसे अस्वीकार किया जाता है।"}, {"id": "PMMVY-F9", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What is the role of the MCP Card?", "q_hi": "MCP कार्ड की क्या भूमिका है?", "alt_en": "Why is the MCP card important?", "alt_hi": "MCP कार्ड क्यों ज़रूरी है?", "kw": "MCP card, mother child protection card, एमसीपी कार्ड, ममता कार्ड", "aud": "Beneficiary", "wa_en": "*What is the role of the MCP Card?*\n\nThe Mother and Child Protection (MCP) Card is the primary document used to verify that all scheme conditionalities, including ANCs and immunisation, have been fulfilled before instalments are disbursed.", "wa_hi": "*MCP कार्ड की क्या भूमिका है?*\n\nमातृ एवं शिशु सुरक्षा (MCP) कार्ड मुख्य दस्तावेज़ है। किस्त देने से पहले इसी से जाँचा जाता है कि ANC और टीकाकरण जैसी सभी शर्तें पूरी हुई हैं या नहीं।"}, {"id": "PMMVY-F10", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What is the difference between eligibility and conditionality?", "q_hi": "पात्रता और शर्त (Conditionality) में क्या अंतर है?", "alt_en": "What is the difference between eligibility and conditions?", "alt_hi": "पात्रता और शर्त में क्या फर्क है?", "kw": "eligibility vs conditionality, शर्त, पात्रता, फर्क", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is the difference between eligibility and conditionality?*\n\nEligibility refers to the criteria a woman must meet to be allowed to benefit from the scheme (e.g., being a first-time or second-time mother from a disadvantaged group). Conditionality refers to the specific actions she must take to receive payment (e.g., completing an ANC, registering the birth, completing immunisation). Eligibility is assessed before conditionality.", "wa_hi": "*पात्रता और शर्त (Conditionality) में क्या अंतर है?*\n\nपात्रता का मतलब है कि महिला योजना का लाभ लेने के योग्य है या नहीं (जैसे कमज़ोर वर्ग की पहली या दूसरी बार माँ बनने वाली महिला)। शर्त का मतलब है वे काम जो राशि पाने के लिए करने ज़रूरी हैं (जैसे ANC जाँच, जन्म पंजीकरण, टीकाकरण)। पहले पात्रता देखी जाती है, फिर शर्तें।"}, {"id": "PMMVY-F11", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "Will a beneficiary receive the PMMVY benefit if the birth did not take place at an institution?", "q_hi": "यदि प्रसव अस्पताल में नहीं हुआ, तो क्या PMMVY का लाभ मिलेगा?", "alt_en": "My delivery happened at home, will I get the money?", "alt_hi": "घर पर डिलीवरी हुई, क्या पैसा मिलेगा?", "kw": "home delivery, non-institutional, घर पर प्रसव, घर पर डिलीवरी", "aud": "Beneficiary", "wa_en": "*Will a beneficiary receive the PMMVY benefit if the birth did not take place at an institution?*\n\n*Yes.* Institutional birth is not a conditionality under PMMVY. The requirement is that the birth must be registered, not that it must have occurred at an institution.", "wa_hi": "*यदि प्रसव अस्पताल में नहीं हुआ, तो क्या PMMVY का लाभ मिलेगा?*\n\n*हाँ।* PMMVY में अस्पताल में प्रसव कोई शर्त नहीं है। ज़रूरी यह है कि बच्चे का जन्म पंजीकरण हो।"}, {"id": "PMMVY-F12", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "If the birth took place in a private hospital, will the beneficiary still receive PMMVY benefits?", "q_hi": "यदि प्रसव निजी अस्पताल में हुआ, तो क्या PMMVY का लाभ मिलेगा?", "alt_en": "Delivery was in a private hospital, will I get PMMVY?", "alt_hi": "प्राइवेट अस्पताल में डिलीवरी हुई, क्या पैसा मिलेगा?", "kw": "private hospital, delivery, निजी अस्पताल, प्राइवेट", "aud": "Beneficiary", "wa_en": "*If the birth took place in a private hospital, will the beneficiary still receive PMMVY benefits?*\n\n*Yes.* The conditionality relates to birth registration at a state-recognised facility, not the type of institution where the birth occurred.", "wa_hi": "*यदि प्रसव निजी अस्पताल में हुआ, तो क्या PMMVY का लाभ मिलेगा?*\n\n*हाँ।* शर्त जन्म पंजीकरण की है, जो राज्य द्वारा मान्य जगह पर होना चाहिए। प्रसव किस तरह के अस्पताल में हुआ, इससे फर्क नहीं पड़ता।"}, {"id": "PMMVY-F13", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "When does the Childbirth workflow get activated or appear on the AWW screen?", "q_hi": "'Childbirth' (प्रसव) वाला चरण आंगनवाड़ी कार्यकर्ता की स्क्रीन पर कब दिखता है?", "alt_en": "When does the Childbirth option show in my login?", "alt_hi": "Childbirth वाला विकल्प कब दिखेगा?", "kw": "childbirth workflow, 98 days, second instalment, चाइल्डबर्थ, 98 दिन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*When does the Childbirth workflow get activated or appear on the AWW screen?*\n\nThe Childbirth workflow is used to process the second instalment for the first child. It is automatically activated and appears on the AWW login for entry of immunisation details and submission after childbirth + 98 days, or LMP + 270 + 98 days, whichever is applicable. This workflow often accumulates high pendency as it is frequently left incomplete.", "wa_hi": "*'Childbirth' (प्रसव) वाला चरण आंगनवाड़ी कार्यकर्ता की स्क्रीन पर कब दिखता है?*\n\nयह चरण पहले बच्चे की दूसरी किस्त के लिए है। प्रसव के 98 दिन बाद, या LMP + 270 + 98 दिन बाद (जो लागू हो), यह कार्यकर्ता के लॉगिन में अपने-आप दिखने लगता है, ताकि टीकाकरण की जानकारी भरकर जमा की जा सके। यह काम अक्सर अधूरा छूट जाता है, इसलिए यहाँ लंबित मामले ज़्यादा होते हैं।"}, {"id": "PMMVY-F14", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "Why is there a mismatch between PMMVY validations and updated BCG vaccination guidelines?", "q_hi": "PMMVY के नियम और BCG टीके के नए दिशा-निर्देशों में अंतर क्यों है?", "alt_en": "BCG can be given within 1 year, why does PMMVY not accept it?", "alt_hi": "BCG एक साल तक लग सकता है, PMMVY में क्यों नहीं मानते?", "kw": "BCG guideline, vaccination mismatch, validation, BCG टीका", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why is there a mismatch between PMMVY validations and updated BCG vaccination guidelines?*\n\nAs per updated guidelines from the Ministry of Health and Family Welfare, BCG vaccination can be administered anytime within one year of birth. However, current PMMVY system validations are not aligned with this guideline and require updates.", "wa_hi": "*PMMVY के नियम और BCG टीके के नए दिशा-निर्देशों में अंतर क्यों है?*\n\nस्वास्थ्य मंत्रालय के नए दिशा-निर्देशों के अनुसार BCG का टीका जन्म के एक साल के भीतर कभी भी लगाया जा सकता है। लेकिन PMMVY सिस्टम की जाँच अभी इसके अनुसार नहीं बदली है, इसे अपडेट करने की ज़रूरत है।"}, {"id": "PMMVY-F15", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What are 'time-lapsed' cases?", "q_hi": "'टाइम-लैप्स' (समय-सीमा निकल चुके) मामले क्या हैं?", "alt_en": "What are time-lapsed cases?", "alt_hi": "टाइम-लैप्स मामले क्या होते हैं?", "kw": "time lapsed, 570 days, expired cases, समय सीमा खत्म, टाइम लैप्स", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What are 'time-lapsed' cases?*\n\nCases not registered within 570 days of the LMP date become time-barred and cannot be processed in the system. AWWs are advised to use the Due List to identify and prioritise such cases before they lapse.", "wa_hi": "*'टाइम-लैप्स' (समय-सीमा निकल चुके) मामले क्या हैं?*\n\nजिन मामलों का पंजीकरण LMP तारीख से 570 दिन के भीतर नहीं हुआ, उनकी समय-सीमा खत्म हो जाती है और सिस्टम में उन पर काम नहीं हो सकता। कार्यकर्ता Due List देखकर ऐसे मामलों को समय रहते पहचानें और पहले निपटाएँ।"}, {"id": "PMMVY-F16", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What is the final deadline for registration?", "q_hi": "पंजीकरण की अंतिम समय-सीमा क्या है?", "alt_en": "What is the last date to register?", "alt_hi": "पंजीकरण की आखिरी तारीख क्या है?", "kw": "deadline, last date, 270 days, 570 days, अंतिम तारीख, समय सीमा", "aud": "Beneficiary", "wa_en": "*What is the final deadline for registration?*\n\nRegistration must be completed within 270 days of childbirth, or within 570 days of the LMP date, whichever comes first.", "wa_hi": "*पंजीकरण की अंतिम समय-सीमा क्या है?*\n\nप्रसव के 270 दिन के भीतर या LMP तारीख से 570 दिन के भीतर, जो भी पहले हो, पंजीकरण पूरा हो जाना चाहिए।"}, {"id": "PMMVY-G1", "t": "S", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "What happens in the event of a miscarriage or stillbirth?", "q_hi": "गर्भपात या मृत शिशु जन्म होने पर क्या होगा?", "alt_en": "I had a miscarriage, what happens now?", "alt_hi": "गर्भपात हो गया, अब क्या होगा?", "kw": "miscarriage, stillbirth, abortion, गर्भपात, मृत शिशु", "aud": "Beneficiary", "wa_en": "*What happens in the event of a miscarriage or stillbirth?*\n\nThe beneficiary is treated as a fresh applicant for any subsequent pregnancy. This re-registration provision is available up to four times.", "wa_hi": "*गर्भपात या मृत शिशु जन्म होने पर क्या होगा?*\n\nअगली गर्भावस्था में महिला को नई आवेदक माना जाएगा। यह दोबारा पंजीकरण की सुविधा अधिकतम चार बार तक मिलती है।"}, {"id": "PMMVY-G2", "t": "A", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "If a miscarriage happened in the seventh month and no instalment has been received yet, how can the benefit be claimed?", "q_hi": "यदि सातवें महीने में गर्भपात हुआ हो और अभी तक कोई किस्त न मिली हो, तो लाभ कैसे मिलेगा?", "alt_en": "Miscarriage in 7th month, no money received yet", "alt_hi": "सातवें महीने में गर्भपात हुआ, कोई किस्त नहीं मिली", "kw": "7th month miscarriage, first instalment claim, सातवाँ महीना, गर्भपात किस्त", "aud": "Beneficiary", "wa_en": "*If a miscarriage happened in the seventh month and no instalment has been received yet, how can the benefit be claimed?*\n\nIf the condition for the first instalment (pregnancy registration and one ANC) had already been met, the first instalment can be claimed with the MCP card and medical proof.", "wa_hi": "*यदि सातवें महीने में गर्भपात हुआ हो और अभी तक कोई किस्त न मिली हो, तो लाभ कैसे मिलेगा?*\n\nयदि पहली किस्त की शर्त (गर्भावस्था पंजीकरण और एक ANC जाँच) पहले ही पूरी हो चुकी थी, तो MCP कार्ड और डॉक्टर के प्रमाण के साथ पहली किस्त का दावा किया जा सकता है।"}, {"id": "PMMVY-G3", "t": "S", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "What if the child passes away after birth?", "q_hi": "जन्म के बाद बच्चे की मृत्यु हो जाए तो क्या होगा?", "alt_en": "My baby died after birth, what happens?", "alt_hi": "जन्म के बाद बच्चे की मृत्यु हो गई, क्या होगा?", "kw": "child death, infant death, parity, बच्चे की मृत्यु", "aud": "Beneficiary", "wa_en": "*What if the child passes away after birth?*\n\nThe birth is counted for parity purposes (i.e., it counts as the first or second child). The next pregnancy will be treated as the subsequent childbirth accordingly.", "wa_hi": "*जन्म के बाद बच्चे की मृत्यु हो जाए तो क्या होगा?*\n\nउस जन्म को गिनती में लिया जाता है, यानी वह पहला या दूसरा बच्चा माना जाएगा। अगली गर्भावस्था उसी के अनुसार अगला प्रसव मानी जाएगी।"}, {"id": "PMMVY-G4", "t": "A", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "If the baby dies during pregnancy or after delivery, will the woman get the related instalment?", "q_hi": "यदि गर्भावस्था के दौरान या प्रसव के बाद शिशु की मृत्यु हो जाए, तो क्या संबंधित किस्त मिलेगी?", "alt_en": "Baby died, will I get the instalment?", "alt_hi": "शिशु की मृत्यु हुई, क्या किस्त मिलेगी?", "kw": "baby death instalment, shishu mrityu, शिशु मृत्यु, किस्त", "aud": "Beneficiary", "wa_en": "*If the baby dies during pregnancy or after delivery, will the woman get the related instalment?*\n\nAn instalment that had already become due (conditions met up to birth) will be paid. However, later instalments that depend on conditions such as immunisation will not be payable because of the child's death.", "wa_hi": "*यदि गर्भावस्था के दौरान या प्रसव के बाद शिशु की मृत्यु हो जाए, तो क्या संबंधित किस्त मिलेगी?*\n\nजन्म तक की शर्तें पूरी होने से जो किस्त पहले ही देय बन चुकी है, वह मिलेगी। लेकिन टीकाकरण जैसी शर्तों पर निर्भर आगे की किस्त शिशु की मृत्यु के कारण नहीं मिलेगी।"}, {"id": "PMMVY-G5", "t": "S", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "What happens if the beneficiary passes away?", "q_hi": "यदि हितग्राही की मृत्यु हो जाए तो क्या होगा?", "alt_en": "What happens if the beneficiary dies?", "alt_hi": "हितग्राही की मृत्यु हो जाए तो क्या होगा?", "kw": "beneficiary death, mother death, हितग्राही मृत्यु", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What happens if the beneficiary passes away?*\n\nPending instalments are not disbursed. The case is closed in the MIS.", "wa_hi": "*यदि हितग्राही की मृत्यु हो जाए तो क्या होगा?*\n\nबाकी किस्तें नहीं दी जातीं और सिस्टम (MIS) में मामला बंद कर दिया जाता है।"}, {"id": "PMMVY-G6", "t": "S", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "What happens if the beneficiary migrates to another location?", "q_hi": "यदि हितग्राही दूसरी जगह चली जाए तो क्या होगा?", "alt_en": "I moved to another place, will my case continue?", "alt_hi": "मैं दूसरी जगह चली गई, क्या मेरा केस चलेगा?", "kw": "migration, moved, shifted, दूसरी जगह, स्थानांतरण", "aud": "Beneficiary", "wa_en": "*What happens if the beneficiary migrates to another location?*\n\nThe case continues in the PMMVY system if already registered. The beneficiary can be tracked using her Aadhaar number or registered mobile number.", "wa_hi": "*यदि हितग्राही दूसरी जगह चली जाए तो क्या होगा?*\n\nयदि पंजीकरण पहले हो चुका है, तो मामला PMMVY सिस्टम में चलता रहता है। हितग्राही को उसके आधार नंबर या पंजीकृत मोबाइल नंबर से खोजा जा सकता है।"}, {"id": "PMMVY-G7", "t": "A", "sec_en": "G. Special Cases", "sec_hi": "G. विशेष परिस्थितियाँ", "q_en": "If the beneficiary goes away for a long time after delivery and cannot be contacted, how should the second-instalment or second-daughter form be filled?", "q_hi": "यदि प्रसव के बाद हितग्राही लंबे समय के लिए बाहर चली जाए और संपर्क न हो पाए, तो दूसरी किस्त या दूसरी बेटी का फॉर्म कैसे भरें?", "alt_en": "Beneficiary went away after delivery and is unreachable", "alt_hi": "प्रसव के बाद हितग्राही बाहर चली गई, संपर्क नहीं हो रहा", "kw": "unreachable, away, second instalment form, संपर्क नहीं, बाहर चली गई", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the beneficiary goes away for a long time after delivery and cannot be contacted, how should the second-instalment or second-daughter form be filled?*\n\nTry to reach her through the available mobile number or family members. Once contact is made, the form can be filled online even while she is at a distant location.", "wa_hi": "*यदि प्रसव के बाद हितग्राही लंबे समय के लिए बाहर चली जाए और संपर्क न हो पाए, तो दूसरी किस्त या दूसरी बेटी का फॉर्म कैसे भरें?*\n\nउपलब्ध मोबाइल नंबर या परिवार के सदस्यों से संपर्क करने का प्रयास करें। संपर्क होने पर वह दूर रहते हुए भी फॉर्म ऑनलाइन भरा जा सकता है।"}, {"id": "PMMVY-H1", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What is 'Face Authentication' in PMMVYsoft?", "q_hi": "PMMVYsoft में 'Face Authentication' क्या है?", "alt_en": "What is Face Authentication in the PMMVY app?", "alt_hi": "PMMVY ऐप में Face Authentication क्या है?", "kw": "face authentication, face scan, RD app, चेहरा सत्यापन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is 'Face Authentication' in PMMVYsoft?*\n\nFace Authentication is a built-in feature in PMMVYsoft that allows the AWW to complete beneficiary registration without accessing the POSHAN Tracker interface. The process involves:\n• Installing the Aadhaar RD (Registered Device) app.\n• Using the Face-Scan feature within the PMMVY app.\n• Real-time authentication of the beneficiary's identity via the UIDAI server.", "wa_hi": "*PMMVYsoft में 'Face Authentication' क्या है?*\n\nयह PMMVYsoft ऐप की अपनी सुविधा है, जिससे कार्यकर्ता पोषण ट्रैकर खोले बिना ही हितग्राही का पंजीकरण पूरा कर सकती है। इसके लिए:\n• आधार RD (Registered Device) ऐप इंस्टॉल करें।\n• PMMVY ऐप में Face-Scan सुविधा का उपयोग करें।\n• UIDAI सर्वर से हितग्राही की पहचान उसी समय सत्यापित हो जाती है।"}, {"id": "PMMVY-H2", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What is the Facial Recognition System (FRS)?", "q_hi": "FRS (फेशियल रिकग्निशन सिस्टम) क्या है?", "alt_en": "What is FRS?", "alt_hi": "FRS क्या है?", "kw": "FRS, facial recognition, POSHAN Tracker, फेस, चेहरा पहचान", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is the Facial Recognition System (FRS)?*\n\nFRS is the biometric face-scan feature within POSHAN Tracker that authenticates the beneficiary's identity. It is linked to the Supplementary Nutrition Programme (Take-Home Ration / THR) and, once the beneficiary's identity is established in POSHAN Tracker, enables seamless one-click authentication in PMMVY as well.", "wa_hi": "*FRS (फेशियल रिकग्निशन सिस्टम) क्या है?*\n\nFRS पोषण ट्रैकर में चेहरा स्कैन करके हितग्राही की पहचान सत्यापित करने की सुविधा है। यह पूरक पोषण आहार (टेक-होम राशन / THR) से जुड़ी है। पोषण ट्रैकर में एक बार पहचान सत्यापित होने के बाद PMMVY में भी एक क्लिक में सत्यापन हो जाता है।"}, {"id": "PMMVY-H3", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Why is it recommended to install the Face RD App before installing the PMMVY App?", "q_hi": "PMMVY ऐप से पहले Face RD ऐप इंस्टॉल करने की सलाह क्यों दी जाती है?", "alt_en": "Why install Face RD app before the PMMVY app?", "alt_hi": "पहले Face RD ऐप क्यों इंस्टॉल करें?", "kw": "Face RD, install order, GPS, RD ऐप", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why is it recommended to install the Face RD App before installing the PMMVY App?*\n\nThe Face RD App should be installed before the PMMVY App to ensure proper integration and smooth functioning of face authentication services. If the PMMVY App is installed first, integration issues may occur during face authentication. Additionally, GPS/location services should remain enabled during face authentication, as disabling GPS may lead to authentication failure.", "wa_hi": "*PMMVY ऐप से पहले Face RD ऐप इंस्टॉल करने की सलाह क्यों दी जाती है?*\n\nFace RD ऐप पहले इंस्टॉल करने से दोनों ऐप ठीक से जुड़ते हैं और चेहरे का सत्यापन बिना रुकावट होता है। अगर PMMVY ऐप पहले इंस्टॉल हो गया, तो सत्यापन में दिक्कत आ सकती है। साथ ही सत्यापन के समय मोबाइल का GPS/लोकेशन चालू रखें, बंद होने पर सत्यापन फेल हो सकता है।"}, {"id": "PMMVY-H4", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What are the possible reasons for Aadhaar Authentication/eKYC failing in PMMVY?", "q_hi": "PMMVY में आधार Authentication/eKYC सफल न होने के क्या कारण हो सकते हैं?", "alt_en": "Why is Aadhaar eKYC failing?", "alt_hi": "आधार eKYC क्यों फेल हो रहा है?", "kw": "eKYC fail, Aadhaar authentication, आधार सत्यापन फेल", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What are the possible reasons for Aadhaar Authentication/eKYC failing in PMMVY?*\n\nCommon reasons are a wrong Aadhaar number, mobile not linked with Aadhaar, network/server problems, biometric mismatch, or inconsistent information in the Aadhaar database.", "wa_hi": "*PMMVY में आधार Authentication/eKYC सफल न होने के क्या कारण हो सकते हैं?*\n\nगलत आधार नंबर, आधार से मोबाइल लिंक न होना, नेटवर्क/सर्वर की समस्या, बायोमेट्रिक मेल न खाना, या आधार डेटाबेस में जानकारी में गड़बड़ी इसके आम कारण हैं।"}, {"id": "PMMVY-H5", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What should be done if there is an Aadhaar Authentication problem after registration?", "q_hi": "पंजीकरण के बाद आधार Authentication में समस्या आए तो क्या करें?", "alt_en": "Aadhaar authentication problem after registration", "alt_hi": "पंजीकरण के बाद आधार सत्यापन में दिक्कत", "kw": "Aadhaar authentication problem, update Aadhaar, आधार अपडेट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What should be done if there is an Aadhaar Authentication problem after registration?*\n\nVisit an Aadhaar centre and get the Aadhaar details updated so that they match the information that was in Aadhaar at the time of PMMVY registration.", "wa_hi": "*पंजीकरण के बाद आधार Authentication में समस्या आए तो क्या करें?*\n\nआधार केंद्र जाकर आधार की जानकारी अपडेट कराएँ, ताकि वह PMMVY पंजीकरण के समय आधार में दर्ज जानकारी से मेल खाए।"}, {"id": "PMMVY-H6", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Why does Face Recognition System (FRS) authentication fail even when Aadhaar details are correct?", "q_hi": "आधार की जानकारी सही होने पर भी FRS सत्यापन फेल क्यों होता है?", "alt_en": "Aadhaar is correct but FRS fails, why?", "alt_hi": "आधार सही है फिर भी FRS फेल क्यों?", "kw": "FRS fail, old photo, biometric lock, FRS फेल, फोटो पुरानी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why does Face Recognition System (FRS) authentication fail even when Aadhaar details are correct?*\n\nFRS authentication may fail if the Aadhaar photograph is outdated and does not match the current facial appearance of the beneficiary or user. Additionally, it should also be checked whether the biometrics are locked, as locked biometrics may prevent successful face authentication.", "wa_hi": "*आधार की जानकारी सही होने पर भी FRS सत्यापन फेल क्यों होता है?*\n\nयदि आधार की फोटो पुरानी है और अब हितग्राही का चेहरा उससे मेल नहीं खाता, तो FRS फेल हो सकता है। यह भी जाँचें कि आधार बायोमेट्रिक लॉक तो नहीं है, क्योंकि लॉक होने पर चेहरे का सत्यापन नहीं हो पाता।"}, {"id": "PMMVY-H7", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Is it essential to update Aadhaar-linked biometrics for face authentication?", "q_hi": "क्या चेहरे के सत्यापन के लिए आधार बायोमेट्रिक अपडेट कराना ज़रूरी है?", "alt_en": "Do we need to update biometrics for face authentication?", "alt_hi": "क्या बायोमेट्रिक अपडेट कराना ज़रूरी है?", "kw": "biometric update, Aadhaar Kendra, बायोमेट्रिक, अपडेट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Is it essential to update Aadhaar-linked biometrics for face authentication?*\n\n*Yes.* If face authentication continues to fail, the beneficiary may need to update her biometrics at an Aadhaar Kendra. Additionally, it should also be verified whether the beneficiary's biometrics are locked, as locked biometrics can prevent successful face authentication.", "wa_hi": "*क्या चेहरे के सत्यापन के लिए आधार बायोमेट्रिक अपडेट कराना ज़रूरी है?*\n\n*हाँ।* बार-बार सत्यापन फेल होने पर हितग्राही को आधार केंद्र पर बायोमेट्रिक अपडेट कराना पड़ सकता है। यह भी देखें कि बायोमेट्रिक लॉक तो नहीं है, क्योंकि लॉक होने पर सत्यापन नहीं होता।"}, {"id": "PMMVY-H8", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Why is FRS still failing after updating Aadhaar biometrics?", "q_hi": "आधार बायोमेट्रिक अपडेट कराने के बाद भी FRS फेल क्यों हो रहा है?", "alt_en": "Biometrics updated but FRS still failing", "alt_hi": "बायोमेट्रिक अपडेट के बाद भी FRS फेल", "kw": "biometric locked, unlock, बायोमेट्रिक लॉक, अनलॉक", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why is FRS still failing after updating Aadhaar biometrics?*\n\nEven after biometric updates, FRS may fail if the Aadhaar biometric is locked. Users should ensure that biometrics are unlocked before attempting authentication.", "wa_hi": "*आधार बायोमेट्रिक अपडेट कराने के बाद भी FRS फेल क्यों हो रहा है?*\n\nबायोमेट्रिक अपडेट के बाद भी अगर आधार बायोमेट्रिक लॉक है, तो FRS फेल होगा। सत्यापन से पहले बायोमेट्रिक अनलॉक कर लें।"}, {"id": "PMMVY-H9", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "If FRS is not working even though the beneficiary is present in person, what should be done?", "q_hi": "हितग्राही सामने मौजूद होने पर भी FRS नहीं हो रहा है, तो क्या करें?", "alt_en": "Woman is present but FRS not working", "alt_hi": "महिला सामने है फिर भी FRS नहीं हो रहा", "kw": "FRS not working, camera, lighting, कैमरा, रोशनी, face authentication nahi ho raha, frs nahi ho raha", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If FRS is not working even though the beneficiary is present in person, what should be done?*\n\nImprove the camera and lighting, keep the face straight and clearly visible with no shadow on it, use a light-coloured background, and try again.", "wa_hi": "*हितग्राही सामने मौजूद होने पर भी FRS नहीं हो रहा है, तो क्या करें?*\n\nकैमरा और रोशनी ठीक करें, चेहरा सीधा और साफ रखें, चेहरे पर कोई छाया न हो और पीछे हल्के रंग की दीवार/पृष्ठभूमि हो, पुनः प्रयास करें।"}, {"id": "PMMVY-H10", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What if the FRS in POSHAN Tracker is expired, no longer valid, or associated with the child rather than the mother?", "q_hi": "यदि पोषण ट्रैकर में FRS की अवधि खत्म हो गई है, मान्य नहीं है, या माँ की जगह बच्चे से जुड़ा है, तो क्या करें?", "alt_en": "FRS in Poshan Tracker expired or linked to the child", "alt_hi": "पोषण ट्रैकर में FRS खत्म हो गया या बच्चे से जुड़ा है", "kw": "FRS expired, child FRS, invalid, FRS एक्सपायर", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What if the FRS in POSHAN Tracker is expired, no longer valid, or associated with the child rather than the mother?*\n\nIf the FRS beneficiary does not match the PMMVY beneficiary, fresh face authentication can be performed directly through the PMMVY app.", "wa_hi": "*यदि पोषण ट्रैकर में FRS की अवधि खत्म हो गई है, मान्य नहीं है, या माँ की जगह बच्चे से जुड़ा है, तो क्या करें?*\n\nयदि FRS वाली हितग्राही और PMMVY की हितग्राही अलग-अलग हैं, तो PMMVY ऐप से सीधे नया चेहरा सत्यापन कर लें।"}, {"id": "PMMVY-H11", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Why does FRS fail when a pregnant woman transitions to a lactating mother?", "q_hi": "गर्भवती महिला के स्तनपान कराने वाली माँ बनने पर FRS फेल क्यों होता है?", "alt_en": "Why does FRS fail after the mother becomes lactating?", "alt_hi": "स्तनपान वाली माँ बनने पर FRS क्यों फेल होता है?", "kw": "lactating, 6 months child, FRS disabled, स्तनपान, धात्री", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why does FRS fail when a pregnant woman transitions to a lactating mother?*\n\nWhen the child crosses six months of age, the Poshan Tracker shifts the primary beneficiary status from the mother to the child and disables FRS for the mother, making authentication infeasible.", "wa_hi": "*गर्भवती महिला के स्तनपान कराने वाली माँ बनने पर FRS फेल क्यों होता है?*\n\nबच्चा छह महीने का होते ही पोषण ट्रैकर मुख्य हितग्राही माँ की जगह बच्चे को मान लेता है और माँ का FRS बंद कर देता है। इसलिए माँ का सत्यापन नहीं हो पाता।"}, {"id": "PMMVY-H12", "t": "S", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "Why is the face authentication option not visible in the application?", "q_hi": "ऐप में चेहरे के सत्यापन का विकल्प क्यों नहीं दिख रहा है?", "alt_en": "Face authentication option not showing in the app", "alt_hi": "ऐप में फेस ऑथेंटिकेशन का विकल्प नहीं दिख रहा", "kw": "face option missing, other state, re-sync, विकल्प नहीं दिख रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why is the face authentication option not visible in the application?*\n\nThe face authentication option may not appear if FRS was previously performed in another state. Re-synchronisation through the Poshan Tracker application is required.", "wa_hi": "*ऐप में चेहरे के सत्यापन का विकल्प क्यों नहीं दिख रहा है?*\n\nयदि हितग्राही का FRS पहले किसी दूसरे राज्य में हुआ था, तो यह विकल्प नहीं दिखता। पोषण ट्रैकर ऐप से दोबारा सिंक करना होगा।"}, {"id": "PMMVY-H13", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "If the beneficiary is out of the village at the time of FRS, how can Face Authentication be done?", "q_hi": "यदि FRS के समय हितग्राही गाँव से बाहर हो, तो चेहरे का सत्यापन कैसे करें?", "alt_en": "Beneficiary is out of village during FRS", "alt_hi": "FRS के समय हितग्राही गाँव से बाहर है", "kw": "out of village, FRS elsewhere, गाँव से बाहर", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the beneficiary is out of the village at the time of FRS, how can Face Authentication be done?*\n\nFRS can be done by coordinating with the nearest Anganwadi Centre at her current location, or it can be completed when she returns.", "wa_hi": "*यदि FRS के समय हितग्राही गाँव से बाहर हो, तो चेहरे का सत्यापन कैसे करें?*\n\nवह जहाँ अभी रह रही है, वहाँ के नज़दीकी आंगनवाड़ी केंद्र से तालमेल करके FRS कराया जा सकता है, या उसके लौटने पर पूरा करें।"}, {"id": "PMMVY-H14", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "How is FRS done for a visually impaired beneficiary?", "q_hi": "दृष्टिबाधित हितग्राही का FRS कैसे होगा?", "alt_en": "How to do FRS for a blind beneficiary?", "alt_hi": "दृष्टिबाधित महिला का FRS कैसे करें?", "kw": "visually impaired, blind, दृष्टिबाधित, अंधी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*How is FRS done for a visually impaired beneficiary?*\n\nFRS is done through the normal face-scan process. A family member or the worker should help her stand properly in front of the camera.", "wa_hi": "*दृष्टिबाधित हितग्राही का FRS कैसे होगा?*\n\nसामान्य तरीके से चेहरा स्कैन करके ही FRS होता है। परिवार का कोई सदस्य या कार्यकर्ता उसे कैमरे के सामने ठीक से खड़ा होने में मदद करें।"}, {"id": "PMMVY-H15", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "If the mobile phone does not support FRS, what are the options?", "q_hi": "यदि मोबाइल FRS को सपोर्ट नहीं करता, तो क्या विकल्प है?", "alt_en": "My phone does not support FRS", "alt_hi": "मेरा मोबाइल FRS सपोर्ट नहीं करता", "kw": "phone not supported, device, tablet, मोबाइल सपोर्ट नहीं", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the mobile phone does not support FRS, what are the options?*\n\nComplete FRS using a capable device (tablet/another smartphone) available with the Supervisor or at the Anganwadi Centre.", "wa_hi": "*यदि मोबाइल FRS को सपोर्ट नहीं करता, तो क्या विकल्प है?*\n\nसुपरवाइजर या आंगनवाड़ी केंद्र में उपलब्ध सही डिवाइस (टैबलेट/दूसरा स्मार्टफोन) से FRS पूरा कराएँ।"}, {"id": "PMMVY-H16", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "What is the solution if there is a network problem during FRS?", "q_hi": "FRS करते समय नेटवर्क की समस्या आए तो क्या करें?", "alt_en": "Network problem during FRS", "alt_hi": "FRS के समय नेटवर्क नहीं आ रहा", "kw": "network, internet, FRS offline, नेटवर्क समस्या", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is the solution if there is a network problem during FRS?*\n\nMove to an area with better network or try again using Wi-Fi/hotspot. If the problem is severe, save the data offline and sync it later.", "wa_hi": "*FRS करते समय नेटवर्क की समस्या आए तो क्या करें?*\n\nबेहतर नेटवर्क वाली जगह पर जाकर या Wi-Fi/हॉटस्पॉट से दोबारा प्रयास करें। ज़्यादा समस्या हो तो डेटा ऑफलाइन सेव करके बाद में सिंक करें।"}, {"id": "PMMVY-H17", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "If FRS is complete in POSHAN Tracker but the name still appears (as pending) in the PMMVY Soft App, what should be done?", "q_hi": "यदि पोषण ट्रैकर में FRS पूरा हो चुका है, लेकिन PMMVY Soft ऐप में नाम अभी भी (लंबित) दिख रहा है, तो क्या करें?", "alt_en": "FRS done in Poshan Tracker but still pending in PMMVY app", "alt_hi": "पोषण ट्रैकर में FRS हो गया, PMMVY में अब भी लंबित", "kw": "FRS sync, pending, DNO, सिंक, लंबित", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If FRS is complete in POSHAN Tracker but the name still appears (as pending) in the PMMVY Soft App, what should be done?*\n\nWait for some time. If the problem continues, ask the Supervisor/DNO to get the data synced.", "wa_hi": "*यदि पोषण ट्रैकर में FRS पूरा हो चुका है, लेकिन PMMVY Soft ऐप में नाम अभी भी (लंबित) दिख रहा है, तो क्या करें?*\n\nकुछ समय इंतज़ार करें। फिर भी समस्या रहे तो सुपरवाइजर/DNO से डेटा सिंक कराने का अनुरोध करें।"}, {"id": "PMMVY-H18", "t": "A", "sec_en": "H. Aadhaar eKYC & Face Authentication (FRS)", "sec_hi": "H. आधार eKYC और चेहरे से सत्यापन (FRS)", "q_en": "If the mobile number linked to Aadhaar has changed and the OTP is going to the old number, how can FRS be completed?", "q_hi": "यदि आधार से जुड़ा मोबाइल नंबर बदल गया है और OTP पुराने नंबर पर जा रहा है, तो FRS कैसे पूरा करें?", "alt_en": "Aadhaar mobile changed, OTP going to old number for FRS", "alt_hi": "आधार का मोबाइल बदल गया, FRS का OTP पुराने नंबर पर जा रहा", "kw": "FRS OTP, old number, mobile changed, ओटीपी, पुराना नंबर", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the mobile number linked to Aadhaar has changed and the OTP is going to the old number, how can FRS be completed?*\n\nNo OTP is sent to the beneficiary for FRS in PMMVY. Verification is done directly using the Aadhaar number entered during registration.", "wa_hi": "*यदि आधार से जुड़ा मोबाइल नंबर बदल गया है और OTP पुराने नंबर पर जा रहा है, तो FRS कैसे पूरा करें?*\n\nPMMVY में FRS करने के लिए हितग्राही को कोई OTP नहीं जाता, पंजीकरण के दौरान दर्ज आधार संख्या से सीधे सत्यापन होता है।"}, {"id": "PMMVY-I1", "t": "S", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "What is 'NPCI Mapping' or 'Aadhaar Seeding'?", "q_hi": "'NPCI मैपिंग' या 'आधार सीडिंग' क्या है?", "alt_en": "What is NPCI mapping or Aadhaar seeding?", "alt_hi": "NPCI मैपिंग या आधार सीडिंग क्या है?", "kw": "NPCI, Aadhaar seeding, DBT enable, एनपीसीआई, सीडिंग, npci kya hai", "aud": "All", "wa_en": "*What is 'NPCI Mapping' or 'Aadhaar Seeding'?*\n\nNPCI Mapping (also called Aadhaar Seeding) refers to the process of seeding the beneficiary's Aadhaar number to her bank account through the NPCI Mapper, so that the account is enabled for Direct Benefit Transfer (DBT) payments.", "wa_hi": "*'NPCI मैपिंग' या 'आधार सीडिंग' क्या है?*\n\nNPCI मैपिंग (आधार सीडिंग) का मतलब है हितग्राही के आधार नंबर को NPCI मैपर के ज़रिए उसके बैंक खाते से जोड़ना, ताकि उस खाते में DBT से सीधे पैसा आ सके।"}, {"id": "PMMVY-I2", "t": "S", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "A beneficiary still appears in the pre-registered list even after NPCI mapping. What should the AWW do?", "q_hi": "NPCI मैपिंग के बाद भी हितग्राही प्री-रजिस्टर्ड सूची में दिख रही है। कार्यकर्ता क्या करे?", "alt_en": "NPCI done but still showing pre-registered", "alt_hi": "NPCI हो गया फिर भी प्री-रजिस्टर्ड दिख रहा", "kw": "NPCI done, still pre-registered, status check, प्री रजिस्टर्ड", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*A beneficiary still appears in the pre-registered list even after NPCI mapping. What should the AWW do?*\n\nThe AWW should first verify whether Aadhaar seeding/NPCI mapping has been successfully completed. A status-check option is available next to the beneficiary's name in the system, which can be used to confirm the NPCI mapping status and take further action accordingly.\n\nAdditionally, the AWW should also verify whether Facial Recognition has been completed through Poshan Tracker or whether face authentication has been successfully performed through the PMMVY App.", "wa_hi": "*NPCI मैपिंग के बाद भी हितग्राही प्री-रजिस्टर्ड सूची में दिख रही है। कार्यकर्ता क्या करे?*\n\nपहले जाँचें कि आधार सीडिंग/NPCI मैपिंग सच में पूरी हुई है या नहीं। सिस्टम में हितग्राही के नाम के पास 'स्टेटस चेक' का विकल्प है, उससे NPCI मैपिंग की स्थिति देखकर आगे की कार्यवाही करें।\n\nसाथ ही यह भी देखें कि पोषण ट्रैकर से FRS या PMMVY ऐप से चेहरे का सत्यापन पूरा हुआ है या नहीं।"}, {"id": "PMMVY-I3", "t": "S", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "Is NPCI mapping status visible for pre-registered beneficiaries?", "q_hi": "क्या प्री-रजिस्टर्ड हितग्राहियों की NPCI मैपिंग स्थिति दिखती है?", "alt_en": "Can I see NPCI status of pre-registered women?", "alt_hi": "प्री-रजिस्टर्ड महिलाओं की NPCI स्थिति दिखती है?", "kw": "NPCI status, not visible, एनपीसीआई स्थिति", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Is NPCI mapping status visible for pre-registered beneficiaries?*\n\n*No.* The NPCI mapping status for pre-registered beneficiaries is currently not displayed in the system.", "wa_hi": "*क्या प्री-रजिस्टर्ड हितग्राहियों की NPCI मैपिंग स्थिति दिखती है?*\n\n*नहीं*, अभी सिस्टम में प्री-रजिस्टर्ड हितग्राहियों की NPCI मैपिंग स्थिति नहीं दिखती।"}, {"id": "PMMVY-I4", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If the message 'Aadhaar Not Mapped with Bank Account' appears even though Aadhaar is linked to the bank account, what should be done?", "q_hi": "आधार बैंक खाते से जुड़ा होने पर भी 'Aadhaar Not Mapped with Bank Account' संदेश आए तो क्या करें?", "alt_en": "Aadhaar is linked to bank but shows Not Mapped", "alt_hi": "आधार बैंक से जुड़ा है फिर भी Not Mapped दिख रहा", "kw": "Aadhaar not mapped, bank linked, नॉट मैप्ड, बैंक लिंक", "aud": "Beneficiary", "wa_en": "*If the message 'Aadhaar Not Mapped with Bank Account' appears even though Aadhaar is linked to the bank account, what should be done?*\n\nVisit the bank branch and get the NPCI mapping updated again, because Aadhaar-linking and NPCI mapping status can be different.", "wa_hi": "*आधार बैंक खाते से जुड़ा होने पर भी 'Aadhaar Not Mapped with Bank Account' संदेश आए तो क्या करें?*\n\nबैंक शाखा जाकर दोबारा NPCI मैपिंग अपडेट कराएँ, क्योंकि आधार लिंक होना और NPCI मैपिंग होना दो अलग बातें हैं।"}, {"id": "PMMVY-I5", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "Can Anganwadi workers complete the NPCI/DBT process themselves? If yes, how?", "q_hi": "क्या आंगनवाड़ी कार्यकर्ता स्वयं NPCI/DBT प्रक्रिया पूरी कर सकती हैं? यदि हाँ, तो कैसे?", "alt_en": "Can the worker or beneficiary do NPCI mapping herself?", "alt_hi": "क्या NPCI मैपिंग खुद कर सकते हैं?", "kw": "NPCI self, NPCI portal, OTP bank mobile, खुद NPCI", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Can Anganwadi workers complete the NPCI/DBT process themselves? If yes, how?*\n\nNPCI/DBT mapping can also be done by the beneficiary herself on the NPCI portal. During NPCI mapping, the mobile number linked to the beneficiary's bank account must be active, since an OTP is sent to that number during mapping.", "wa_hi": "*क्या आंगनवाड़ी कार्यकर्ता स्वयं NPCI/DBT प्रक्रिया पूरी कर सकती हैं? यदि हाँ, तो कैसे?*\n\nNPCI/DBT मैपिंग NPCI पोर्टल पर हितग्राही स्वयं भी कर सकती है। इसके लिए बैंक खाते से जुड़ा मोबाइल नंबर चालू होना ज़रूरी है, क्योंकि मैपिंग के समय उसी नंबर पर OTP आता है।"}, {"id": "PMMVY-I6", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If a '500 Error' keeps appearing during NPCI mapping, what could be the reason and what should be done?", "q_hi": "NPCI करते समय बार-बार '500 Error' आए तो इसका कारण क्या है और क्या करें?", "alt_en": "500 Error during NPCI mapping", "alt_hi": "NPCI करते समय 500 Error आ रहा है", "kw": "500 error, server error, NPCI error, सर्वर एरर", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a '500 Error' keeps appearing during NPCI mapping, what could be the reason and what should be done?*\n\nThis is usually a server/technical load problem. Try again after some time. If the problem continues, ask the beneficiary to contact her bank branch.", "wa_hi": "*NPCI करते समय बार-बार '500 Error' आए तो इसका कारण क्या है और क्या करें?*\n\nयह आमतौर पर सर्वर पर ज़्यादा लोड या तकनीकी समस्या होती है। कुछ समय बाद दोबारा प्रयास करें। फिर भी समस्या रहे तो हितग्राही को बैंक शाखा से संपर्क करने को कहें।"}, {"id": "PMMVY-I7", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If a bank's name does not appear in the list during NPCI mapping, what should be done?", "q_hi": "NPCI करते समय सूची में किसी बैंक का नाम न दिखे तो क्या करें?", "alt_en": "My bank name is not in the NPCI list", "alt_hi": "NPCI सूची में मेरे बैंक का नाम नहीं है", "kw": "bank not in list, India Post Payments Bank, बैंक का नाम नहीं, पोस्ट बैंक", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a bank's name does not appear in the list during NPCI mapping, what should be done?*\n\nAsk the beneficiary to contact the concerned bank branch, or she can open an account with India Post Payments Bank.", "wa_hi": "*NPCI करते समय सूची में किसी बैंक का नाम न दिखे तो क्या करें?*\n\nहितग्राही को संबंधित बैंक शाखा से संपर्क करने को कहें, या वह इंडिया पोस्ट पेमेंट्स बैंक में भी खाता खुलवा सकती है।"}, {"id": "PMMVY-I8", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If the beneficiary cannot get NPCI mapping done because she is living elsewhere, what process should be followed?", "q_hi": "यदि हितग्राही बाहर रहने के कारण NPCI नहीं करा पा रही है, तो क्या करें?", "alt_en": "I live elsewhere, how do I get NPCI done?", "alt_hi": "बाहर रहती हूँ, NPCI कैसे कराऊँ?", "kw": "NPCI elsewhere, living outside, बाहर रहना, दूसरी जगह बैंक", "aud": "Beneficiary", "wa_en": "*If the beneficiary cannot get NPCI mapping done because she is living elsewhere, what process should be followed?*\n\nInform her to get NPCI mapping done at a bank branch at her current location, either herself or through her family. Once she returns, the confirmation should be recorded on the portal.", "wa_hi": "*यदि हितग्राही बाहर रहने के कारण NPCI नहीं करा पा रही है, तो क्या करें?*\n\nउसे बताएँ कि वह जहाँ रह रही है, वहीं की बैंक शाखा में स्वयं या परिवार के माध्यम से NPCI करा ले। लौटने पर पोर्टल पर इसकी पुष्टि दर्ज करें।"}, {"id": "PMMVY-I9", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If a payment has gone to someone else's bank account by mistake, how can it be corrected?", "q_hi": "यदि भुगतान गलती से किसी दूसरे बैंक खाते में चला गया है, तो इसे कैसे ठीक कराएँ?", "alt_en": "Money went to someone else's account", "alt_hi": "पैसा किसी और के खाते में चला गया", "kw": "wrong account, payment wrong, दूसरे खाते, गलत खाता", "aud": "Beneficiary", "wa_en": "*If a payment has gone to someone else's bank account by mistake, how can it be corrected?*\n\nUnder PMMVY, payment is made only to the currently active bank account linked to the beneficiary's Aadhaar. The account that received the payment will belong to the same beneficiary. There is no chance of the money going into another person's account.", "wa_hi": "*यदि भुगतान गलती से किसी दूसरे बैंक खाते में चला गया है, तो इसे कैसे ठीक कराएँ?*\n\nPMMVY में भुगतान केवल हितग्राही के आधार से जुड़े अभी चालू बैंक खाते में ही होता है। जिस बैंक खाते में भूकतान हुआ है वह उसी हितग्राही का होगा। किसी दूसरे व्यक्ति के खाते में पैसा जाने की संभावना नहीं होती।"}, {"id": "PMMVY-I10", "t": "A", "sec_en": "I. Bank Account, NPCI & DBT", "sec_hi": "I. बैंक खाता, NPCI और DBT", "q_en": "If the payment has been made but bank details are not showing on the portal, what should be done?", "q_hi": "यदि भुगतान हो चुका है लेकिन पोर्टल पर बैंक की जानकारी नहीं दिख रही, तो क्या करें?", "alt_en": "Payment done but bank details not showing on portal", "alt_hi": "भुगतान हो गया पर पोर्टल पर बैंक की जानकारी नहीं दिख रही", "kw": "bank details missing, portal, grievance, बैंक जानकारी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the payment has been made but bank details are not showing on the portal, what should be done?*\n\nRegister a grievance on the PMMVY portal.", "wa_hi": "*यदि भुगतान हो चुका है लेकिन पोर्टल पर बैंक की जानकारी नहीं दिख रही, तो क्या करें?*\n\nPMMVY पोर्टल पर शिकायत दर्ज करें।"}, {"id": "PMMVY-J1", "t": "S", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "What if the AWW has entered incorrect information in the beneficiary's form?", "q_hi": "यदि कार्यकर्ता ने हितग्राही के फॉर्म में गलत जानकारी भर दी हो तो क्या करें?", "alt_en": "I entered wrong details in the form", "alt_hi": "फॉर्म में गलत जानकारी भर दी", "kw": "wrong entry, incorrect information, edit, गलत जानकारी, सुधार", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What if the AWW has entered incorrect information in the beneficiary's form?*\n\nIf submitted, the AWW should immediately inform the Lady Supervisor (LS) to either edit the incorrect fields or reject the application. Once rejected, a fresh application can be made.", "wa_hi": "*यदि कार्यकर्ता ने हितग्राही के फॉर्म में गलत जानकारी भर दी हो तो क्या करें?*\n\nयदि फॉर्म जमा हो चुका है, तो कार्यकर्ता तुरंत सुपरवाइजर (LS) को बताए, ताकि वह गलत जानकारी सुधार दे या आवेदन रिजेक्ट कर दे। रिजेक्ट होने के बाद नया आवेदन भरा जा सकता है।"}, {"id": "PMMVY-J2", "t": "S", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "Is there any back flow in PMMVY Soft?", "q_hi": "क्या PMMVY Soft में आवेदन वापस (Back flow) कार्यकर्ता के पास आता है?", "alt_en": "Will a rejected form come back to me for correction?", "alt_hi": "रिजेक्ट फॉर्म सुधार के लिए वापस आएगा?", "kw": "back flow, rejected, fresh application, वापस, रिजेक्ट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Is there any back flow in PMMVY Soft?*\n\n*No.* If applications are rejected, they do not go back to the AWW for revision. The AWW needs to start a fresh application.", "wa_hi": "*क्या PMMVY Soft में आवेदन वापस (Back flow) कार्यकर्ता के पास आता है?*\n\n*नहीं।* रिजेक्ट हुआ आवेदन सुधार के लिए कार्यकर्ता के पास वापस नहीं आता। कार्यकर्ता को नया आवेदन भरना होगा।"}, {"id": "PMMVY-J3", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If the Supervisor is unable to edit/correct the form, what should be done?", "q_hi": "यदि सुपरवाइजर स्तर पर फॉर्म में सुधार (Edit) नहीं हो पा रहा है, तो क्या करें?", "alt_en": "Supervisor is unable to edit the form", "alt_hi": "सुपरवाइजर फॉर्म एडिट नहीं कर पा रही", "kw": "supervisor edit, LS edit, correction, एडिट नहीं हो रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the Supervisor is unable to edit/correct the form, what should be done?*\n\nThe Edit/Correction option is available only at the Supervisor level. Log in to the app again and retry.", "wa_hi": "*यदि सुपरवाइजर स्तर पर फॉर्म में सुधार (Edit) नहीं हो पा रहा है, तो क्या करें?*\n\nसुधार (Edit) का विकल्प केवल सुपरवाइजर स्तर पर ही होता है। ऐप में दोबारा लॉगिन करके प्रयास करें।"}, {"id": "PMMVY-J4", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If the 'Submit' option is not visible while filling the form, what should be done?", "q_hi": "फॉर्म भरते समय 'Submit' का विकल्प न दिखे तो क्या करें?", "alt_en": "Submit button not showing", "alt_hi": "Submit का बटन नहीं दिख रहा", "kw": "submit missing, submit button, सबमिट नहीं दिख रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the 'Submit' option is not visible while filling the form, what should be done?*\n\nCheck whether all mandatory fields and documents have been filled completely. Update the app, log in again and retry.", "wa_hi": "*फॉर्म भरते समय 'Submit' का विकल्प न दिखे तो क्या करें?*\n\nजाँचें कि सभी ज़रूरी कॉलम और दस्तावेज़ पूरे भरे गए हैं या नहीं। ऐप अपडेट करें और दोबारा लॉगिन करके प्रयास करें।"}, {"id": "PMMVY-J5", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If the app keeps closing while submitting a fully filled form, what is the solution?", "q_hi": "पूरा फॉर्म भरने के बाद Submit करते समय ऐप बार-बार बंद हो जाए, तो क्या करें?", "alt_en": "App closes while submitting the form", "alt_hi": "फॉर्म सबमिट करते समय ऐप बंद हो जाता है", "kw": "app crash, closing, submit, ऐप बंद, क्रैश", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the app keeps closing while submitting a fully filled form, what is the solution?*\n\nUpdate the app, clear the app cache and try again. If the problem continues, inform the Supervisor.", "wa_hi": "*पूरा फॉर्म भरने के बाद Submit करते समय ऐप बार-बार बंद हो जाए, तो क्या करें?*\n\nऐप अपडेट करें, ऐप की कैश मेमोरी साफ करें और दोबारा प्रयास करें। फिर भी समस्या रहे तो सुपरवाइजर को बताएँ।"}, {"id": "PMMVY-J6", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If the form cannot be submitted because of network problems even after filling it completely, what should be done?", "q_hi": "नेटवर्क की समस्या के कारण पूरा फॉर्म भरने के बाद भी Submit न हो, तो क्या करें?", "alt_en": "Form not submitting due to network", "alt_hi": "नेटवर्क के कारण फॉर्म सबमिट नहीं हो रहा", "kw": "network submit, draft, नेटवर्क, ड्राफ्ट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the form cannot be submitted because of network problems even after filling it completely, what should be done?*\n\nMove to an area with better network and try again. The data can be saved as a draft and submitted later.", "wa_hi": "*नेटवर्क की समस्या के कारण पूरा फॉर्म भरने के बाद भी Submit न हो, तो क्या करें?*\n\nबेहतर नेटवर्क वाली जगह जाकर दोबारा प्रयास करें। फॉर्म को ड्राफ्ट में सेव करके बाद में जमा किया जा सकता है।"}, {"id": "PMMVY-J7", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If the PMMVY form keeps getting returned or cannot be submitted, what should be done?", "q_hi": "यदि PMMVY फॉर्म बार-बार Return हो जाता है या Submit नहीं होता, तो क्या करें?", "alt_en": "Form keeps getting returned or not submitting", "alt_hi": "फॉर्म बार-बार Return हो रहा है", "kw": "form returned, not submitting, document format, रिटर्न, सबमिट नहीं", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the PMMVY form keeps getting returned or cannot be submitted, what should be done?*\n\nCheck that all information and documents are correct (right format/size). If the problem continues, contact the Supervisor for technical help.", "wa_hi": "*यदि PMMVY फॉर्म बार-बार Return हो जाता है या Submit नहीं होता, तो क्या करें?*\n\nसभी जानकारी और दस्तावेज़ सही हैं या नहीं (सही फॉर्मेट/साइज़), यह जाँचें। फिर भी समस्या रहे तो तकनीकी मदद के लिए सुपरवाइजर से संपर्क करें।"}, {"id": "PMMVY-J8", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If a photo is not uploading in the app, how can it be uploaded by reducing its size or using the required format?", "q_hi": "ऐप में फोटो अपलोड नहीं हो रही है, तो फोटो का साइज़ कम करके या सही फॉर्मेट में कैसे अपलोड करें?", "alt_en": "Photo not uploading in the app", "alt_hi": "ऐप में फोटो अपलोड नहीं हो रही", "kw": "photo upload, size, JPEG, फोटो अपलोड, साइज़", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a photo is not uploading in the app, how can it be uploaded by reducing its size or using the required format?*\n\nReduce the photo size/resolution to the limit set in the app (in JPEG format) and upload it again.", "wa_hi": "*ऐप में फोटो अपलोड नहीं हो रही है, तो फोटो का साइज़ कम करके या सही फॉर्मेट में कैसे अपलोड करें?*\n\nफोटो का साइज़/रेज़ोल्यूशन ऐप में तय सीमा तक कम करें (JPEG फॉर्मेट में) और दोबारा अपलोड करें।"}, {"id": "PMMVY-J9", "t": "A", "sec_en": "J. Form Filling, Submission & Correction", "sec_hi": "J. फॉर्म भरना, जमा करना और सुधार", "q_en": "If there is a problem in creating a PDF, what should be done?", "q_hi": "PDF बनाने में समस्या आए तो क्या करें?", "alt_en": "Problem creating PDF", "alt_hi": "PDF नहीं बन रही", "kw": "PDF problem, storage, पीडीएफ", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If there is a problem in creating a PDF, what should be done?*\n\nRefresh the app/portal and check the available storage space. If the problem continues, inform the technical team.", "wa_hi": "*PDF बनाने में समस्या आए तो क्या करें?*\n\nऐप/पोर्टल रीफ्रेश करें और मोबाइल में स्टोरेज जगह जाँचें। फिर भी समस्या रहे तो तकनीकी टीम को बताएँ।"}, {"id": "PMMVY-K1", "t": "S", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "What are the common reasons for application rejection?", "q_hi": "आवेदन रिजेक्ट होने के आम कारण क्या हैं?", "alt_en": "Why do applications get rejected?", "alt_hi": "आवेदन रिजेक्ट क्यों होता है?", "kw": "rejection reasons, rejected, रिजेक्ट कारण, अस्वीकार", "aud": "All", "wa_en": "*What are the common reasons for application rejection?*\n\n• Suspected fake or fraudulent beneficiary.\n• Beneficiary does not meet eligibility criteria.\n• Incorrect or incomplete documents submitted.\n• Miscarriage or stillbirth reported.\n• Benefit already availed under this scheme.\n• Death of the beneficiary or child.", "wa_hi": "*आवेदन रिजेक्ट होने के आम कारण क्या हैं?*\n\n• हितग्राही के फर्ज़ी होने का संदेह।\n• हितग्राही पात्रता की शर्तें पूरी नहीं करती।\n• गलत या अधूरे दस्तावेज़।\n• गर्भपात या मृत शिशु जन्म की सूचना।\n• इस योजना का लाभ पहले ही लिया जा चुका है।\n• हितग्राही या बच्चे की मृत्यु।"}, {"id": "PMMVY-K2", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "What does Case Closure mean and when is it done?", "q_hi": "Case Closure (केस बंद करना) का क्या अर्थ है और यह कब किया जाता है?", "alt_en": "What is Case Closure?", "alt_hi": "Case Closure क्या होता है?", "kw": "case closure, close case, केस बंद", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What does Case Closure mean and when is it done?*\n\nIt means permanently closing the beneficiary's case, for example in the event of a miscarriage, death of the child, or death of the beneficiary.", "wa_hi": "*Case Closure (केस बंद करना) का क्या अर्थ है और यह कब किया जाता है?*\n\nइसका अर्थ है हितग्राही का मामला हमेशा के लिए बंद करना, जैसे गर्भपात, शिशु की मृत्यु या हितग्राही की मृत्यु होने पर।"}, {"id": "PMMVY-K3", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If a beneficiary's record has gone into Case Closure by mistake, how can it be brought back?", "q_hi": "यदि किसी हितग्राही का रिकॉर्ड गलती से Case Closure में चला गया है, तो उसे वापस कैसे लाएँ?", "alt_en": "Case closed by mistake, how to restore?", "alt_hi": "गलती से केस बंद हो गया, वापस कैसे लाएँ?", "kw": "wrong closure, restore case, गलती से केस बंद, galti se case band, wapas laana", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a beneficiary's record has gone into Case Closure by mistake, how can it be brought back?*\n\nAt present, the portal has no option to restore a beneficiary whose case has been closed. So, a case should be closed only after the information has been properly verified.", "wa_hi": "*यदि किसी हितग्राही का रिकॉर्ड गलती से Case Closure में चला गया है, तो उसे वापस कैसे लाएँ?*\n\nअभी पोर्टल पर बंद किए गए केस को वापस लाने का विकल्प नहीं है। इसलिए जानकारी की सही जाँच के बाद ही केस बंद करें।"}, {"id": "PMMVY-K4", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If the Case Closure option is not working, what should be done?", "q_hi": "यदि Case Closure का विकल्प काम नहीं कर रहा है, तो क्या करें?", "alt_en": "Case Closure option not working", "alt_hi": "Case Closure का विकल्प काम नहीं कर रहा", "kw": "case closure not working, केस बंद नहीं हो रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the Case Closure option is not working, what should be done?*\n\nUpdate the app, clear the app cache and try again. If the problem continues, inform the Supervisor.", "wa_hi": "*यदि Case Closure का विकल्प काम नहीं कर रहा है, तो क्या करें?*\n\nऐप अपडेट करें, ऐप की कैश मेमोरी साफ करें और दोबारा प्रयास करें। फिर भी समस्या रहे तो सुपरवाइजर को बताएँ।"}, {"id": "PMMVY-K5", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If the beneficiary's name does not appear during Case Closure, what is the solution?", "q_hi": "Case Closure करते समय हितग्राही का नाम न दिखे तो क्या करें?", "alt_en": "Beneficiary name not showing for Case Closure", "alt_hi": "Case Closure में नाम नहीं दिख रहा", "kw": "name not showing, assign AWC, DNO, नाम नहीं दिख रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the beneficiary's name does not appear during Case Closure, what is the solution?*\n\nGet the beneficiary assigned to the correct Anganwadi Centre from the DNO level.", "wa_hi": "*Case Closure करते समय हितग्राही का नाम न दिखे तो क्या करें?*\n\nDNO स्तर से हितग्राही को सही आंगनवाड़ी केंद्र में Assign करवाएँ।"}, {"id": "PMMVY-K6", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If 'Not Eligible' appears during Case Closure, what could be the reason and what should be done?", "q_hi": "Case Closure करते समय 'Not Eligible' दिखे तो इसका कारण क्या है और क्या करें?", "alt_en": "Not Eligible shows during Case Closure", "alt_hi": "Case Closure में Not Eligible आ रहा है", "kw": "not eligible, case closure, नॉट एलिजिबल", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If 'Not Eligible' appears during Case Closure, what could be the reason and what should be done?*\n\nUsually the case has already been closed/rejected for some other reason, or an eligibility condition is not met. Check the reason, make the correction and try again.", "wa_hi": "*Case Closure करते समय 'Not Eligible' दिखे तो इसका कारण क्या है और क्या करें?*\n\nआमतौर पर केस पहले ही किसी और कारण से बंद/रिजेक्ट हो चुका होता है, या पात्रता की शर्त पूरी नहीं होती। कारण जाँचें, सुधार करें और दोबारा प्रयास करें।"}, {"id": "PMMVY-K7", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If the beneficiary's name is not removed from the list even after Case Closure, what could be the reason and what should be done?", "q_hi": "Case Closure के बाद भी हितग्राही का नाम सूची से नहीं हट रहा है, तो इसका कारण क्या है और क्या करें?", "alt_en": "Name still in list after Case Closure", "alt_hi": "केस बंद करने के बाद भी नाम सूची में है", "kw": "name not removed, server delay, नाम नहीं हटा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the beneficiary's name is not removed from the list even after Case Closure, what could be the reason and what should be done?*\n\nThis may be a delay in the data updating on the server. Wait for some time.", "wa_hi": "*Case Closure के बाद भी हितग्राही का नाम सूची से नहीं हट रहा है, तो इसका कारण क्या है और क्या करें?*\n\nसर्वर पर डेटा अपडेट होने में देरी हो सकती है। कुछ समय इंतज़ार करें।"}, {"id": "PMMVY-K8", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If the case is not closing after a miscarriage or child death, how can a new form be filled for the next pregnancy?", "q_hi": "गर्भपात या शिशु मृत्यु के बाद केस बंद नहीं हो रहा है, तो अगली गर्भावस्था का नया फॉर्म कैसे भरें?", "alt_en": "Case not closing after miscarriage, how to fill new form?", "alt_hi": "गर्भपात के बाद केस बंद नहीं हो रहा, नया फॉर्म कैसे भरें?", "kw": "next pregnancy, close old case, नई गर्भावस्था, पुराना केस", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the case is not closing after a miscarriage or child death, how can a new form be filled for the next pregnancy?*\n\nThe old case must first be closed through the Supervisor/CDPO. Only then will a new form for the next pregnancy be accepted.", "wa_hi": "*गर्भपात या शिशु मृत्यु के बाद केस बंद नहीं हो रहा है, तो अगली गर्भावस्था का नया फॉर्म कैसे भरें?*\n\nपहले सुपरवाइजर/CDPO से पुराना केस बंद कराना ज़रूरी है, तभी अगली गर्भावस्था का नया फॉर्म स्वीकार होगा।"}, {"id": "PMMVY-K9", "t": "S", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "Can child death be recorded in the PMMVY App?", "q_hi": "क्या PMMVY ऐप में शिशु मृत्यु दर्ज की जा सकती है?", "alt_en": "Can I record child death in the app?", "alt_hi": "क्या ऐप में शिशु मृत्यु दर्ज कर सकते हैं?", "kw": "child death entry, web portal, शिशु मृत्यु दर्ज", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Can child death be recorded in the PMMVY App?*\n\nCurrently, the PMMVY App does not have an option to capture child death details, limiting proper case closure and record management. It can, however, be done through the PMMVY web platform.", "wa_hi": "*क्या PMMVY ऐप में शिशु मृत्यु दर्ज की जा सकती है?*\n\nअभी PMMVY ऐप में शिशु मृत्यु दर्ज करने का विकल्प नहीं है, जिससे केस बंद करने और रिकॉर्ड रखने में दिक्कत होती है। लेकिन यह काम PMMVY वेब पोर्टल से किया जा सकता है।"}, {"id": "PMMVY-K10", "t": "A", "sec_en": "K. Verification, Rejection & Case Closure", "sec_hi": "K. सत्यापन, रिजेक्शन और केस बंद करना", "q_en": "If a beneficiary's name appears in two different Anganwadi Centres, what should be done?", "q_hi": "यदि किसी हितग्राही का नाम दो अलग-अलग आंगनवाड़ी केंद्रों में दिख रहा है, तो क्या करें?", "alt_en": "Same woman showing in two Anganwadi centres", "alt_hi": "एक ही महिला दो आंगनवाड़ी में दिख रही है", "kw": "duplicate AWC, two centres, दो केंद्र, डुप्लीकेट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a beneficiary's name appears in two different Anganwadi Centres, what should be done?*\n\nCheck for a duplicate entry, keep the record in the correct centre, and inform the Supervisor/CDPO to get it removed from the other centre.", "wa_hi": "*यदि किसी हितग्राही का नाम दो अलग-अलग आंगनवाड़ी केंद्रों में दिख रहा है, तो क्या करें?*\n\nडुप्लीकेट एंट्री की जाँच करें। सही केंद्र में रिकॉर्ड रखें और दूसरे केंद्र से हटवाने के लिए सुपरवाइजर/CDPO को बताएँ।"}, {"id": "PMMVY-L1", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "What is the 'Due List'?", "q_hi": "'Due List' क्या है?", "alt_en": "What is the Due List?", "alt_hi": "Due List क्या है?", "kw": "due list, POSHAN Tracker, ड्यू लिस्ट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is the 'Due List'?*\n\nThe Due List is an automatically populated list of potential beneficiaries drawn from POSHAN Tracker into the PMMVY portal. It enables doorstep delivery of the scheme and simplifies registration for AWWs by providing a partially pre-filled form. Each beneficiary on the list must either be registered or rejected by the AWW.", "wa_hi": "*'Due List' क्या है?*\n\nDue List संभावित हितग्राहियों की सूची है, जो पोषण ट्रैकर से PMMVY पोर्टल में अपने-आप आती है। इससे योजना घर-घर तक पहुँचाना आसान होता है और कार्यकर्ता को आधा भरा हुआ फॉर्म मिलता है। सूची की हर हितग्राही का कार्यकर्ता को या तो पंजीकरण करना है या उसे रिजेक्ट करना है।"}, {"id": "PMMVY-L2", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "What is 'mapping' and why is it important?", "q_hi": "'मैपिंग' क्या है और यह क्यों ज़रूरी है?", "alt_en": "What is mapping and why is it needed?", "alt_hi": "मैपिंग क्या है और क्यों ज़रूरी है?", "kw": "mapping, AWC hierarchy, incentive, मैपिंग", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What is 'mapping' and why is it important?*\n\nMapping links each beneficiary's data to the correct AWC and the service area hierarchy:\n\nDistrict → Block → Project → Sector → Village → AWC\n\n*It is essential for:*\n• Completing registration at the correct AWC and processing approvals.\n• Enabling accurate beneficiary search.\n• Running the AWW incentive module.", "wa_hi": "*'मैपिंग' क्या है और यह क्यों ज़रूरी है?*\n\nमैपिंग से हर हितग्राही की जानकारी सही आंगनवाड़ी केंद्र और क्षेत्र के क्रम से जुड़ती है:\n\nजिला → ब्लॉक → परियोजना → सेक्टर → गाँव → आंगनवाड़ी केंद्र\n\n*यह इन कामों के लिए ज़रूरी है:*\n• सही आंगनवाड़ी केंद्र पर पंजीकरण और स्वीकृति के लिए।\n• हितग्राही को सही तरीके से खोजने के लिए।\n• कार्यकर्ता प्रोत्साहन राशि (Incentive) मॉड्यूल चलाने के लिए।"}, {"id": "PMMVY-L3", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "What happens if mapping is incomplete?", "q_hi": "मैपिंग अधूरी हो तो क्या होता है?", "alt_en": "What happens if mapping is incomplete?", "alt_hi": "मैपिंग अधूरी हो तो क्या होगा?", "kw": "incomplete mapping, incentive not working, अधूरी मैपिंग", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What happens if mapping is incomplete?*\n\n• User creation and workflow processes are disrupted.\n• The AWW incentive module will not function.", "wa_hi": "*मैपिंग अधूरी हो तो क्या होता है?*\n\n• नए यूज़र बनाने और आवेदन आगे बढ़ाने का काम रुक जाता है।\n• कार्यकर्ता प्रोत्साहन राशि मॉड्यूल काम नहीं करता।"}, {"id": "PMMVY-L4", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "Why is AWC mapping with POSHAN Tracker important?", "q_hi": "आंगनवाड़ी केंद्र की पोषण ट्रैकर से मैपिंग क्यों ज़रूरी है?", "alt_en": "Why map AWC with Poshan Tracker?", "alt_hi": "आंगनवाड़ी की पोषण ट्रैकर से मैपिंग क्यों ज़रूरी है?", "kw": "AWC mapping, Poshan Tracker, data flow, पोषण ट्रैकर मैपिंग", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why is AWC mapping with POSHAN Tracker important?*\n\n• It enables data flow from POSHAN Tracker to the PMMVY system.\n• It ensures that the Due List and Facial Recognition System (FRS) are available.\n• Only mapped AWCs receive system updates.", "wa_hi": "*आंगनवाड़ी केंद्र की पोषण ट्रैकर से मैपिंग क्यों ज़रूरी है?*\n\n• इससे पोषण ट्रैकर का डेटा PMMVY सिस्टम में आता है।\n• इसी से Due List और FRS की सुविधा मिलती है।\n• केवल मैप किए गए केंद्रों को ही सिस्टम के अपडेट मिलते हैं।"}, {"id": "PMMVY-L5", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "What is the full address hierarchy for mapping in PMMVY?", "q_hi": "PMMVY में मैपिंग के लिए पूरे पते का क्रम क्या है?", "alt_en": "What is the address order for mapping?", "alt_hi": "मैपिंग के लिए पते का क्रम क्या है?", "kw": "address hierarchy, district block sector, LGD, पते का क्रम", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What is the full address hierarchy for mapping in PMMVY?*\n\nAll AWCs and AWWs must have a complete address recorded in the PMMVY system following this hierarchy:\n\nDistrict → Block / ULB → Project → Sector → Village / Ward → AWC\n\nThis hierarchy is compliant with both the PRI/LGD framework and the WCD administrative structure.", "wa_hi": "*PMMVY में मैपिंग के लिए पूरे पते का क्रम क्या है?*\n\nहर आंगनवाड़ी केंद्र और कार्यकर्ता का पूरा पता PMMVY सिस्टम में इस क्रम में दर्ज होना चाहिए:\n\nजिला → ब्लॉक / नगरीय निकाय → परियोजना → सेक्टर → गाँव / वार्ड → आंगनवाड़ी केंद्र\n\nयह क्रम पंचायती राज/LGD व्यवस्था और महिला एवं बाल विकास विभाग की प्रशासनिक व्यवस्था, दोनों के अनुसार है।"}, {"id": "PMMVY-L6", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "Can the Lady Supervisor (LS) see the due-list time-lapse information?", "q_hi": "क्या सुपरवाइजर (LS) Due List में समय-सीमा (time-lapse) की जानकारी देख सकती है?", "alt_en": "Can the supervisor see due list time-lapse details?", "alt_hi": "क्या सुपरवाइजर Due List की समय-सीमा देख सकती है?", "kw": "LS due list, time lapse, सुपरवाइजर ड्यू लिस्ट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Can the Lady Supervisor (LS) see the due-list time-lapse information?*\n\n*No.* The detailed due-list with time-lapse information is available only at the AWW level. The LS will see only aggregate numbers.", "wa_hi": "*क्या सुपरवाइजर (LS) Due List में समय-सीमा (time-lapse) की जानकारी देख सकती है?*\n\n*नहीं।* समय-सीमा वाली पूरी Due List केवल कार्यकर्ता के स्तर पर दिखती है। सुपरवाइजर को केवल कुल संख्या दिखती है।"}, {"id": "PMMVY-L7", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "Forms approved at the LS level are not visible at the CDPO level. What should be done?", "q_hi": "सुपरवाइजर स्तर पर स्वीकृत फॉर्म CDPO स्तर पर नहीं दिख रहे। क्या करें?", "alt_en": "Forms approved by LS not showing at CDPO", "alt_hi": "सुपरवाइजर से स्वीकृत फॉर्म CDPO को नहीं दिख रहे", "kw": "CDPO not visible, mapping issue, CDPO को नहीं दिख रहा", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Forms approved at the LS level are not visible at the CDPO level. What should be done?*\n\nThis is typically a mapping issue. Check whether the concerned sectors or projects have been correctly mapped to the CDPO in the system, particularly if there are newly added sectors or projects.", "wa_hi": "*सुपरवाइजर स्तर पर स्वीकृत फॉर्म CDPO स्तर पर नहीं दिख रहे। क्या करें?*\n\nयह आमतौर पर मैपिंग की समस्या होती है। देखें कि संबंधित सेक्टर या परियोजना सिस्टम में CDPO से सही तरह मैप है या नहीं, खासकर जब नए सेक्टर या परियोजना जोड़ी गई हों।"}, {"id": "PMMVY-L8", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "Why does the same beneficiary appear multiple times in the due list, and why are duplicate records generated through POSHAN Tracker?", "q_hi": "एक ही हितग्राही Due List में कई बार क्यों दिखती है और पोषण ट्रैकर से डुप्लीकेट रिकॉर्ड क्यों बनते हैं?", "alt_en": "Same woman showing many times in Due List", "alt_hi": "Due List में एक ही महिला कई बार दिख रही", "kw": "duplicate due list, pregnant and lactating, डुप्लीकेट, कई बार", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why does the same beneficiary appear multiple times in the due list, and why are duplicate records generated through POSHAN Tracker?*\n\nA beneficiary may appear multiple times due to status mismatches, such as being marked as both Pregnant and Lactating in the system. Duplicate records are generated in the due list when beneficiaries appear under both pregnant and lactating categories simultaneously.", "wa_hi": "*एक ही हितग्राही Due List में कई बार क्यों दिखती है और पोषण ट्रैकर से डुप्लीकेट रिकॉर्ड क्यों बनते हैं?*\n\nजब सिस्टम में किसी हितग्राही को एक साथ गर्भवती और स्तनपान कराने वाली माँ, दोनों दर्ज कर दिया जाता है, तो स्थिति मेल नहीं खाती। इसी वजह से वह Due List में कई बार दिखती है और डुप्लीकेट रिकॉर्ड बन जाते हैं।"}, {"id": "PMMVY-L9", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "What issue occurs after AWC merging?", "q_hi": "आंगनवाड़ी केंद्रों के विलय (Merge) के बाद क्या समस्या आती है?", "alt_en": "Pre-registered women missing after AWC merger", "alt_hi": "केंद्र मर्ज होने के बाद महिलाएँ नहीं दिख रहीं", "kw": "AWC merge, merging, missing beneficiaries, मर्ज, विलय", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What issue occurs after AWC merging?*\n\nAfter Anganwadi Centre merging, pre-registered beneficiaries may not be visible in either the original or mapped AWC, leading to loss of beneficiary traceability.", "wa_hi": "*आंगनवाड़ी केंद्रों के विलय (Merge) के बाद क्या समस्या आती है?*\n\nकेंद्रों के विलय के बाद प्री-रजिस्टर्ड हितग्राही न पुराने केंद्र में दिखती हैं, न नए केंद्र में। इससे उन्हें खोज पाना मुश्किल हो जाता है।"}, {"id": "PMMVY-L10", "t": "S", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "Why do date of birth mismatches occur between POSHAN Tracker and PMMVY?", "q_hi": "पोषण ट्रैकर और PMMVY में जन्मतिथि मेल क्यों नहीं खाती?", "alt_en": "Date of birth mismatch between Poshan Tracker and PMMVY", "alt_hi": "पोषण ट्रैकर और PMMVY में जन्मतिथि अलग क्यों?", "kw": "DOB mismatch, date format, जन्मतिथि मेल नहीं", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why do date of birth mismatches occur between POSHAN Tracker and PMMVY?*\n\nThe mismatch occurs because POSHAN Tracker uses the date format YYYY-MM-DD, while PMMVY uses DD-MM-YY, resulting in data entry errors and rejection cases.", "wa_hi": "*पोषण ट्रैकर और PMMVY में जन्मतिथि मेल क्यों नहीं खाती?*\n\nपोषण ट्रैकर में तारीख YYYY-MM-DD (साल-महीना-दिन) के रूप में और PMMVY में DD-MM-YY (दिन-महीना-साल) के रूप में भरी जाती है। इस अंतर से एंट्री में गलती होती है और आवेदन रिजेक्ट हो जाते हैं।"}, {"id": "PMMVY-L11", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If names of beneficiaries from another Anganwadi appear in the Due List, what should be done?", "q_hi": "यदि Due List में दूसरी आंगनवाड़ी की हितग्राहियों के नाम दिख रहे हों, तो क्या करें?", "alt_en": "Other Anganwadi's women showing in my Due List", "alt_hi": "मेरी Due List में दूसरी आंगनवाड़ी के नाम हैं", "kw": "wrong due list, other AWC, दूसरी आंगनवाड़ी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If names of beneficiaries from another Anganwadi appear in the Due List, what should be done?*\n\nThis may be a data mapping error. Inform the Supervisor/DNO and get the mapping corrected to the right centre.", "wa_hi": "*यदि Due List में दूसरी आंगनवाड़ी की हितग्राहियों के नाम दिख रहे हों, तो क्या करें?*\n\nयह मैपिंग की गलती हो सकती है। सुपरवाइजर/DNO को बताकर सही केंद्र में मैपिंग ठीक कराएँ।"}, {"id": "PMMVY-L12", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If women whom the worker never entered are showing on her ID, how can they be removed?", "q_hi": "यदि कार्यकर्ता की ID पर ऐसी महिलाएँ दिख रही हैं जिनकी एंट्री उसने नहीं की, तो उन्हें कैसे हटाएँ?", "alt_en": "Women I never entered are showing on my ID", "alt_hi": "मेरी ID पर ऐसी महिलाएँ हैं जिनकी एंट्री मैंने नहीं की", "kw": "unknown entries, wrong mapping, ID पर गलत नाम", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If women whom the worker never entered are showing on her ID, how can they be removed?*\n\nThis indicates wrong mapping or duplicate data. Get it checked through the Supervisor and have it corrected or removed.", "wa_hi": "*यदि कार्यकर्ता की ID पर ऐसी महिलाएँ दिख रही हैं जिनकी एंट्री उसने नहीं की, तो उन्हें कैसे हटाएँ?*\n\nयह गलत मैपिंग या डुप्लीकेट डेटा का संकेत है। सुपरवाइजर से जाँच कराकर सुधार या हटाने की कार्यवाही कराएँ।"}, {"id": "PMMVY-L13", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If women from another state, who have already received the first instalment, are showing on the worker's ID, what should be done?", "q_hi": "यदि दूसरे राज्य की ऐसी महिलाएँ, जिन्हें पहली किस्त मिल चुकी है, कार्यकर्ता की ID पर दिख रही हैं, तो क्या करें?", "alt_en": "Women from another state with first instalment showing on my ID", "alt_hi": "दूसरे राज्य की महिलाएँ मेरी ID पर दिख रही हैं", "kw": "other state, migration data, दूसरा राज्य", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If women from another state, who have already received the first instalment, are showing on the worker's ID, what should be done?*\n\nThis is a data migration error. Inform the Supervisor/DNO and get it corrected so that no duplicate payment is made.", "wa_hi": "*यदि दूसरे राज्य की ऐसी महिलाएँ, जिन्हें पहली किस्त मिल चुकी है, कार्यकर्ता की ID पर दिख रही हैं, तो क्या करें?*\n\nयह डेटा स्थानांतरण (Migration) की गलती है। सुपरवाइजर/DNO को बताकर सुधार कराएँ, ताकि दोबारा भुगतान न हो।"}, {"id": "PMMVY-L14", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If beneficiaries of one's own centre are not visible in the app but those of another centre are, what should be done?", "q_hi": "यदि ऐप में अपने केंद्र की हितग्राही नहीं दिख रहीं, जबकि दूसरे केंद्र की दिख रही हैं, तो क्या करें?", "alt_en": "My centre's women not showing, other centre's are", "alt_hi": "मेरे केंद्र की महिलाएँ नहीं, दूसरे केंद्र की दिख रही हैं", "kw": "own centre missing, centre code, केंद्र कोड", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If beneficiaries of one's own centre are not visible in the app but those of another centre are, what should be done?*\n\nFirst check the login ID/centre code. If they are correct and the problem continues, contact the Supervisor/helpdesk for technical help.", "wa_hi": "*यदि ऐप में अपने केंद्र की हितग्राही नहीं दिख रहीं, जबकि दूसरे केंद्र की दिख रही हैं, तो क्या करें?*\n\nपहले लॉगिन ID/केंद्र कोड जाँचें। सही होने पर भी समस्या रहे तो तकनीकी मदद के लिए सुपरवाइजर/हेल्पडेस्क से संपर्क करें।"}, {"id": "PMMVY-L15", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If wrong beneficiary data is coming from POSHAN Tracker into the PMMVY app, how can it be corrected?", "q_hi": "यदि पोषण ट्रैकर से PMMVY ऐप में गलत हितग्राही डेटा आ रहा है, तो उसे कैसे सुधारें?", "alt_en": "Wrong data coming from Poshan Tracker to PMMVY", "alt_hi": "पोषण ट्रैकर से PMMVY में गलत डेटा आ रहा है", "kw": "wrong data, correct in Poshan Tracker, गलत डेटा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If wrong beneficiary data is coming from POSHAN Tracker into the PMMVY app, how can it be correct
