<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMMVY FAQ Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen chat. Topics rail on the left at desktop width, a drawer on phones. Navy from the FAQ booklets, marigold for standard, teal for additional. */
:root {
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17263A;
  --muted: #5B6B80;
  --line: #D9E0E9;
  --accent: #1F4E79;
  --accent-soft: #E3ECF6;
  --user: #DCEBDF;
  --star: #A87A06;
  --diam: #0E7C7B;
  --warn-bg: #FFF4DC;
  --warn-ink: #7A5200;
  --font-display: "Baloo 2", "Mukta", "Nirmala UI", system-ui, sans-serif;
  --font-body: "Mukta", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1722; --surface: #172233; --ink: #E6ECF3; --muted: #9AA9BC; --line: #2A384C;
    --accent: #8DB8E3; --accent-soft: #1F3049; --user: #1E3A2A; --star: #E2B640; --diam: #47C2C0;
    --warn-bg: #3A2E12; --warn-ink: #F2D28B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1722; --surface: #172233; --ink: #E6ECF3; --muted: #9AA9BC; --line: #2A384C;
  --accent: #8DB8E3; --accent-soft: #1F3049; --user: #1E3A2A; --star: #E2B640; --diam: #47C2C0;
  --warn-bg: #3A2E12; --warn-ink: #F2D28B; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand h1 { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; margin: 0; color: var(--accent); text-wrap: balance; }
.brand span { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.lang button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: .9rem; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.topics-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: .9rem; }

.body { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.filter { padding: 12px; border-bottom: 1px solid var(--line); }
.filter input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.toc { overflow-y: auto; padding: 6px 0 16px; }
.toc details { border-bottom: 1px solid var(--line); }
.toc summary { padding: 10px 14px; font-weight: 700; font-size: .92rem; display: flex; gap: 8px; align-items: baseline; list-style: none; }
.toc summary::-webkit-details-marker { display: none; }
.toc summary .n { margin-left: auto; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; font-size: .8rem; }
.toc ul { list-style: none; margin: 0; padding: 0 0 8px; }
.toc li button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 14px 6px 18px; font-size: .88rem; line-height: 1.35; }
.toc li button:hover { background: var(--accent-soft); }
.mark { font-weight: 700; flex: none; }
.mark.S { color: var(--star); } .mark.A { color: var(--diam); }

main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
.chat { overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; } .row.user { justify-content: flex-end; }
.bubble { max-width: min(680px, 92%); padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.row.user .bubble { background: var(--user); border-color: transparent; border-bottom-right-radius: 4px; }
.row.bot .bubble { border-bottom-left-radius: 4px; }
.example-tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: .78rem; color: var(--muted); }
.pill { border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: .74rem; border: 1px solid currentColor; }
.pill.S { color: var(--star); } .pill.A { color: var(--diam); }
.msg { white-space: normal; }
.msg strong { font-weight: 700; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.actions button { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px 10px; font-size: .85rem; }
.related { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.related p { margin: 0 0 6px; font-size: .8rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 4px 12px; font-size: .86rem; text-align: left; line-height: 1.3; }
.note { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px 12px; }
.composer form { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
.composer button { border: 0; background: var(--accent); color: var(--surface); border-radius: 999px; padding: 0 18px; font-weight: 700; }
.fine { margin: 6px 4px 0; font-size: .76rem; color: var(--muted); }

.scrim { display: none; }
@media (max-width: 899px) {
  .body { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 0 auto 0 0; width: min(340px, 88vw); z-index: 20; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,.18); }
  aside.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(10,20,30,.35); z-index: 10; }
}
@media (min-width: 900px) { .topics-btn { display: none; } }
@media (max-width: 420px) { .brand span { display: none; } .lang button { padding: 4px 9px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="topics-btn" id="topicsBtn" type="button" aria-controls="topics" aria-expanded="false">☰ <span data-t="topics">विषय</span></button>
    <div class="brand">
      <h1 data-t="title">PMMVY सहायक</h1>
      <span data-t="sub">प्रधानमंत्री मातृ वंदना योजना · 202 स्वीकृत प्रश्न-उत्तर</span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-hi" aria-pressed="true">हिंदी</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </header>
  <div class="body">
    <aside id="topics" aria-label="Topics">
      <div class="filter"><label for="filterInput" class="sr" style="position:absolute;left:-9999px" data-t="filterLabel">प्रश्न खोजें</label>
        <input id="filterInput" type="search" autocomplete="off" placeholder="सूची में खोजें"></div>
      <nav class="toc" id="toc"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="composer">
        <form id="form">
          <label for="q" style="position:absolute;left:-9999px" data-t="askLabel">अपना प्रश्न लिखें</label>
          <input id="q" type="text" autocomplete="off" placeholder="अपना प्रश्न लिखें… जैसे: पैसा नहीं आया">
          <button type="submit" id="send" data-t="send">भेजें</button>
        </form>
        <p class="fine" data-t="fine">उत्तर केवल स्वीकृत PMMVY FAQ (नवंबर 2026) से आते हैं। आधार या बैंक नंबर यहाँ न लिखें। अन्य सहायता: हेल्पलाइन 1515</p>
      </div>
    </main>
  </div>
</div>
<script>
/* PMMVY FAQ matcher: BM25 over word tokens + character trigrams, field-weighted. Works for Hindi, English and Hinglish. */
(function (root) {
  const STOP = new Set(("a an the is are was were be to of in on for and or if it its this that what which who whom how why when where can do does did i my me we our you your she her he his they them " +
    "should would could will shall has have had not no yes any with from by as at so then there here also about into than " +
    "क्या है हैं था थे हो होता होती होते के का की को में से पर और या तो भी यह वह इस उस जो कि ने कर करें करे करना कैसे कब कौन किस किसे किन मेरा मेरी मेरे मुझे हम आप वो ये एक लिए " +
    "kya hai kaise kab kaun ka ki ke ko me mein se par aur ya to bhi mera meri mere mujhe hum aap nahi nhi nahin raha rahi rahe ho hota hoti gaya gayi gya hua hui aa aaya aya kar kare karen karein karna karu karun wala wali kuch abhi " +
    "नहीं रहा रही रहे गया गई गयी हुआ हुई आ आया करूँ करूं करें").split(/\s+/));
  const norm = (s) => String(s || "").toLowerCase()
    .replace(/[।॥.,!?;:()\[\]{}"'“”‘’|/\\*_~`<>@#$%^&+=…\-–]/g, " ")
    .replace(/[‌‍]/g, "")
    .replace(/\s+/g, " ").trim();
  // light Devanagari folding so spelling variants meet
  const fold = (w) => w.replace(/ँ/g, "ं").replace(/़/g, "").replace(/ॉ/g, "ो");
  function words(s) { return norm(s).split(" ").filter((w) => w && !STOP.has(w)).map(fold); }
  function grams(ws) {
    const g = [];
    for (const w of ws) {
      const p = "#" + w + "#";
      if (p.length <= 4) { g.push("g:" + p); continue; }
      for (let i = 0; i + 3 <= p.length; i++) g.push("g:" + p.slice(i, i + 3));
    }
    return g;
  }
  const EXP = { paisa: "money पैसा राशि", paise: "money पैसा", rashi: "amount राशि", kist: "instalment किस्त", kisht: "instalment किस्त", shikayat: "complaint grievance शिकायत",
    kagaz: "documents दस्तावेज़ कागज़", kagaj: "documents दस्तावेज़", dastavej: "documents दस्तावेज़", bacha: "child बच्चा", baccha: "child बच्चा", bacche: "child बच्चे", beti: "daughter girl बेटी",
    pati: "husband पति", sarkari: "government सरकारी", naukri: "job नौकरी", garbhvati: "pregnant गर्भवती", garbh: "pregnancy गर्भ", prasav: "delivery प्रसव", janam: "birth जन्म",
    tika: "vaccine immunisation टीका", teeka: "vaccine immunisation टीका", khata: "account bank खाता", galti: "mistake wrong गलती", band: "closed closure बंद", bhool: "forgot भूल", bhul: "forgot भूल",
    umar: "age उम्र आयु", umr: "age उम्र", shadi: "marriage शादी विवाह", shaadi: "marriage शादी", talak: "divorce तलाक", jaanch: "check ANC जाँच", janch: "check ANC जाँच", mrityu: "death मृत्यु", maut: "death मृत्यु",
    dusri: "second दूसरी", doosri: "second दूसरी", dusra: "second दूसरा", pehli: "first पहली", pahli: "first पहली", kitna: "amount how much कितना", kitni: "amount कितनी", milega: "get receive मिलेगा", milegi: "get मिलेगी",
    patr: "eligible पात्र", patra: "eligible पात्र", eligible: "eligible पात्र पात्रता", matlab: "meaning what is मतलब", kya: "", chahiye: "needed required चाहिए", nahi_aaya: "",
    mobile: "mobile मोबाइल", aadhar: "aadhaar आधार", adhar: "aadhaar आधार", aadhaar: "aadhaar आधार", jodna: "link seeding जोड़ना", link: "linked seeding", help: "helpline 1515 help",
    tution: "", hang: "hanging hang हैंग", login: "login लॉगिन", form: "form फॉर्म", gaon: "village गाँव", bahar: "outside away बाहर" };
  function terms(s) {
    let ws = words(s); const extra = [];
    for (const w of ws) if (EXP[w]) extra.push(...words(EXP[w]));
    ws = ws.concat(extra);
    return ws.map((w) => "w:" + w).concat(grams(ws));
  }

  function Engine(rows) {
    this.rows = rows;
    const F = [["q_en", 3], ["q_hi", 3], ["alt_en", 3], ["alt_hi", 3], ["kw", 2.5], ["sec_en", 0.4], ["sec_hi", 0.4], ["wa_en", 0.35], ["wa_hi", 0.35]];
    this.docs = rows.map((r) => {
      const tf = new Map(); let len = 0;
      for (const [f, wt] of F) for (const t of terms(r[f])) { tf.set(t, (tf.get(t) || 0) + wt); len += wt; }
      return { tf, len };
    });
    const df = new Map();
    for (const d of this.docs) for (const t of d.tf.keys()) df.set(t, (df.get(t) || 0) + 1);
    const N = this.docs.length;
    this.idf = new Map();
    for (const [t, n] of df) this.idf.set(t, Math.log(1 + (N - n + 0.5) / (n + 0.5)));
    this.avg = this.docs.reduce((a, d) => a + d.len, 0) / N;
  }
  Engine.prototype.search = function (q, k) {
    const qt = terms(q); if (!qt.length) return [];
    const uniq = [...new Set(qt)];
    const k1 = 1.2, b = 0.6;
    const nq = " " + norm(q) + " ";
    const x0 = { whatQ: /( kya hai | kya hota | matlab | meaning | what is | what are | what does | क्या है | क्या होता | मतलब | किसे कहते )/.test(nq),
                 whoQ: /( kaun | who | कौन )/.test(nq) && !/( kaun se | kaunsa | कौन से | कौन-से )/.test(nq) };
    const out = this.docs.map((d, i) => {
      let s = 0;
      for (const t of uniq) {
        const f = d.tf.get(t); if (!f) continue;
        const idf = this.idf.get(t) || 0;
        const w = t.startsWith("w:") ? 2.2 : 1; // whole-word hits count more than trigram hits
        s += w * idf * (f * (k1 + 1)) / (f + k1 * (1 - b + b * d.len / this.avg));
      }
      if (x0.whatQ && /^(what is|what are|what does|who are|what's)/i.test(this.rows[i].q_en)) s *= 1.15;
      if (x0.whoQ && /^who\b/i.test(this.rows[i].q_en)) s *= 1.15;
      return { i, s };
    }).filter((x) => x.s > 0).sort((a, b2) => b2.s - a.s).slice(0, k || 5);
    // self-score of the query as a scale, so confidence is comparable across short/long queries
    const ref = uniq.reduce((a, t) => a + (this.idf.get(t) || 0) * (t.startsWith("w:") ? 2.2 : 1) * 2.2, 0) || 1;
    return out.map((x) => ({ row: this.rows[x.i], score: x.s, conf: Math.min(1, x.s / ref) }));
  };
  root.PMMVYEngine = Engine;
  if (typeof module !== "undefined") module.exports = Engine;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>window.PMMVY_DATA = [{"id": "PMMVY-A1", "t": "S", "sec_en": "A. Scheme Overview & Background", "sec_hi": "A. योजना की जानकारी और पृष्ठभूमि", "q_en": "What is Pradhan Mantri Matru Vandana Yojana (PMMVY)?", "q_hi": "प्रधानमंत्री मातृ वंदना योजना (PMMVY) क्या है?", "alt_en": "What is the PMMVY scheme?", "alt_hi": "मातृ वंदना योजना क्या है?", "kw": "PMMVY, scheme, matru vandana, योजना, मातृ वंदना", "aud": "All", "wa_en": "*What is Pradhan Mantri Matru Vandana Yojana (PMMVY)?*\n\nPMMVY is a maternity benefit scheme under the Ministry of Women and Child Development (MoWCD). Launched on 1 January 2017, it is implemented in accordance with Section 4 of the National Food Security Act (NFSA), 2013. The scheme provides financial assistance to pregnant and lactating mothers to partially compensate for wage loss during and after pregnancy and improve maternal and child health and nutrition.", "wa_hi": "*प्रधानमंत्री मातृ वंदना योजना (PMMVY) क्या है?*\n\nPMMVY महिला एवं बाल विकास मंत्रालय (MoWCD) की मातृत्व लाभ योजना है। यह 1 जनवरी 2017 से शुरू हुई और राष्ट्रीय खाद्य सुरक्षा अधिनियम (NFSA), 2013 की धारा 4 के अनुसार लागू है। इसमें गर्भवती और स्तनपान कराने वाली माताओं को पैसों की मदद दी जाती है, ताकि गर्भावस्था के दौरान और बाद में काम छूटने से हुए नुकसान की कुछ भरपाई हो सके और माँ-बच्चे का स्वास्थ्य व पोषण बेहतर हो।"}, {"id": "PMMVY-A2", "t": "S", "sec_en": "A. Scheme Overview & Background", "sec_hi": "A. योजना की जानकारी और पृष्ठभूमि", "q_en": "Is PMMVY Direct Benefit Transfer (DBT) compliant?", "q_hi": "क्या PMMVY में पैसा सीधे खाते में (DBT) आता है?", "alt_en": "Does PMMVY money come directly into the bank account?", "alt_hi": "क्या योजना का पैसा सीधे खाते में आता है?", "kw": "DBT, direct transfer, bank account, सीधे खाते, पैसा", "aud": "All", "wa_en": "*Is PMMVY Direct Benefit Transfer (DBT) compliant?*\n\nPMMVY is a DBT-compliant scheme under which funds are directly transferred to the Aadhaar-seeded bank or post office account of the beneficiary, ideally within 30 days of successful enrolment on the PMMVY Portal. Aadhaar-based verification has been mandatory since 1 April 2023. Additionally, Aadhaar-based biometric verification through facial authentication has been mandatory for all new enrolments since 21 May 2025.", "wa_hi": "*क्या PMMVY में पैसा सीधे खाते में (DBT) आता है?*\n\n*हाँ।* PMMVY में राशि सीधे हितग्राही के आधार से जुड़े बैंक या पोस्ट ऑफिस खाते में भेजी जाती है। आमतौर पर PMMVY पोर्टल पर पंजीकरण पूरा होने के 30 दिन के भीतर भुगतान होना चाहिए। 1 अप्रैल 2023 से आधार सत्यापन अनिवार्य है। साथ ही 21 मई 2025 से हर नए पंजीकरण के लिए चेहरे से आधार सत्यापन (Face Authentication) भी अनिवार्य है।"}, {"id": "PMMVY-A3", "t": "S", "sec_en": "A. Scheme Overview & Background", "sec_hi": "A. योजना की जानकारी और पृष्ठभूमि", "q_en": "When was PMMVY launched, and what changed with PMMVY 2.0?", "q_hi": "PMMVY कब शुरू हुई और PMMVY 2.0 में क्या बदला?", "alt_en": "When did PMMVY start and what is new in 2.0?", "alt_hi": "योजना कब शुरू हुई, 2.0 में नया क्या है?", "kw": "launch, 2017, PMMVY 2.0, second child, शुरू, नया बदलाव", "aud": "All", "wa_en": "*When was PMMVY launched, and what changed with PMMVY 2.0?*\n\nPMMVY was launched on 1 January 2017, initially providing benefits only for the first child. PMMVY 2.0 was introduced on 1 April 2022 and implemented from April 2023. The key addition in PMMVY 2.0 is the inclusion of benefits for the second child, provided the second child is a girl.", "wa_hi": "*PMMVY कब शुरू हुई और PMMVY 2.0 में क्या बदला?*\n\nPMMVY 1 जनवरी 2017 को शुरू हुई थी। शुरुआत में लाभ केवल पहले बच्चे के लिए था। PMMVY 2.0 की घोषणा 1 अप्रैल 2022 को हुई और यह अप्रैल 2023 से लागू हुई। इसमें सबसे बड़ा बदलाव यह है कि अब दूसरी संतान बेटी होने पर दूसरे बच्चे के लिए भी लाभ मिलता है।"}, {"id": "PMMVY-A4", "t": "S", "sec_en": "A. Scheme Overview & Background", "sec_hi": "A. योजना की जानकारी और पृष्ठभूमि", "q_en": "What are the objectives of PMMVY?", "q_hi": "PMMVY के उद्देश्य क्या हैं?", "alt_en": "What is the purpose of PMMVY?", "alt_hi": "इस योजना का मकसद क्या है?", "kw": "objective, purpose, wage loss, उद्देश्य, मकसद", "aud": "All", "wa_en": "*What are the objectives of PMMVY?*\n\n*PMMVY has three primary objectives:*\n• To provide partial cash compensation for wage loss, enabling women to rest adequately before and after childbirth.\n• To encourage health-seeking behaviour among Pregnant Women and Lactating Mothers (PW&LM).\n• To promote the girl child.", "wa_hi": "*PMMVY के उद्देश्य क्या हैं?*\n\n*PMMVY के तीन मुख्य उद्देश्य हैं:*\n• काम छूटने से हुए नुकसान की कुछ भरपाई नकद राशि से करना, ताकि महिला प्रसव से पहले और बाद में पूरा आराम कर सके।\n• गर्भवती और स्तनपान कराने वाली माताओं को समय पर जाँच और इलाज कराने के लिए प्रेरित करना।\n• बेटी के जन्म को बढ़ावा देना।"}, {"id": "PMMVY-A5", "t": "S", "sec_en": "A. Scheme Overview & Background", "sec_hi": "A. योजना की जानकारी और पृष्ठभूमि", "q_en": "What are the latest corrective measures taken by the Government of India to strengthen PMMVY implementation?", "q_hi": "PMMVY को बेहतर बनाने के लिए भारत सरकार ने हाल में कौन-से सुधार किए हैं?", "alt_en": "What improvements has the government made in PMMVY recently?", "alt_hi": "सरकार ने योजना में हाल में क्या सुधार किए?", "kw": "improvements, new portal, ABPS, 1515, सुधार, नया पोर्टल", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What are the latest corrective measures taken by the Government of India to strengthen PMMVY implementation?*\n\n*The following improvements have been introduced:*\n• A new, fully paperless PMMVY portal was launched in March 2023, replacing the earlier PMMVY-CAS portal that required physical forms.\n• Payments are processed through the Aadhaar Bridge Payment System (ABPS), with Aadhaar-based biometric facial recognition used to confirm applicant identity.\n• All mandatory provisions, such as Aadhaar verification and DBT enablement of bank accounts, are validated at the point of registration.\n• A Search and Track Status feature is available for all enrolled beneficiaries to check their approval and payment status.\n• A Grievance Lodging and Status module is available for all citizens, with direct routing to implementing authorities for faster resolution.\n• A toll-free, multilingual helpline (1515) is available for PMMVY enquiries and grievances. Beneficiaries receive SMS updates in one of 12 languages at key stages.\n• The portal is LGD-compliant up to the AWC level, with seeding available across State, District, Block, Village, GP, and Ward levels.\n• An Open API enables data sharing with other Central and State Ministries and Departments.\n• MIS data can be generated at State, District, Block, Village, Ward, Project, Sector, and Anganwadi levels for detailed monitoring and analysis.\n• A Due List of potential beneficiaries, populated from POSHAN Tracker, is accessible to AWWs and ASHAs for proactive outreach.", "wa_hi": "*PMMVY को बेहतर बनाने के लिए भारत सरकार ने हाल में कौन-से सुधार किए हैं?*\n\n*मुख्य सुधार इस प्रकार हैं:*\n• मार्च 2023 में पूरी तरह पेपरलेस नया PMMVY पोर्टल शुरू हुआ। इसने पुराने PMMVY-CAS पोर्टल की जगह ली, जिसमें कागज़ी फॉर्म भरने पड़ते थे।\n• भुगतान आधार ब्रिज पेमेंट सिस्टम (ABPS) से होता है और हितग्राही की पहचान चेहरे से आधार सत्यापन द्वारा की जाती है।\n• आधार सत्यापन, बैंक खाते में DBT चालू होना जैसी सभी ज़रूरी शर्तें पंजीकरण के समय ही जाँच ली जाती हैं।\n• हर पंजीकृत हितग्राही 'Search and Track Status' सुविधा से अपने आवेदन की स्वीकृति और भुगतान की स्थिति देख सकती है।\n• कोई भी नागरिक पोर्टल पर शिकायत दर्ज कर सकता है और उसकी स्थिति देख सकता है। शिकायत सीधे संबंधित अधिकारी तक पहुँचती है, जिससे जल्दी समाधान होता है।\n• PMMVY की जानकारी और शिकायत के लिए टोल-फ्री, बहुभाषी हेल्पलाइन 1515 उपलब्ध है। हितग्राही को मुख्य चरणों पर 12 में से किसी एक भाषा में SMS मिलता है।\n• पोर्टल आंगनवाड़ी केंद्र स्तर तक LGD के अनुसार है। राज्य, जिला, ब्लॉक, गाँव, ग्राम पंचायत और वार्ड स्तर तक जानकारी जोड़ी जा सकती है।\n• Open API के माध्यम से केंद्र और राज्य के अन्य विभागों के साथ डेटा साझा किया जा सकता है।\n• निगरानी के लिए राज्य, जिला, ब्लॉक, गाँव, वार्ड, परियोजना, सेक्टर और आंगनवाड़ी स्तर तक MIS रिपोर्ट निकाली जा सकती है।\n• पोषण ट्रैकर से संभावित हितग्राहियों की 'Due List' अपने-आप बनती है, जिसे आंगनवाड़ी कार्यकर्ता और आशा देखकर समय पर हितग्राही तक पहुँच सकती हैं।"}, {"id": "PMMVY-B1", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Who is eligible for PMMVY?", "q_hi": "PMMVY का लाभ लेने के लिए कौन पात्र है?", "alt_en": "Who can get PMMVY money?", "alt_hi": "मातृ वंदना का पैसा किसे मिलता है?", "kw": "eligible, eligibility, who can apply, पात्र, पात्रता, कौन ले सकता, kaun eligible, patrata, kaun le sakta, eligible kaun hai, kaun patr hai", "aud": "All", "wa_en": "*Who is eligible for PMMVY?*\n\nThe scheme targets women from socially, economically disadvantaged, and marginalised sections of society. First-time and second-time pregnant mothers who are at least 18 years old (at the time of LMP) and are not employed by the Central Government, State Government, or any Public Sector Undertaking (PSU) are eligible. ASHA and Anganwadi workers are eligible if they meet the other conditions. The condition is that they meet at least one of the following criteria:\n• Belong to a Scheduled Caste or Scheduled Tribe.\n• Are partially (40%) or fully disabled (Divyang Jan).\n• Hold a BPL ration card.\n• Are beneficiaries under Pradhan Mantri Jan Aarogya Yojana (PMJAY) / Ayushman Bharat.\n• Hold an e-Shram card.\n• Are farmer-beneficiaries under Pradhan Mantri Kisan Samman Nidhi (PM-KISAN).\n• Hold an MGNREGA job card.\n• Have a net family income below ₹8 lakh per annum.\n• Are Anganwadi Workers (AWW), Anganwadi Helpers (AWH), or ASHAs.\n• Hold a ration card under the NFSA, 2013.\n• Fall under any other category notified by the Central Government.", "wa_hi": "*PMMVY का लाभ लेने के लिए कौन पात्र है?*\n\nयह योजना सामाजिक और आर्थिक रूप से कमज़ोर वर्ग की महिलाओं के लिए है। पहली या दूसरी बार गर्भवती महिला, जिसकी आयु LMP (आखिरी माहवारी की तारीख) के समय कम से कम 18 वर्ष हो और जो केंद्र सरकार, राज्य सरकार या किसी सरकारी उपक्रम (PSU) में नौकरी न करती हो, पात्र है। आशा और आंगनवाड़ी कार्यकर्ता बाकी शर्तें पूरी करने पर पात्र हैं। शर्त यह है कि वह नीचे दी गई कम से कम एक श्रेणी में आती हो:\n• अनुसूचित जाति या अनुसूचित जनजाति की हो।\n• 40% या उससे अधिक दिव्यांग हो।\n• BPL राशन कार्ड हो।\n• प्रधानमंत्री जन आरोग्य योजना (PMJAY) / आयुष्मान भारत की हितग्राही हो।\n• ई-श्रम कार्ड हो।\n• पीएम-किसान सम्मान निधि की किसान हितग्राही हो।\n• मनरेगा जॉब कार्ड हो।\n• परिवार की कुल सालाना आय ₹8 लाख से कम हो।\n• आंगनवाड़ी कार्यकर्ता, आंगनवाड़ी सहायिका या आशा हो।\n• NFSA, 2013 के तहत राशन कार्ड हो।\n• केंद्र सरकार द्वारा घोषित किसी अन्य श्रेणी में आती हो।"}, {"id": "PMMVY-B2", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Who is not eligible for PMMVY?", "q_hi": "PMMVY का लाभ कौन नहीं ले सकता?", "alt_en": "Who cannot apply for PMMVY?", "alt_hi": "योजना का लाभ किसे नहीं मिलता?", "kw": "not eligible, ineligible, government employee, अपात्र, नहीं मिलेगा", "aud": "All", "wa_en": "*Who is not eligible for PMMVY?*\n\n*The following persons are not eligible:*\n• Men.\n• Women employed by the Central Government, State Government, or any PSU.\n• Women below 18 years or above 55 years of age.\n• Women who do not meet any of the prescribed eligibility criteria.", "wa_hi": "*PMMVY का लाभ कौन नहीं ले सकता?*\n\n*ये लोग पात्र नहीं हैं:*\n• पुरुष।\n• केंद्र सरकार, राज्य सरकार या किसी PSU में नौकरी करने वाली महिलाएँ।\n• 18 वर्ष से कम या 55 वर्ष से अधिक आयु की महिलाएँ।\n• वे महिलाएँ जो पात्रता की किसी भी श्रेणी में नहीं आतीं।"}, {"id": "PMMVY-B3", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "If a woman's husband or another family member is a government employee, can she get PMMVY?", "q_hi": "क्या सरकारी नौकरी वाले पति या परिवार के सदस्य वाली महिला PMMVY का लाभ ले सकती है?", "alt_en": "My husband has a government job, can I still apply?", "alt_hi": "पति सरकारी नौकरी में है, क्या मुझे पैसा मिलेगा?", "kw": "husband government job, family member, पति सरकारी, सरकारी नौकरी, sarkari naukri, pati sarkari", "aud": "Beneficiary", "wa_en": "*If a woman's husband or another family member is a government employee, can she get PMMVY?*\n\n*Yes.* A woman who is herself a regular Government/PSU employee is not eligible. However, a woman does not become ineligible just because her husband or another family member is a government employee, provided she meets the other conditions herself. Ineligibility applies only when the woman herself is a regular Government/PSU employee or is receiving similar benefits under another law. ASHA and Anganwadi workers are eligible if they meet the other conditions.", "wa_hi": "*क्या सरकारी नौकरी वाले पति या परिवार के सदस्य वाली महिला PMMVY का लाभ ले सकती है?*\n\n*हाँ।* जो महिला स्वयं नियमित सरकारी/PSU कर्मचारी है, वह पात्र नहीं है। लेकिन पति या परिवार के किसी अन्य सदस्य के सरकारी कर्मचारी होने से महिला अपात्र नहीं होती, बशर्ते वह स्वयं बाकी शर्तें पूरी करती हो। अपात्रता केवल तभी लागू होगी जब महिला स्वयं नियमित सरकारी/PSU कर्मचारी हो या किसी अन्य कानून के तहत ऐसा ही लाभ ले रही हो। आशा और आंगनवाड़ी कार्यकर्ता बाकी शर्तें पूरी करने पर पात्र हैं।"}, {"id": "PMMVY-B4", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Is a woman working on contract considered a government employee?", "q_hi": "क्या संविदा (Contract) पर काम करने वाली महिला को सरकारी कर्मचारी माना जाएगा?", "alt_en": "I work on contract, am I a government employee?", "alt_hi": "मैं संविदा पर हूँ, क्या मुझे लाभ मिलेगा?", "kw": "contract, contractual, samvida, संविदा, कॉन्ट्रैक्ट", "aud": "Beneficiary", "wa_en": "*Is a woman working on contract considered a government employee?*\n\n*No.* A contractual employee is not considered a regular government employee. She can avail PMMVY benefits if she meets the other eligibility conditions.", "wa_hi": "*क्या संविदा (Contract) पर काम करने वाली महिला को सरकारी कर्मचारी माना जाएगा?*\n\n*नहीं*, संविदा कर्मचारी को नियमित सरकारी कर्मचारी नहीं माना जाता। बाकी पात्रता शर्तें पूरी करने पर वह PMMVY का लाभ ले सकती है।"}, {"id": "PMMVY-B5", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "What is the age limit for beneficiaries?", "q_hi": "हितग्राही की आयु सीमा क्या है?", "alt_en": "What age should the mother be?", "alt_hi": "माँ की उम्र कितनी होनी चाहिए?", "kw": "age limit, minimum age, 18 years, 55, उम्र, आयु सीमा", "aud": "All", "wa_en": "*What is the age limit for beneficiaries?*\n\nThe beneficiary must be at least 18 years and 7 months old and below 55 years of age at the time of childbirth.", "wa_hi": "*हितग्राही की आयु सीमा क्या है?*\n\nप्रसव के समय हितग्राही की आयु कम से कम 18 वर्ष 7 महीने और 55 वर्ष से कम होनी चाहिए।"}, {"id": "PMMVY-B6", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Can a woman married as a minor be registered under PMMVY?", "q_hi": "क्या नाबालिग विवाह के मामले में महिला का PMMVY में पंजीकरण किया जा सकता है?", "alt_en": "Can we register a girl married before 18?", "alt_hi": "18 साल से पहले शादी हुई हो तो पंजीकरण होगा?", "kw": "minor marriage, child marriage, under 18, नाबालिग, बाल विवाह", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Can a woman married as a minor be registered under PMMVY?*\n\n*No.* A woman or girl below the legal age of marriage (below 18 years) cannot be registered.", "wa_hi": "*क्या नाबालिग विवाह के मामले में महिला का PMMVY में पंजीकरण किया जा सकता है?*\n\n*नहीं।* कानूनन विवाह की आयु से कम (18 वर्ष से कम) की महिला/लड़की का पंजीकरण नहीं किया जा सकता।"}, {"id": "PMMVY-B7", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "If the woman is 18 years or older but her husband is below 18, can she avail PMMVY?", "q_hi": "यदि महिला की आयु 18 वर्ष या अधिक है, लेकिन पति की आयु 18 वर्ष से कम है, तो क्या महिला PMMVY का लाभ ले सकती है?", "alt_en": "Wife is above 18 but husband is under 18, is she eligible?", "alt_hi": "पत्नी 18 से ऊपर, पति 18 से कम, क्या लाभ मिलेगा?", "kw": "husband under 18, husband age, पति की उम्र, 18 से कम", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the woman is 18 years or older but her husband is below 18, can she avail PMMVY?*\n\n*Yes.* The woman will be eligible if she herself is 18 years or older and meets the other conditions.", "wa_hi": "*यदि महिला की आयु 18 वर्ष या अधिक है, लेकिन पति की आयु 18 वर्ष से कम है, तो क्या महिला PMMVY का लाभ ले सकती है?*\n\n*हाँ।* महिला स्वयं 18 वर्ष या अधिक की हो और बाकी शर्तें पूरी करती हो, तो वह पात्र होगी।"}, {"id": "PMMVY-B8", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "If a woman is divorced, how can one check whether she was registered under PMMVY earlier?", "q_hi": "यदि महिला तलाकशुदा है, तो कैसे पता करें कि उसका पहले PMMVY में पंजीकरण हुआ है या नहीं?", "alt_en": "How to check old registration of a divorced woman?", "alt_hi": "तलाकशुदा महिला का पुराना पंजीकरण कैसे देखें?", "kw": "divorced, divorce, old registration, तलाक, पुराना पंजीकरण", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a woman is divorced, how can one check whether she was registered under PMMVY earlier?*\n\nSearching with the woman's Aadhaar number on the PMMVY portal/app automatically shows any earlier registration and benefit status.", "wa_hi": "*यदि महिला तलाकशुदा है, तो कैसे पता करें कि उसका पहले PMMVY में पंजीकरण हुआ है या नहीं?*\n\nमहिला के आधार नंबर से PMMVY पोर्टल/ऐप में खोजने पर पुराना पंजीकरण और मिले हुए लाभ की स्थिति अपने-आप दिख जाती है।"}, {"id": "PMMVY-B9", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Can a woman from a love-marriage couple be registered under PMMVY?", "q_hi": "क्या प्रेम विवाह करने वाली महिला का PMMVY में पंजीकरण किया जा सकता है?", "alt_en": "We had a love marriage, can I register?", "alt_hi": "प्रेम विवाह किया है, क्या पंजीकरण होगा?", "kw": "love marriage, prem vivah, प्रेम विवाह, लव मैरिज", "aud": "Beneficiary", "wa_en": "*Can a woman from a love-marriage couple be registered under PMMVY?*\n\n*Yes.* Marital status is not a barrier to eligibility. If she meets the other eligibility conditions, she can be registered through the normal process.", "wa_hi": "*क्या प्रेम विवाह करने वाली महिला का PMMVY में पंजीकरण किया जा सकता है?*\n\n*हाँ*, विवाह का प्रकार पात्रता में बाधा नहीं है। बाकी पात्रता शर्तें पूरी होने पर सामान्य प्रक्रिया से पंजीकरण किया जा सकता है।"}, {"id": "PMMVY-B10", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Is PMMVY implemented across all districts of India?", "q_hi": "क्या PMMVY भारत के सभी जिलों में लागू है?", "alt_en": "Is PMMVY available in every district?", "alt_hi": "क्या यह योजना हर जिले में है?", "kw": "all districts, Telangana, coverage, सभी जिले, तेलंगाना", "aud": "All", "wa_en": "*Is PMMVY implemented across all districts of India?*\n\n*Yes.* PMMVY has been implemented in all districts of India since 1 January 2017. However, it is currently not being implemented in Telangana, as the state operates its own maternity benefit scheme.", "wa_hi": "*क्या PMMVY भारत के सभी जिलों में लागू है?*\n\n*हाँ।* 1 जनवरी 2017 से PMMVY देश के सभी जिलों में लागू है। लेकिन अभी तेलंगाना में यह लागू नहीं है, क्योंकि वहाँ राज्य की अपनी मातृत्व लाभ योजना चलती है।"}, {"id": "PMMVY-B11", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Can a surrogacy mother register for PMMVY benefits?", "q_hi": "क्या सरोगेसी (किराये की कोख) वाली माँ PMMVY में पंजीकरण करा सकती है?", "alt_en": "Can a surrogate mother apply?", "alt_hi": "सरोगेट माँ आवेदन कर सकती है?", "kw": "surrogacy, surrogate, सरोगेसी, किराये की कोख", "aud": "Beneficiary", "wa_en": "*Can a surrogacy mother register for PMMVY benefits?*\n\n*Yes.* The PMMVY system does not have a field for the father, so a surrogate mother can register for the scheme on the basis of her own eligibility and claim DBT payments as per the applicable conditionalities.", "wa_hi": "*क्या सरोगेसी (किराये की कोख) वाली माँ PMMVY में पंजीकरण करा सकती है?*\n\n*हाँ।* PMMVY में पिता की जानकारी का कोई कॉलम नहीं है। इसलिए सरोगेट माँ अपनी पात्रता के आधार पर पंजीकरण करा सकती है और शर्तें पूरी करने पर DBT से राशि ले सकती है।"}, {"id": "PMMVY-B12", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Are adoption cases eligible under PMMVY?", "q_hi": "क्या बच्चा गोद लेने पर PMMVY का लाभ मिलता है?", "alt_en": "We adopted a baby, will we get PMMVY?", "alt_hi": "बच्चा गोद लिया है, क्या पैसा मिलेगा?", "kw": "adoption, adopted child, गोद लेना, गोद लिया", "aud": "Beneficiary", "wa_en": "*Are adoption cases eligible under PMMVY?*\n\n*No.* PMMVY applies exclusively to pregnancy and childbirth. Adoption cases are not covered under this scheme.", "wa_hi": "*क्या बच्चा गोद लेने पर PMMVY का लाभ मिलता है?*\n\n*नहीं।* PMMVY केवल गर्भावस्था और प्रसव से जुड़ी योजना है। गोद लेने के मामले इसमें शामिल नहीं हैं।"}, {"id": "PMMVY-B13", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "How can an e-Shram card be obtained?", "q_hi": "ई-श्रम कार्ड कैसे बनवाएँ?", "alt_en": "How do I make an e-Shram card?", "alt_hi": "ई-श्रम कार्ड कैसे बनेगा?", "kw": "e-Shram, eshram card, ई-श्रम, श्रम कार्ड", "aud": "Beneficiary", "wa_en": "*How can an e-Shram card be obtained?*\n\nAn e-Shram card can be obtained online using a bank account number, Aadhaar number, and mobile number. The process is simple and the card is issued instantly.", "wa_hi": "*ई-श्रम कार्ड कैसे बनवाएँ?*\n\nई-श्रम कार्ड बैंक खाता नंबर, आधार नंबर और मोबाइल नंबर से ऑनलाइन बनवाया जा सकता है। प्रक्रिया आसान है और कार्ड तुरंत बन जाता है।"}, {"id": "PMMVY-B14", "t": "A", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "What does PVTG mean, and why does it matter for PMMVY?", "q_hi": "PVTG का क्या अर्थ है और PMMVY में इसका क्या महत्व है?", "alt_en": "What is PVTG?", "alt_hi": "PVTG का मतलब क्या है?", "kw": "PVTG, tribal group, जनजाति, आदिवासी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What does PVTG mean, and why does it matter for PMMVY?*\n\nPVTG stands for Particularly Vulnerable Tribal Group. These groups are among the most socially and economically backward, so they are given special priority under PMMVY.", "wa_hi": "*PVTG का क्या अर्थ है और PMMVY में इसका क्या महत्व है?*\n\nPVTG का अर्थ है Particularly Vulnerable Tribal Group (विशेष रूप से कमज़ोर जनजातीय समूह)। ये समूह सामाजिक और आर्थिक रूप से बहुत पिछड़े हैं, इसलिए PMMVY में इन्हें विशेष प्राथमिकता दी जाती है।"}, {"id": "PMMVY-B15", "t": "S", "sec_en": "B. Eligibility & Coverage", "sec_hi": "B. पात्रता और कवरेज", "q_en": "Why are beneficiaries from Particularly Vulnerable Tribal Group (PVTG) communities being excluded?", "q_hi": "PVTG समुदाय की हितग्राही योजना से क्यों छूट जाती हैं?", "alt_en": "Why are PVTG women left out of PMMVY?", "alt_hi": "PVTG महिलाएँ योजना से क्यों छूट जाती हैं?", "kw": "PVTG exclusion, no Aadhaar, birth registration, छूट जाना, आधार नहीं", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why are beneficiaries from Particularly Vulnerable Tribal Group (PVTG) communities being excluded?*\n\nIn PVTG communities, many women often do not have their birth registered, so their Aadhaar cannot be made. Without Aadhaar, they cannot be entered into the system.", "wa_hi": "*PVTG समुदाय की हितग्राही योजना से क्यों छूट जाती हैं?*\n\nPVTG समुदाय में प्रायः कई महिलाओं का जन्म पंजीकरण नहीं हुआ होता, इसलिए उनका आधार नहीं बन पाता। आधार न होने से वे सिस्टम में दर्ज नहीं हो पातीं।"}, {"id": "PMMVY-C1", "t": "S", "sec_en": "C. Benefits & Financial Entitlements", "sec_hi": "C. लाभ और मिलने वाली राशि", "q_en": "What financial assistance is provided under PMMVY?", "q_hi": "PMMVY में कितनी राशि मिलती है?", "alt_en": "How much money will I get under PMMVY?", "alt_hi": "योजना में कितना पैसा मिलता है?", "kw": "amount, 5000, 6000, instalment, kitna paisa, राशि, किस्त, कितना पैसा", "aud": "Beneficiary", "wa_en": "*What financial assistance is provided under PMMVY?*\n\n*First Child:* ₹5,000 disbursed in two instalments.\n\n• *Instalment 1 (₹3,000):* Upon pregnancy registration and completion of at least one Antenatal Check-up (ANC).\n• *Instalment 2 (₹2,000):* Upon birth registration and completion of the first cycle of universal immunisation (within 14 weeks of birth).\n\n*Second Child (Girl only):* ₹6,000 disbursed as a single instalment after birth registration and completion of the first cycle of universal immunisation within 14 weeks of birth.\n\n*Note:* Beneficiaries who deliver at an institution are also entitled to benefits under the Janani Suraksha Yojana (JSY), administered by the Ministry of Health and Family Welfare.", "wa_hi": "*PMMVY में कितनी राशि मिलती है?*\n\n*पहला बच्चा:* कुल ₹5,000, दो किस्तों में।\n\n• *पहली किस्त (₹3,000):* गर्भावस्था पंजीकरण और कम से कम एक प्रसव-पूर्व जाँच (ANC) होने पर।\n• *दूसरी किस्त (₹2,000):* बच्चे का जन्म पंजीकरण और जन्म के 14 सप्ताह के भीतर पहले चक्र का टीकाकरण पूरा होने पर।\n\n*दूसरा बच्चा (केवल बेटी होने पर):* ₹6,000 एक ही किस्त में, जन्म पंजीकरण और 14 सप्ताह के भीतर पहले चक्र का टीकाकरण पूरा होने पर।\n\n*ध्यान दें:* अस्पताल या स्वास्थ्य केंद्र में प्रसव कराने वाली हितग्राही को स्वास्थ्य मंत्रालय की जननी सुरक्षा योजना (JSY) का लाभ भी अलग से मिलता है।"}, {"id": "PMMVY-C2", "t": "S", "sec_en": "C. Benefits & Financial Entitlements", "sec_hi": "C. लाभ और मिलने वाली राशि", "q_en": "How are PMMVY benefits transferred to beneficiaries?", "q_hi": "PMMVY की राशि हितग्राही तक कैसे पहुँचती है?", "alt_en": "How will the money reach me?", "alt_hi": "पैसा कैसे और कहाँ आएगा?", "kw": "transfer, DBT, bank account, CDPO approval, पैसा कैसे आएगा", "aud": "Beneficiary", "wa_en": "*How are PMMVY benefits transferred to beneficiaries?*\n\nAfter the beneficiary's registration is completed and the application is approved by the CDPO, the benefit amount is directly credited to the beneficiary's Aadhaar-linked bank/post office account through the Direct Benefit Transfer (DBT) mechanism.", "wa_hi": "*PMMVY की राशि हितग्राही तक कैसे पहुँचती है?*\n\nपंजीकरण पूरा होने और CDPO से आवेदन स्वीकृत होने के बाद राशि DBT के माध्यम से सीधे हितग्राही के आधार से जुड़े बैंक/पोस्ट ऑफिस खाते में जमा होती है।"}, {"id": "PMMVY-C3", "t": "S", "sec_en": "C. Benefits & Financial Entitlements", "sec_hi": "C. लाभ और मिलने वाली राशि", "q_en": "How are twin or multiple births handled under PMMVY?", "q_hi": "जुड़वाँ या एक से अधिक बच्चे होने पर लाभ कैसे मिलेगा?", "alt_en": "I had twins, how much will I get?", "alt_hi": "जुड़वाँ बच्चे हुए हैं, कितना पैसा मिलेगा?", "kw": "twins, multiple births, jaudwa, जुड़वाँ, दो बच्चे", "aud": "Beneficiary", "wa_en": "*How are twin or multiple births handled under PMMVY?*\n\nBenefits under PMMVY are linked to pregnancy, not parity. The following rules apply:\n\n*First Pregnancy, ₹5,000 (first child benefit only):*\n• *Twin girls:* ₹5,000\n• *Twin boys:* ₹5,000\n• *One boy and one girl:* ₹5,000\n\n*Second Pregnancy, ₹6,000 (second child benefit, girl child only):*\n• *Twin girls:* ₹6,000\n• *Twin boys:* No benefit\n• *One boy and one girl:* ₹6,000 (for the girl child)", "wa_hi": "*जुड़वाँ या एक से अधिक बच्चे होने पर लाभ कैसे मिलेगा?*\n\nPMMVY में लाभ गर्भावस्था के आधार पर मिलता है, बच्चों की संख्या के आधार पर नहीं। नियम इस प्रकार हैं:\n\n*पहली गर्भावस्था, ₹5,000 (केवल पहले बच्चे का लाभ):*\n• *जुड़वाँ बेटियाँ:* ₹5,000\n• *जुड़वाँ बेटे:* ₹5,000\n• *एक बेटा और एक बेटी:* ₹5,000\n\n*दूसरी गर्भावस्था, ₹6,000 (केवल बेटी होने पर):*\n• *जुड़वाँ बेटियाँ:* ₹6,000\n• *जुड़वाँ बेटे:* कोई लाभ नहीं\n• *एक बेटा और एक बेटी:* ₹6,000 (बेटी के लिए)"}, {"id": "PMMVY-D1", "t": "S", "sec_en": "D. PMMVY 2.0 & Policy Changes", "sec_hi": "D. PMMVY 2.0 और नियमों में बदलाव", "q_en": "What are the new features introduced in PMMVY 2.0?", "q_hi": "PMMVY 2.0 में कौन-सी नई सुविधाएँ जोड़ी गई हैं?", "alt_en": "What is new in PMMVY 2.0?", "alt_hi": "PMMVY 2.0 में क्या नया है?", "kw": "PMMVY 2.0, new features, second girl, नई सुविधा", "aud": "All", "wa_en": "*What are the new features introduced in PMMVY 2.0?*\n\nThe following changes were introduced under PMMVY 2.0:\n• Benefit for the second child (girl child) has been introduced to encourage an improved Sex Ratio at Birth and discourage female foeticide.\n• Benefits for the first child are disbursed in two instalments (reduced from 3); for the second child (if a girl), in a single instalment.\n• In the event of a miscarriage, stillbirth or death of the child, the beneficiary is treated as a fresh applicant in any subsequent pregnancy.\n• The mandatory requirement of the husband's Aadhaar has been removed.\n• Mandatory biometric facial authentication of the beneficiary is required, either through POSHAN Tracker or the PMMVYsoft app.", "wa_hi": "*PMMVY 2.0 में कौन-सी नई सुविधाएँ जोड़ी गई हैं?*\n\nPMMVY 2.0 में ये बदलाव हुए:\n• जन्म के समय लिंगानुपात सुधारने और कन्या भ्रूण हत्या रोकने के लिए दूसरी संतान बेटी होने पर लाभ शुरू किया गया।\n• पहले बच्चे का लाभ अब 3 की जगह 2 किस्तों में मिलता है। दूसरी संतान बेटी होने पर लाभ एक ही किस्त में मिलता है।\n• गर्भपात, मृत शिशु जन्म या बच्चे की मृत्यु होने पर अगली गर्भावस्था में महिला को नई आवेदक माना जाता है।\n• पति का आधार अनिवार्य होने की शर्त हटा दी गई है।\n• हितग्राही का चेहरे से आधार सत्यापन अनिवार्य है, जो पोषण ट्रैकर या PMMVYsoft ऐप से किया जाता है।"}, {"id": "PMMVY-D2", "t": "S", "sec_en": "D. PMMVY 2.0 & Policy Changes", "sec_hi": "D. PMMVY 2.0 और नियमों में बदलाव", "q_en": "What are the key improvements in PMMVY 2.0 compared to PMMVY 1.0?", "q_hi": "PMMVY 1.0 की तुलना में PMMVY 2.0 में मुख्य सुधार क्या हैं?", "alt_en": "What is the difference between PMMVY 1.0 and 2.0?", "alt_hi": "PMMVY 1.0 और 2.0 में क्या फर्क है?", "kw": "1.0 vs 2.0, difference, comparison, अंतर, फर्क", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What are the key improvements in PMMVY 2.0 compared to PMMVY 1.0?*\n\n*The table below summarises the major differences:*\n\n▪️ *PMMVY 1.0:* Aadhaar was mandatory only for the 3rd instalment.\n   *PMMVY 2.0:* Aadhaar is mandatory at registration; Aadhaar-based payment is compulsory.\n\n▪️ *PMMVY 1.0:* Single-level check at Sanctioning Officer.\n   *PMMVY 2.0:* Two-level verification for every function to ensure validity and authenticity.\n\n▪️ *PMMVY 1.0:* Benefits disbursed in 3 instalments for the first child.\n   *PMMVY 2.0:* Benefits disbursed in 2 instalments for the first child; single instalment for second child (if girl).\n\n▪️ *PMMVY 1.0:* No provision for the second girl child.\n   *PMMVY 2.0:* Benefit for the second child (girl) has been introduced.\n\n▪️ *PMMVY 1.0:* Self-registration available only in Delhi & UP as a pilot; not a fully online solution.\n   *PMMVY 2.0:* Self-registration via the PMMVY portal and mobile app is available nationwide (currently paused).\n\n▪️ *PMMVY 1.0:* No mobile app.\n   *PMMVY 2.0:* Mobile app available for Anganwadi workers, ASHA workers, and individual beneficiaries.\n\n▪️ *PMMVY 1.0:* No re-registration in case of miscarriage or stillbirth.\n   *PMMVY 2.0:* In case of miscarriage, stillbirth or death of child, the beneficiary is treated as a fresh applicant in any subsequent pregnancy.", "wa_hi": "*PMMVY 1.0 की तुलना में PMMVY 2.0 में मुख्य सुधार क्या हैं?*\n\n*मुख्य अंतर नीचे की तालिका में दिए गए हैं:*\n\n▪️ *PMMVY 1.0:* आधार केवल तीसरी किस्त के लिए ज़रूरी था।\n   *PMMVY 2.0:* पंजीकरण के समय ही आधार ज़रूरी है और भुगतान भी आधार से ही होता है।\n\n▪️ *PMMVY 1.0:* केवल स्वीकृति अधिकारी स्तर पर एक बार जाँच होती थी।\n   *PMMVY 2.0:* हर काम की दो स्तर पर जाँच होती है, ताकि जानकारी सही और प्रामाणिक रहे।\n\n▪️ *PMMVY 1.0:* पहले बच्चे का लाभ 3 किस्तों में मिलता था।\n   *PMMVY 2.0:* पहले बच्चे का लाभ 2 किस्तों में और दूसरी बेटी का लाभ एक किस्त में मिलता है।\n\n▪️ *PMMVY 1.0:* दूसरी बेटी के लिए कोई लाभ नहीं था।\n   *PMMVY 2.0:* दूसरी संतान बेटी होने पर लाभ शुरू किया गया है।\n\n▪️ *PMMVY 1.0:* स्वयं पंजीकरण केवल दिल्ली और उत्तर प्रदेश में प्रयोग के तौर पर था, पूरी तरह ऑनलाइन नहीं था।\n   *PMMVY 2.0:* PMMVY पोर्टल और मोबाइल ऐप से स्वयं पंजीकरण पूरे देश में उपलब्ध है (अभी रोका गया है)।\n\n▪️ *PMMVY 1.0:* कोई मोबाइल ऐप नहीं था।\n   *PMMVY 2.0:* आंगनवाड़ी कार्यकर्ता, आशा और हितग्राही के लिए मोबाइल ऐप उपलब्ध है।\n\n▪️ *PMMVY 1.0:* गर्भपात या मृत शिशु जन्म पर दोबारा पंजीकरण नहीं होता था।\n   *PMMVY 2.0:* गर्भपात, मृत शिशु जन्म या बच्चे की मृत्यु पर अगली गर्भावस्था में महिला को नई आवेदक माना जाता है।"}, {"id": "PMMVY-D3", "t": "S", "sec_en": "D. PMMVY 2.0 & Policy Changes", "sec_hi": "D. PMMVY 2.0 और नियमों में बदलाव", "q_en": "Is there a mobile app for PMMVY?", "q_hi": "क्या PMMVY का कोई मोबाइल ऐप है?", "alt_en": "Is there a PMMVY app and where to download it?", "alt_hi": "PMMVY का ऐप कहाँ से डाउनलोड करें?", "kw": "app, PMMVYsoft, download, Play Store, ऐप, डाउनलोड", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Is there a mobile app for PMMVY?*\n\n*Yes.* The PMMVYsoft app is available for all AWWs/ASHAs and Lady Supervisors. It can be downloaded from https://pmmvy.wcd.gov.in and is also available on the Google Play Store. Key features include:\n• Beneficiary registration and tracking.\n• Recording of childbirth and immunisation details.\n• Initiating and approving payment generation.\n• Searching and tracking individual applications.\n• Integration with POSHAN Tracker and due-list generation.", "wa_hi": "*क्या PMMVY का कोई मोबाइल ऐप है?*\n\n*हाँ।* PMMVYsoft ऐप सभी आंगनवाड़ी कार्यकर्ताओं, आशा और सुपरवाइजर के लिए उपलब्ध है। इसे https://pmmvy.wcd.gov.in से या Google Play Store से डाउनलोड किया जा सकता है। इसकी मुख्य सुविधाएँ:\n• हितग्राही का पंजीकरण और ट्रैकिंग।\n• प्रसव और टीकाकरण की जानकारी दर्ज करना।\n• भुगतान की प्रक्रिया शुरू करना और स्वीकृत करना।\n• किसी भी आवेदन को खोजना और उसकी स्थिति देखना।\n• पोषण ट्रैकर से जुड़ाव और Due List बनाना।"}, {"id": "PMMVY-E1", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "How can a beneficiary apply for PMMVY?", "q_hi": "हितग्राही PMMVY के लिए आवेदन कैसे करे?", "alt_en": "How do I apply for PMMVY?", "alt_hi": "योजना का फॉर्म कैसे भरें?", "kw": "apply, application, how to apply, AWC, आवेदन, फॉर्म कहाँ भरें", "aud": "Beneficiary", "wa_en": "*How can a beneficiary apply for PMMVY?*\n\nA beneficiary can apply by visiting the nearest Anganwadi Centre or through the ASHA worker, who will complete the registration form online using the PMMVYsoft application.", "wa_hi": "*हितग्राही PMMVY के लिए आवेदन कैसे करे?*\n\nहितग्राही नज़दीकी आंगनवाड़ी केंद्र पर जाकर या आशा कार्यकर्ता के माध्यम से आवेदन कर सकती है। कार्यकर्ता PMMVYsoft ऐप में ऑनलाइन फॉर्म भरती हैं।"}, {"id": "PMMVY-E2", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "What are the steps in the beneficiary registration workflow?", "q_hi": "हितग्राही के पंजीकरण की प्रक्रिया के चरण क्या हैं?", "alt_en": "What are the steps of registration?", "alt_hi": "पंजीकरण के कितने चरण हैं?", "kw": "registration steps, workflow, AWW LS CDPO, चरण, प्रक्रिया", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What are the steps in the beneficiary registration workflow?*\n\n*The registration workflow follows three steps:*\n• *Step 1, Registration:* Completed by the Anganwadi Worker (AWW).\n• *Step 2, Verification:* Reviewed by the Lady Supervisor (LS).\n• *Step 3, Approval:* Finalised by the CDPO.", "wa_hi": "*हितग्राही के पंजीकरण की प्रक्रिया के चरण क्या हैं?*\n\n*पंजीकरण तीन चरणों में होता है:*\n• *चरण 1, पंजीकरण:* आंगनवाड़ी कार्यकर्ता द्वारा।\n• *चरण 2, सत्यापन:* सुपरवाइजर (LS) द्वारा जाँच।\n• *चरण 3, स्वीकृति:* CDPO द्वारा अंतिम मंज़ूरी।"}, {"id": "PMMVY-E3", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "What are the key components of the beneficiary application?", "q_hi": "हितग्राही के आवेदन में कौन-सी मुख्य चीज़ें ज़रूरी हैं?", "alt_en": "What must be complete in the application?", "alt_hi": "आवेदन में क्या-क्या पूरा होना ज़रूरी है?", "kw": "application components, FRS, NPCI, Aadhaar, आवेदन पूरा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What are the key components of the beneficiary application?*\n\n*A complete application must include the following:*\n• Aadhaar, general and pregnancy-related information about the beneficiary.\n• Facial Recognition (FRS) through POSHAN Tracker, or Face Authentication via the PMMVYsoft mobile app.\n• Aadhaar seeding with the beneficiary's bank account (NPCI mapping).\n\nIf any of the above components are incomplete, the registration cannot be finalised.", "wa_hi": "*हितग्राही के आवेदन में कौन-सी मुख्य चीज़ें ज़रूरी हैं?*\n\n*पूरे आवेदन में ये तीनों चीज़ें होनी चाहिए:*\n• हितग्राही का आधार, सामान्य जानकारी और गर्भावस्था की जानकारी।\n• पोषण ट्रैकर से FRS या PMMVYsoft ऐप से चेहरे का सत्यापन (Face Authentication)।\n• हितग्राही के बैंक खाते से आधार का जुड़ाव (NPCI मैपिंग)।\n\nइनमें से कोई भी काम अधूरा रहने पर पंजीकरण पूरा नहीं होगा।"}, {"id": "PMMVY-E4", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Which documents are needed for PMMVY registration?", "q_hi": "PMMVY पंजीकरण के लिए कौन-कौन से दस्तावेज़ ज़रूरी हैं?", "alt_en": "What documents are needed for PMMVY?", "alt_hi": "कौन-कौन से कागज़ चाहिए?", "kw": "documents, papers, MCP card, passbook, दस्तावेज़, कागज़", "aud": "Beneficiary", "wa_en": "*Which documents are needed for PMMVY registration?*\n\nAadhaar card, MCP card, bank/post office passbook, eligibility certificate, and the child's birth certificate and immunisation card.", "wa_hi": "*PMMVY पंजीकरण के लिए कौन-कौन से दस्तावेज़ ज़रूरी हैं?*\n\nआधार कार्ड, MCP कार्ड, बैंक/पोस्ट ऑफिस पासबुक, पात्रता प्रमाण पत्र, बच्चे का जन्म प्रमाण पत्र और टीकाकरण कार्ड।"}, {"id": "PMMVY-E5", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If the beneficiary does not have the required documents (Aadhaar, MCP card or bank passbook), how should registration be done?", "q_hi": "यदि हितग्राही के पास आधार, MCP कार्ड, बैंक पासबुक जैसे ज़रूरी दस्तावेज़ न हों, तो पंजीकरण कैसे करें?", "alt_en": "Beneficiary has no documents, how to register?", "alt_hi": "हितग्राही के पास कागज़ नहीं हैं, पंजीकरण कैसे करें?", "kw": "no documents, missing papers, कागज़ नहीं, दस्तावेज़ नहीं", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the beneficiary does not have the required documents (Aadhaar, MCP card or bank passbook), how should registration be done?*\n\nFirst help her get the missing documents made (Aadhaar enrolment, bank account). Where applicable, do a partial registration based on the available information and update the details once the documents are received. Aadhaar is mandatory for PMMVY registration.", "wa_hi": "*यदि हितग्राही के पास आधार, MCP कार्ड, बैंक पासबुक जैसे ज़रूरी दस्तावेज़ न हों, तो पंजीकरण कैसे करें?*\n\nपहले ज़रूरी दस्तावेज़ (आधार नामांकन, बैंक खाता) बनवाने में मदद करें। लागू हो तो उपलब्ध जानकारी के आधार पर आंशिक पंजीकरण करें और दस्तावेज़ मिलने पर विवरण अपडेट करें। PMMVY पंजीकरण के लिए आधार होना अनिवार्य है।"}, {"id": "PMMVY-E6", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If the beneficiary has no Aadhaar card, can a temporary registration be done using another ID?", "q_hi": "यदि हितग्राही के पास आधार कार्ड नहीं है, तो क्या किसी दूसरे पहचान पत्र से अस्थायी पंजीकरण हो सकता है?", "alt_en": "I don't have Aadhaar, can I register with another ID?", "alt_hi": "मेरा आधार नहीं है, क्या दूसरे कार्ड से फॉर्म भरेगा?", "kw": "no Aadhaar, enrolment slip, other ID, आधार नहीं, आधार पर्ची", "aud": "Beneficiary", "wa_en": "*If the beneficiary has no Aadhaar card, can a temporary registration be done using another ID?*\n\nAadhaar is a mandatory document, so Aadhaar enrolment must be done first. A temporary registration may be possible on the basis of the Aadhaar enrolment slip, but final approval will be given only after the Aadhaar is generated.", "wa_hi": "*यदि हितग्राही के पास आधार कार्ड नहीं है, तो क्या किसी दूसरे पहचान पत्र से अस्थायी पंजीकरण हो सकता है?*\n\nआधार अनिवार्य दस्तावेज़ है, इसलिए पहले आधार नामांकन कराना ज़रूरी है। आधार नामांकन पर्ची के आधार पर अस्थायी पंजीकरण संभव हो सकता है, लेकिन अंतिम स्वीकृति आधार बनने के बाद ही मिलेगी।"}, {"id": "PMMVY-E7", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a couple does not have the required documents after marriage, how should the PMMVY form be filled?", "q_hi": "यदि शादी के बाद दंपति के पास ज़रूरी दस्तावेज़ नहीं हैं, तो PMMVY फॉर्म कैसे भरें?", "alt_en": "Couple has no documents after marriage, how to fill the form?", "alt_hi": "शादी के बाद दंपति के पास कागज़ नहीं, फॉर्म कैसे भरें?", "kw": "after marriage, couple, no documents, शादी के बाद, दंपति", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a couple does not have the required documents after marriage, how should the PMMVY form be filled?*\n\nFirst help them get Aadhaar, a bank account and an eligibility certificate made. The PMMVY form cannot be filled without the required documents. Proceed with the form based on the documents that are available.", "wa_hi": "*यदि शादी के बाद दंपति के पास ज़रूरी दस्तावेज़ नहीं हैं, तो PMMVY फॉर्म कैसे भरें?*\n\nपहले आधार, बैंक खाता और पात्रता प्रमाण पत्र बनवाने में मदद करें। ज़रूरी दस्तावेज़ों के बिना PMMVY फॉर्म भरना संभव नहीं है। जो दस्तावेज़ उपलब्ध हों, उनके आधार पर फॉर्म आगे बढ़ाएँ।"}, {"id": "PMMVY-E8", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If the woman does not have a marriage certificate, is there an alternative?", "q_hi": "यदि महिला के पास विवाह प्रमाण पत्र नहीं है, तो क्या कोई दूसरा रास्ता है?", "alt_en": "I don't have a marriage certificate, what can I give?", "alt_hi": "शादी का प्रमाण पत्र नहीं है, क्या करें?", "kw": "marriage certificate, self-declaration, विवाह प्रमाण पत्र, शादी का सर्टिफिकेट", "aud": "Beneficiary", "wa_en": "*If the woman does not have a marriage certificate, is there an alternative?*\n\nPMMVY has no eligibility condition linked to a marriage certificate. If needed, a self-declaration or a local certificate issued by the Gram Panchayat/Ward can be used as an alternative.", "wa_hi": "*यदि महिला के पास विवाह प्रमाण पत्र नहीं है, तो क्या कोई दूसरा रास्ता है?*\n\nPMMVY में विवाह प्रमाण पत्र से जुड़ी कोई पात्रता शर्त नहीं है। ज़रूरत हो तो स्व-घोषणा पत्र या ग्राम पंचायत/वार्ड का स्थानीय प्रमाण पत्र दिया जा सकता है।"}, {"id": "PMMVY-E9", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a wrong date of birth in Aadhaar shows the woman as 'Under Age' and she has no birth certificate, what should be done?", "q_hi": "यदि आधार में गलत जन्मतिथि के कारण महिला 'Under Age' दिख रही है और जन्म प्रमाण पत्र नहीं है, तो क्या करें?", "alt_en": "Aadhaar shows wrong DOB and Under Age, no birth certificate, what to do?", "alt_hi": "आधार में गलत जन्मतिथि से Under Age दिख रहा है, क्या करें?", "kw": "under age, wrong DOB, date of birth, गलत जन्मतिथि, अंडर एज", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a wrong date of birth in Aadhaar shows the woman as 'Under Age' and she has no birth certificate, what should be done?*\n\nApply for date-of-birth correction at an Aadhaar Seva Kendra. If there is no birth certificate, the correction can be made on the basis of a school certificate, a self-declaration or a medical age certificate.", "wa_hi": "*यदि आधार में गलत जन्मतिथि के कारण महिला 'Under Age' दिख रही है और जन्म प्रमाण पत्र नहीं है, तो क्या करें?*\n\nआधार सेवा केंद्र में जन्मतिथि सुधार के लिए आवेदन करें। जन्म प्रमाण पत्र न हो तो स्कूल प्रमाण पत्र, स्व-घोषणा या डॉक्टर के आयु प्रमाण पत्र के आधार पर सुधार कराया जा सकता है।"}, {"id": "PMMVY-E10", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Does PMMVYsoft fetch the date of birth from Aadhaar? What if the beneficiary's date of birth as per Aadhaar is under 18 years?", "q_hi": "क्या PMMVYsoft जन्मतिथि आधार से लेता है? यदि आधार के अनुसार हितग्राही 18 वर्ष से कम हो तो क्या होगा?", "alt_en": "Does the app take date of birth from Aadhaar?", "alt_hi": "क्या ऐप जन्मतिथि आधार से लेता है?", "kw": "DOB, date of birth, Aadhaar, form, जन्मतिथि, आधार से", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Does PMMVYsoft fetch the date of birth from Aadhaar? What if the beneficiary's date of birth as per Aadhaar is under 18 years?*\n\n*No.* PMMVYsoft matches the beneficiary's name, gender and mobile number from the Aadhaar details at the back end but takes the date of birth from the PMMVY application form, not from Aadhaar.", "wa_hi": "*क्या PMMVYsoft जन्मतिथि आधार से लेता है? यदि आधार के अनुसार हितग्राही 18 वर्ष से कम हो तो क्या होगा?*\n\n*नहीं।* PMMVYsoft आधार से केवल नाम, लिंग और मोबाइल नंबर का मिलान करता है। जन्मतिथि आधार से नहीं, बल्कि PMMVY आवेदन फॉर्म में भरी गई तारीख से ली जाती है।"}, {"id": "PMMVY-E11", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a Samagra ID is not being created because Aadhaar is not updated, what should be done next?", "q_hi": "यदि आधार अपडेट न होने के कारण समग्र ID नहीं बन रही है, तो आगे क्या करें?", "alt_en": "Samagra ID is not being made because Aadhaar is not updated", "alt_hi": "आधार अपडेट न होने से समग्र ID नहीं बन रही", "kw": "Samagra ID, Aadhaar update, समग्र आईडी, समग्र", "aud": "Beneficiary", "wa_en": "*If a Samagra ID is not being created because Aadhaar is not updated, what should be done next?*\n\nFirst get the Aadhaar corrected/updated at the nearest Aadhaar Seva Kendra/CSC, then try again on the Samagra portal.", "wa_hi": "*यदि आधार अपडेट न होने के कारण समग्र ID नहीं बन रही है, तो आगे क्या करें?*\n\nपहले नज़दीकी आधार सेवा केंद्र/CSC पर आधार में सुधार/अपडेट कराएँ, फिर समग्र पोर्टल पर दोबारा प्रयास करें।"}, {"id": "PMMVY-E12", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a Samagra ID cannot be made, can the woman still get PMMVY and Ladli Laxmi Yojana benefits?", "q_hi": "यदि समग्र ID नहीं बनती है, तो क्या महिला को PMMVY और लाड़ली लक्ष्मी योजना का लाभ मिल सकता है?", "alt_en": "No Samagra ID, will I get PMMVY and Ladli Laxmi?", "alt_hi": "समग्र ID नहीं है, क्या लाड़ली लक्ष्मी और PMMVY मिलेगा?", "kw": "Samagra, Ladli Laxmi, लाड़ली लक्ष्मी, समग्र नहीं", "aud": "Beneficiary", "wa_en": "*If a Samagra ID cannot be made, can the woman still get PMMVY and Ladli Laxmi Yojana benefits?*\n\nPMMVY can be taken forward on a temporary basis using other available documents (Aadhaar, bank passbook). However, since a Samagra ID is mandatory for Ladli Laxmi Yojana, that benefit will remain pending until the Samagra ID is created.", "wa_hi": "*यदि समग्र ID नहीं बनती है, तो क्या महिला को PMMVY और लाड़ली लक्ष्मी योजना का लाभ मिल सकता है?*\n\nउपलब्ध दूसरे दस्तावेज़ों (आधार, बैंक पासबुक) से PMMVY का काम अस्थायी रूप से आगे बढ़ाया जा सकता है। लेकिन लाड़ली लक्ष्मी योजना के लिए समग्र ID अनिवार्य है, इसलिए वह लाभ समग्र ID बनने तक रुका रहेगा।"}, {"id": "PMMVY-E13", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If the name/surname in Aadhaar changed after marriage, how should the details be updated on the PMMVY app or portal?", "q_hi": "यदि शादी के बाद आधार में नाम/सरनेम बदल गया है, तो PMMVY ऐप या पोर्टल पर जानकारी कैसे अपडेट करें?", "alt_en": "Name changed in Aadhaar after marriage, how to update in app?", "alt_hi": "शादी के बाद नाम बदला है, ऐप में कैसे बदलें?", "kw": "name change, surname, update details, नाम बदलना, सरनेम", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the name/surname in Aadhaar changed after marriage, how should the details be updated on the PMMVY app or portal?*\n\nFirst get the correction done in Aadhaar, since the PMMVY app or portal has no option to update this information directly. Then enter the new details using the 'Update Details' option in the PMMVY app/portal and get them verified by the Supervisor.", "wa_hi": "*यदि शादी के बाद आधार में नाम/सरनेम बदल गया है, तो PMMVY ऐप या पोर्टल पर जानकारी कैसे अपडेट करें?*\n\nपहले आधार में सुधार कराएँ, क्योंकि PMMVY ऐप या पोर्टल पर यह जानकारी सीधे बदलने का विकल्प नहीं है। फिर PMMVY ऐप/पोर्टल के 'Update Details' विकल्प से नई जानकारी दर्ज करें और सुपरवाइजर से सत्यापन कराएँ।"}, {"id": "PMMVY-E14", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a woman has not updated her name or other details in Aadhaar after marriage, how should she be registered under PMMVY?", "q_hi": "यदि विवाह के बाद महिला ने आधार में नाम या अन्य जानकारी अपडेट नहीं कराई है, तो PMMVY में पंजीकरण कैसे करें?", "alt_en": "Name not updated in Aadhaar after marriage, how to register?", "alt_hi": "शादी के बाद आधार में नाम नहीं बदला, पंजीकरण कैसे करें?", "kw": "old name, Aadhaar not updated, आधार अपडेट नहीं, पुराना नाम", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a woman has not updated her name or other details in Aadhaar after marriage, how should she be registered under PMMVY?*\n\nRegistration can be done on the basis of her current Aadhaar details. Once Aadhaar is updated later, the details can be revised on the portal.", "wa_hi": "*यदि विवाह के बाद महिला ने आधार में नाम या अन्य जानकारी अपडेट नहीं कराई है, तो PMMVY में पंजीकरण कैसे करें?*\n\nआधार में अभी जो जानकारी है, उसी के आधार पर पंजीकरण किया जा सकता है। बाद में आधार अपडेट होने पर पोर्टल पर विवरण सुधार लें।"}, {"id": "PMMVY-E15", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If the mobile number is not updated in Aadhaar, how can the OTP/registration process be completed?", "q_hi": "यदि आधार में मोबाइल नंबर अपडेट नहीं है, तो OTP/पंजीकरण कैसे पूरा करें?", "alt_en": "Mobile number not linked in Aadhaar, how to register?", "alt_hi": "आधार में मोबाइल नंबर नहीं जुड़ा, पंजीकरण कैसे होगा?", "kw": "mobile not linked, OTP, Aadhaar mobile, मोबाइल नंबर, ओटीपी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the mobile number is not updated in Aadhaar, how can the OTP/registration process be completed?*\n\nAt present, no OTP is sent to the beneficiary's mobile number for PMMVY registration. However, advise the beneficiary to visit an Aadhaar Seva Kendra and get her mobile number updated.", "wa_hi": "*यदि आधार में मोबाइल नंबर अपडेट नहीं है, तो OTP/पंजीकरण कैसे पूरा करें?*\n\nवर्तमान  में PMMVY पंजीकरण के लिए हितग्राही के मोबाईल नंबर पर कोई OTP नहीं जाता। यद्यपि हितग्राही को आधार सेवा केंद्र जा कर मोबाईल नंबर अपडेट कराने को बोलें।"}, {"id": "PMMVY-E16", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Who are 'pre-registered' beneficiaries?", "q_hi": "'प्री-रजिस्टर्ड' हितग्राही कौन होती हैं?", "alt_en": "What does pre-registered mean?", "alt_hi": "प्री-रजिस्टर्ड का मतलब क्या है?", "kw": "pre-registered, pending, incomplete registration, प्री रजिस्टर्ड, pre registered ka matlab, pre registration matlab", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Who are 'pre-registered' beneficiaries?*\n\nPre-registered beneficiaries are those who have been entered into the PMMVY MIS but have not completed registration due to incomplete facial recognition/authentication or incomplete Aadhaar/NPCI bank account mapping. These cases appear as pending at the AWW level.", "wa_hi": "*'प्री-रजिस्टर्ड' हितग्राही कौन होती हैं?*\n\nवे हितग्राही जिनकी जानकारी PMMVY सिस्टम में दर्ज हो चुकी है, लेकिन चेहरे का सत्यापन या आधार-बैंक (NPCI) मैपिंग अधूरी होने से पंजीकरण पूरा नहीं हुआ है। ऐसे मामले आंगनवाड़ी कार्यकर्ता के स्तर पर लंबित दिखते हैं।"}, {"id": "PMMVY-E17", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Who are 'entered beneficiaries'?", "q_hi": "'एंटर्ड' (दर्ज) हितग्राही कौन होती हैं?", "alt_en": "What does entered beneficiary mean?", "alt_hi": "एंटर्ड हितग्राही का मतलब क्या है?", "kw": "entered beneficiary, एंटर्ड, दर्ज हितग्राही", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Who are 'entered beneficiaries'?*\n\nEntered beneficiaries are all individuals who have been added to the PMMVY system, including those whose enrolment is complete and those who are pending enrolment due to incomplete Aadhaar/NPCI bank seeding or FRS/Face Authentication.", "wa_hi": "*'एंटर्ड' (दर्ज) हितग्राही कौन होती हैं?*\n\nवे सभी महिलाएँ जिनकी जानकारी PMMVY सिस्टम में जोड़ी गई है। इनमें वे भी शामिल हैं जिनका पंजीकरण पूरा हो गया है और वे भी जिनका आधार-बैंक (NPCI) जुड़ाव या चेहरे का सत्यापन अधूरा होने से पंजीकरण बाकी है।"}, {"id": "PMMVY-E18", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Who are 'enrolled' or 'registered' beneficiaries?", "q_hi": "'पंजीकृत' (Enrolled/Registered) हितग्राही कौन होती हैं?", "alt_en": "What does enrolled or registered beneficiary mean?", "alt_hi": "पंजीकृत हितग्राही किसे कहते हैं?", "kw": "enrolled, registered, submitted form, पंजीकृत, रजिस्टर्ड", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Who are 'enrolled' or 'registered' beneficiaries?*\n\nAn enrolled or registered beneficiary is one whose form has been fully completed and submitted by the AWW. The submitted form then converts into individual applications per eligible instalment for the Lady Supervisor (LS) to verify and the CDPO to approve.", "wa_hi": "*'पंजीकृत' (Enrolled/Registered) हितग्राही कौन होती हैं?*\n\nजिसका फॉर्म आंगनवाड़ी कार्यकर्ता ने पूरा भरकर जमा कर दिया है। जमा होने के बाद फॉर्म हर देय किस्त के लिए अलग-अलग आवेदन में बदल जाता है, जिसे सुपरवाइजर सत्यापित और CDPO स्वीकृत करते हैं।"}, {"id": "PMMVY-E19", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "What is an 'Application' in PMMVY?", "q_hi": "PMMVY में 'आवेदन' (Application) का क्या मतलब है?", "alt_en": "What is an application in PMMVY?", "alt_hi": "PMMVY में एप्लीकेशन का मतलब क्या है?", "kw": "application, instalment-wise, आवेदन, एप्लीकेशन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What is an 'Application' in PMMVY?*\n\nOnce the AWW completes enrolment, the beneficiary's form is converted into individual applications, one per eligible instalment. For example, a beneficiary eligible for both Instalment 1 and Instalment 2 at the time of form submission will generate two separate applications. This structure enables monitoring of pendency at each stakeholder level.", "wa_hi": "*PMMVY में 'आवेदन' (Application) का क्या मतलब है?*\n\nकार्यकर्ता द्वारा पंजीकरण पूरा होते ही हितग्राही का फॉर्म हर देय किस्त के लिए एक-एक आवेदन में बदल जाता है। जैसे, फॉर्म जमा करते समय कोई हितग्राही पहली और दूसरी दोनों किस्त के लिए पात्र है, तो दो अलग आवेदन बनेंगे। इससे हर स्तर पर कितने आवेदन लंबित हैं, यह देखा जा सकता है।"}, {"id": "PMMVY-E20", "t": "A", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "If a new application is not being accepted because the woman is already registered, what should be done?", "q_hi": "यदि पहले से पंजीकरण होने के कारण नया आवेदन स्वीकार नहीं हो रहा है, तो क्या करें?", "alt_en": "New form not accepted, says already registered", "alt_hi": "पहले से पंजीकृत बता रहा है, नया फॉर्म नहीं जा रहा", "kw": "already registered, duplicate, पहले से पंजीकृत, डुप्लीकेट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a new application is not being accepted because the woman is already registered, what should be done?*\n\nCheck the status of the old application using the Aadhaar/PMMVY ID. If a duplicate is confirmed, process the next instalment in the old record itself. Do not fill a new application.", "wa_hi": "*यदि पहले से पंजीकरण होने के कारण नया आवेदन स्वीकार नहीं हो रहा है, तो क्या करें?*\n\nआधार/PMMVY ID से पुराने आवेदन की स्थिति जाँचें। डुप्लीकेट की पुष्टि होने पर पुराने रिकॉर्ड में ही आगे की किस्त की कार्यवाही करें, नया आवेदन न भरें।"}, {"id": "PMMVY-E21", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "Is there a limit on the number of beneficiaries that can be registered in a day?", "q_hi": "क्या एक दिन में पंजीकरण की कोई सीमा है?", "alt_en": "How many registrations can I do in a day?", "alt_hi": "एक दिन में कितने पंजीकरण कर सकते हैं?", "kw": "daily limit, three per day, per day, रोज़ की सीमा, एक दिन में", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Is there a limit on the number of beneficiaries that can be registered in a day?*\n\nYes, there is a maximum limit of three beneficiaries per day.", "wa_hi": "*क्या एक दिन में पंजीकरण की कोई सीमा है?*\n\n*हाँ*, एक दिन में अधिकतम तीन हितग्राहियों का पंजीकरण किया जा सकता है।"}, {"id": "PMMVY-E22", "t": "S", "sec_en": "E. Application, Registration & Documents", "sec_hi": "E. आवेदन, पंजीकरण और दस्तावेज़", "q_en": "What challenges are faced in registering private ANC cases?", "q_hi": "निजी अस्पताल में ANC जाँच कराने वाली महिलाओं के पंजीकरण में क्या दिक्कत आती है?", "alt_en": "Problem registering women who did ANC in private hospital", "alt_hi": "निजी अस्पताल में ANC वाली महिला का पंजीकरण कैसे हो?", "kw": "private ANC, private hospital, no MCP card, निजी अस्पताल, MCP कार्ड नहीं", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What challenges are faced in registering private ANC cases?*\n\nIn private ANC cases, MCP cards are often unavailable because they are not generated by ANMs. This creates confusion during beneficiary registration. Alternative documentation protocols need to be standardised to support registration in cases where MCP cards are unavailable.", "wa_hi": "*निजी अस्पताल में ANC जाँच कराने वाली महिलाओं के पंजीकरण में क्या दिक्कत आती है?*\n\nनिजी अस्पताल में जाँच कराने पर अक्सर MCP कार्ड नहीं होता, क्योंकि वह ANM द्वारा बनाया जाता है। इससे पंजीकरण में उलझन होती है। MCP कार्ड न होने पर कौन-से दूसरे दस्तावेज़ मान्य हों, इसके लिए एक तय नियम बनाने की ज़रूरत है।"}, {"id": "PMMVY-F1", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What are the conditions for receiving the first child's benefits?", "q_hi": "पहले बच्चे का लाभ पाने की शर्तें क्या हैं?", "alt_en": "What are the conditions for the first child money?", "alt_hi": "पहले बच्चे का पैसा पाने की शर्तें क्या हैं?", "kw": "first child, conditions, instalment 1, instalment 2, पहला बच्चा, शर्तें, second instalment kab, dusri kist kab, pehli kist, second instalment kab milegi", "aud": "Beneficiary", "wa_en": "*What are the conditions for receiving the first child's benefits?*\n\n• *Instalment 1:* Pregnancy registration and at least one completed Antenatal Check-up (ANC) within 6 months of the LMP date.\n• *Instalment 2:* Birth registration and completion of the first immunisation cycle (within 14 weeks of birth).", "wa_hi": "*पहले बच्चे का लाभ पाने की शर्तें क्या हैं?*\n\n• *पहली किस्त:* गर्भावस्था का पंजीकरण और LMP तारीख से 6 महीने के भीतर कम से कम एक ANC जाँच।\n• *दूसरी किस्त:* बच्चे का जन्म पंजीकरण और जन्म के 14 सप्ताह के भीतर पहले चक्र का टीकाकरण पूरा होना।"}, {"id": "PMMVY-F2", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "What conditions apply to receive benefits for the second child (girl child)?", "q_hi": "दूसरी संतान (बेटी) का लाभ पाने की शर्तें क्या हैं?", "alt_en": "What are the conditions for second daughter money?", "alt_hi": "दूसरी बेटी का पैसा कब मिलेगा?", "kw": "second child, girl child, 6000, दूसरी बेटी, बेटी", "aud": "Beneficiary", "wa_en": "*What conditions apply to receive benefits for the second child (girl child)?*\n\nThe beneficiary must complete pregnancy registration, register the birth, and ensure completion of the first immunisation cycle within 14 weeks of birth. All conditions must be satisfied for the single instalment to be disbursed.", "wa_hi": "*दूसरी संतान (बेटी) का लाभ पाने की शर्तें क्या हैं?*\n\nहितग्राही को गर्भावस्था का पंजीकरण, बेटी का जन्म पंजीकरण और जन्म के 14 सप्ताह के भीतर पहले चक्र का टीकाकरण पूरा करना होगा। सभी शर्तें पूरी होने पर ही एक किस्त की राशि मिलेगी।"}, {"id": "PMMVY-F3", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "How many Antenatal Check-ups are required to claim the first instalment?", "q_hi": "पहली किस्त के लिए कितनी ANC जाँच ज़रूरी हैं?", "alt_en": "How many ANC check-ups are needed for first instalment?", "alt_hi": "पहली किस्त के लिए कितनी जाँच ज़रूरी है?", "kw": "ANC, check-up, first instalment, जाँच, एएनसी", "aud": "Beneficiary", "wa_en": "*How many Antenatal Check-ups are required to claim the first instalment?*\n\nAt least one ANC is required, to be completed within 6 months of the LMP date.", "wa_hi": "*पहली किस्त के लिए कितनी ANC जाँच ज़रूरी हैं?*\n\nकम से कम एक ANC जाँच ज़रूरी है, जो LMP तारीख से 6 महीने के भीतर हो जानी चाहिए।"}, {"id": "PMMVY-F4", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "Does the ANC have to be conducted exactly 180 days after the LMP date?", "q_hi": "क्या ANC जाँच ठीक LMP के 180वें दिन ही होनी चाहिए?", "alt_en": "Should ANC be done exactly on day 180?", "alt_hi": "क्या ANC ठीक 180वें दिन होनी चाहिए?", "kw": "ANC 180 days, LMP, 6 months, 180 दिन", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Does the ANC have to be conducted exactly 180 days after the LMP date?*\n\n*No.* The ANC can be conducted at any time between the LMP date and LMP + 180 days. What matters is that: (a) pregnancy is registered at the AWC, and (b) at least one ANC has been completed within that period.", "wa_hi": "*क्या ANC जाँच ठीक LMP के 180वें दिन ही होनी चाहिए?*\n\n*नहीं।* ANC जाँच LMP तारीख से 180 दिन के बीच कभी भी हो सकती है। ज़रूरी बस यह है कि (क) आंगनवाड़ी केंद्र पर गर्भावस्था दर्ज हो, और (ख) इसी अवधि में कम से कम एक ANC जाँच हो गई हो।"}, {"id": "PMMVY-F5", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "A beneficiary completed her ANC within 4 months of her LMP and applied immediately for Instalment 2. Why was she found ineligible?", "q_hi": "एक हितग्राही ने LMP के 4 महीने में ANC करा ली और तुरंत दूसरी किस्त के लिए आवेदन किया। उसे अपात्र क्यों माना गया?", "alt_en": "ANC done in 4 months, why rejected for second instalment?", "alt_hi": "4 महीने में ANC हुई, दूसरी किस्त क्यों नहीं मिली?", "kw": "instalment 2 ineligible, early ANC, दूसरी किस्त, अपात्र", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*A beneficiary completed her ANC within 4 months of her LMP and applied immediately for Instalment 2. Why was she found ineligible?*\n\nInstalment 2 can only be claimed after the birth of the child and completion of the full immunisation cycle. Early completion of the ANC does not fulfil the conditions for Instalment 2.", "wa_hi": "*एक हितग्राही ने LMP के 4 महीने में ANC करा ली और तुरंत दूसरी किस्त के लिए आवेदन किया। उसे अपात्र क्यों माना गया?*\n\nदूसरी किस्त बच्चे के जन्म और पहले चक्र का पूरा टीकाकरण होने के बाद ही मिलती है। जल्दी ANC कराने से दूसरी किस्त की शर्त पूरी नहीं होती।"}, {"id": "PMMVY-F6", "t": "S", "sec_en": "F. Conditions, Instalments & Timelines", "sec_hi": "F. शर्तें, किस्तें और समय-सीमा", "q_en": "A beneficiary registered the child's birth and received the first cycle of BCG, OPV, and Hepatitis B, then applied for Instalment 2. Why was she found ineligible?", "q_hi": "एक हितग्राही ने बच्चे का जन्म पंजीकरण कराया और BCG, OPV व हेपेटाइटिस-B के टीके लगवाकर दूसरी किस्त का आवेदन किया। उसे अपात्र क्यों माना गया?", "alt_en": "BCG, OPV and Hepatitis B done, why second instalment rejected?", "alt_hi": "BCG, OPV, हेपेटाइटिस-B लगे, फिर भी दूसरी किस्त क्यों नहीं?", "kw": "immunisation, DPT, BCG, OPV, vaccine, टीकाकरण, टीके", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*A beneficiary registered the child's birth and received the first cycle of BCG, OPV,
