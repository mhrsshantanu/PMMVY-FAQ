ed?*\n\nFirst correct the entry in POSHAN Tracker. The corrected data will then be updated in the PMMVY app through sync.", "wa_hi": "*यदि पोषण ट्रैकर से PMMVY ऐप में गलत हितग्राही डेटा आ रहा है, तो उसे कैसे सुधारें?*\n\nसबसे पहले पोषण ट्रैकर में संबंधित एंट्री सुधारें। फिर सिंक होने पर सही डेटा PMMVY ऐप में अपडेट हो जाएगा।"}, {"id": "PMMVY-L16", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If a beneficiary registered in POSHAN Tracker is showing in another Anganwadi worker's PMMVY DEU list and has been wrongly marked Ineligible, what should be done?", "q_hi": "यदि पोषण ट्रैकर में दर्ज हितग्राही किसी दूसरी कार्यकर्ता की PMMVY DEU सूची में दिख रही है और उसे गलती से Ineligible कर दिया गया है, तो क्या करें?", "alt_en": "Woman marked Ineligible in another worker's DEU list", "alt_hi": "दूसरी कार्यकर्ता की DEU सूची में महिला Ineligible हो गई", "kw": "DEU list, wrongly ineligible, transfer, डीईयू", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a beneficiary registered in POSHAN Tracker is showing in another Anganwadi worker's PMMVY DEU list and has been wrongly marked Ineligible, what should be done?*\n\nRegister a complaint at the Supervisor/CDPO level and get her transferred to the correct Anganwadi worker's DEU list with the correction made.", "wa_hi": "*यदि पोषण ट्रैकर में दर्ज हितग्राही किसी दूसरी कार्यकर्ता की PMMVY DEU सूची में दिख रही है और उसे गलती से Ineligible कर दिया गया है, तो क्या करें?*\n\nसुपरवाइजर/CDPO स्तर पर शिकायत दर्ज करें और सही कार्यकर्ता की DEU सूची में स्थानांतरण व सुधार कराएँ।"}, {"id": "PMMVY-L17", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If the count of women pending in Pre-registration differs from the number shown when the list is opened, what should be done?", "q_hi": "यदि Pre-registration में लंबित महिलाओं की संख्या और सूची खोलने पर दिखने वाली संख्या अलग है, तो क्या करें?", "alt_en": "Pre-registration count and list numbers don't match", "alt_hi": "Pre-registration की संख्या और सूची मेल नहीं खाती", "kw": "count mismatch, assign AWC, संख्या मेल नहीं", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the count of women pending in Pre-registration differs from the number shown when the list is opened, what should be done?*\n\nGet the beneficiaries assigned to their respective Anganwadi Centre from the DNO level.", "wa_hi": "*यदि Pre-registration में लंबित महिलाओं की संख्या और सूची खोलने पर दिखने वाली संख्या अलग है, तो क्या करें?*\n\nDNO स्तर से हितग्राहियों को उनके सही आंगनवाड़ी केंद्र में Assign करवाएँ।"}, {"id": "PMMVY-L18", "t": "A", "sec_en": "L. Due List, Mapping & Data Issues", "sec_hi": "L. Due List, मैपिंग और डेटा संबंधी समस्याएँ", "q_en": "If the payment has been made but the beneficiary's name still appears in the Pre-registration list, what should be done?", "q_hi": "यदि भुगतान हो चुका है, फिर भी हितग्राही का नाम Pre-registration सूची में दिख रहा है, तो क्या करें?", "alt_en": "Payment done but name still in Pre-registration", "alt_hi": "भुगतान हो गया फिर भी नाम Pre-registration में है", "kw": "paid still pre-registered, data delay, भुगतान हो गया", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the payment has been made but the beneficiary's name still appears in the Pre-registration list, what should be done?*\n\nThis is a delay in data updating. Contact the technical team.", "wa_hi": "*यदि भुगतान हो चुका है, फिर भी हितग्राही का नाम Pre-registration सूची में दिख रहा है, तो क्या करें?*\n\nयह डेटा अपडेट होने में देरी है। तकनीकी टीम से संपर्क करें।"}, {"id": "PMMVY-M1", "t": "S", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "What should be done if a payment is stuck?", "q_hi": "यदि भुगतान अटका हुआ है तो क्या करें?", "alt_en": "My payment is stuck, what should I do?", "alt_hi": "मेरा पैसा अटका हुआ है, क्या करूँ?", "kw": "payment stuck, money not received, paisa nahi aaya, पैसा अटका, पैसा नहीं आया", "aud": "Beneficiary", "wa_en": "*What should be done if a payment is stuck?*\n\n• Re-seed the Aadhaar number.\n• Update the bank account linking in the system.\n• Call 1515 to find out the exact reason.", "wa_hi": "*यदि भुगतान अटका हुआ है तो क्या करें?*\n\n• आधार को बैंक खाते से दोबारा जोड़ें (Re-seed)।\n• सिस्टम में बैंक खाते का जुड़ाव अपडेट करें।\n• 1515 पर कॉल कर के सही कारण जानें।"}, {"id": "PMMVY-M2", "t": "S", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "Is the DNO the approver for the payment flow?", "q_hi": "क्या भुगतान की स्वीकृति DNO देते हैं?", "alt_en": "Does DNO approve payments?", "alt_hi": "क्या भुगतान DNO स्वीकृत करते हैं?", "kw": "payment approval, DNO, SNO, SNA Sparsh, भुगतान स्वीकृति", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Is the DNO the approver for the payment flow?*\n\n*No.* In the payment workflow, the payment application goes from the SO/CDPO (maker) to the SNO (checker) and then to SNA Sparsh for approval and processing.", "wa_hi": "*क्या भुगतान की स्वीकृति DNO देते हैं?*\n\n*नहीं।* भुगतान का आवेदन पहले SO/CDPO (मेकर) से SNO (चेकर) के पास जाता है और फिर स्वीकृति व भुगतान के लिए SNA स्पर्श (SNA Sparsh) पर जाता है।"}, {"id": "PMMVY-M3", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "Why are PMMVY instalments delayed?", "q_hi": "PMMVY की किस्त मिलने में देरी क्यों होती है?", "alt_en": "Why is my instalment late?", "alt_hi": "किस्त देर से क्यों आ रही है?", "kw": "delay, instalment late, kist late, देरी, किस्त देर", "aud": "Beneficiary", "wa_en": "*Why are PMMVY instalments delayed?*\n\nThe main reasons are errors in documents, Aadhaar-bank linking/NPCI problems, delays in the verification process, or technical issues at the PFMS level.", "wa_hi": "*PMMVY की किस्त मिलने में देरी क्यों होती है?*\n\nदस्तावेज़ों में गलती, आधार-बैंक लिंकिंग/NPCI की समस्या, सत्यापन में देरी या PFMS स्तर पर तकनीकी समस्या इसके मुख्य कारण हैं।"}, {"id": "PMMVY-M4", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "How can one find out at which level an application is pending?", "q_hi": "आवेदन किस स्तर पर लंबित है, यह कैसे पता करें?", "alt_en": "How to know where my application is pending?", "alt_hi": "मेरा आवेदन कहाँ अटका है, कैसे पता करें?", "kw": "application status, pending level, track status, स्थिति, कहाँ अटका", "aud": "All", "wa_en": "*How can one find out at which level an application is pending?*\n\nThe status (Anganwadi/CDPO/State/PFMS) can be seen using the 'Search' option with the Aadhaar number on the portal/app.", "wa_hi": "*आवेदन किस स्तर पर लंबित है, यह कैसे पता करें?*\n\nपोर्टल/ऐप पर आधार नंबर डालकर 'Search' विकल्प से स्थिति (आंगनवाड़ी/CDPO/राज्य/PFMS) देखी जा सकती है।"}, {"id": "PMMVY-M5", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "If the second instalment has been received but the first has not, how will the first instalment be received?", "q_hi": "यदि दूसरी किस्त मिल गई है लेकिन पहली किस्त नहीं मिली, तो पहली किस्त कैसे मिलेगी?", "alt_en": "Got second instalment but not the first", "alt_hi": "दूसरी किस्त मिल गई, पहली नहीं मिली", "kw": "first instalment missing, second received, पहली किस्त नहीं", "aud": "Beneficiary", "wa_en": "*If the second instalment has been received but the first has not, how will the first instalment be received?*\n\nInform the State Nodal Officer through the Supervisor/CDPO/DPO about the pending first instalment, so that it can be released.", "wa_hi": "*यदि दूसरी किस्त मिल गई है लेकिन पहली किस्त नहीं मिली, तो पहली किस्त कैसे मिलेगी?*\n\nसुपरवाइजर/CDPO/DPO के माध्यम से राज्य नोडल अधिकारी को लंबित पहली किस्त की जानकारी दें, ताकि वह जारी हो सके।"}, {"id": "PMMVY-M6", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "If the payment has been showing 'In Process' or 'Pending at PFMS' for a long time, how should the status be checked and what action should be taken?", "q_hi": "यदि भुगतान लंबे समय से 'In Process' या 'Pending at PFMS' दिखा रहा है, तो स्थिति कैसे जाँचें और क्या करें?", "alt_en": "Payment showing In Process or Pending at PFMS for long", "alt_hi": "भुगतान बहुत दिनों से In Process / PFMS में लंबित है", "kw": "PFMS pending, in process, पीएफएमएस, इन प्रोसेस", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the payment has been showing 'In Process' or 'Pending at PFMS' for a long time, how should the status be checked and what action should be taken?*\n\nInform the State Nodal Officer through the Supervisor/CDPO/DPO, so that the pending instalment can be released.", "wa_hi": "*यदि भुगतान लंबे समय से 'In Process' या 'Pending at PFMS' दिखा रहा है, तो स्थिति कैसे जाँचें और क्या करें?*\n\nसुपरवाइजर/CDPO/DPO के माध्यम से राज्य नोडल अधिकारी को बताएँ, ताकि लंबित किस्त जारी हो सके।"}, {"id": "PMMVY-M7", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "If the portal shows the payment as made but the money has not reached the beneficiary's bank account, what should be done?", "q_hi": "यदि पोर्टल पर भुगतान हो चुका दिख रहा है, लेकिन हितग्राही के खाते में पैसा नहीं आया, तो क्या करें?", "alt_en": "Portal says paid but money not in my account", "alt_hi": "पोर्टल पर भुगतान दिख रहा पर खाते में पैसा नहीं आया", "kw": "paid not received, account statement, खाते में नहीं आया", "aud": "Beneficiary", "wa_en": "*If the portal shows the payment as made but the money has not reached the beneficiary's bank account, what should be done?*\n\nFirst check on the portal, using the Search option, to which account number the payment was made. Then ask the beneficiary to contact that bank branch and confirm through her account statement.", "wa_hi": "*यदि पोर्टल पर भुगतान हो चुका दिख रहा है, लेकिन हितग्राही के खाते में पैसा नहीं आया, तो क्या करें?*\n\nपहले पोर्टल पर Search विकल्प से देखें कि भुगतान किस खाता नंबर में हुआ है। फिर हितग्राही को उस बैंक शाखा से संपर्क करके खाते के स्टेटमेंट से पुष्टि करने को कहें।"}, {"id": "PMMVY-M8", "t": "A", "sec_en": "M. Payments & Instalment Status", "sec_hi": "M. भुगतान और किस्त की स्थिति", "q_en": "If the payment has been made but the beneficiary still shows as 'Pending' in the app, why does this happen?", "q_hi": "भुगतान हो जाने के बाद भी ऐप में हितग्राही 'Pending' क्यों दिख रही है?", "alt_en": "Payment done but app still shows Pending", "alt_hi": "भुगतान हो गया फिर भी ऐप में Pending दिख रहा", "kw": "paid still pending, sync delay, पेंडिंग", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the payment has been made but the beneficiary still shows as 'Pending' in the app, why does this happen?*\n\nThis usually happens due to a delay in data sync. Wait a few days, and if the problem continues, inform the Supervisor.", "wa_hi": "*भुगतान हो जाने के बाद भी ऐप में हितग्राही 'Pending' क्यों दिख रही है?*\n\nयह आमतौर पर डेटा सिंक में देरी के कारण होता है। कुछ दिन इंतज़ार करें, फिर भी समस्या रहे तो सुपरवाइजर को बताएँ।"}, {"id": "PMMVY-N1", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "I have forgotten my password. How do I log in?", "q_hi": "पासवर्ड भूल गई हूँ, लॉगिन कैसे करूँ?", "alt_en": "I forgot my password", "alt_hi": "पासवर्ड भूल गई", "kw": "forgot password, reset password, पासवर्ड भूल गई", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*I have forgotten my password. How do I log in?*\n\nYou can reset your password using the 'Forgot Password' option on the login page. Alternatively, a user one level above you in the system hierarchy can reset your password. The password reset link is also available on the User Setup screen.", "wa_hi": "*पासवर्ड भूल गई हूँ, लॉगिन कैसे करूँ?*\n\nलॉगिन पेज पर 'Forgot Password' विकल्प से नया पासवर्ड बनाएँ। या आपसे एक स्तर ऊपर के अधिकारी आपका पासवर्ड रीसेट कर सकते हैं। पासवर्ड रीसेट का लिंक 'User Setup' स्क्रीन पर भी है।"}, {"id": "PMMVY-N2", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "What should be done if an AWW is unable to log in?", "q_hi": "यदि कार्यकर्ता लॉगिन नहीं कर पा रही है तो क्या करें?", "alt_en": "Anganwadi worker cannot log in", "alt_hi": "कार्यकर्ता लॉगिन नहीं कर पा रही", "kw": "login problem, cannot login, लॉगिन नहीं हो रहा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What should be done if an AWW is unable to log in?*\n\n• Update the AWW's profile and get it approved by the District Nodal Officer (DNO).\n• Alternatively, attempt logging in from a different device.\n• Clear the cache of the app or browser.", "wa_hi": "*यदि कार्यकर्ता लॉगिन नहीं कर पा रही है तो क्या करें?*\n\n• कार्यकर्ता की प्रोफ़ाइल अपडेट करें और जिला नोडल अधिकारी (DNO) से स्वीकृत कराएँ।\n• या किसी दूसरे मोबाइल/डिवाइस से लॉगिन करके देखें।\n• ऐप या ब्राउज़र की कैश मेमोरी साफ करें।"}, {"id": "PMMVY-N3", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "What should I do if I get a 'User ID already exists' error?", "q_hi": "'User ID already exists' की त्रुटि आए तो क्या करें?", "alt_en": "Getting User ID already exists error", "alt_hi": "User ID already exists की त्रुटि आ रही है", "kw": "user ID exists, error, यूज़र आईडी", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What should I do if I get a 'User ID already exists' error?*\n\nThis issue can often be resolved through periodic login and regular account usage to keep the user account active and synchronised.", "wa_hi": "*'User ID already exists' की त्रुटि आए तो क्या करें?*\n\nसमय-समय पर लॉगिन करते रहें और खाते का नियमित उपयोग करें, ताकि खाता चालू और सिंक रहे। इससे यह समस्या अक्सर ठीक हो जाती है।"}, {"id": "PMMVY-N4", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "How much time is available to enter the OTP?", "q_hi": "OTP डालने के लिए कितना समय मिलता है?", "alt_en": "How much time do I get to enter OTP?", "alt_hi": "OTP डालने का कितना समय मिलता है?", "kw": "OTP time, 2 minutes, OTP expiry, ओटीपी समय", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*How much time is available to enter the OTP?*\n\n• *Mobile app:* 2 minutes\n• *Web portal:* 1 minute", "wa_hi": "*OTP डालने के लिए कितना समय मिलता है?*\n\n• *मोबाइल ऐप:* 2 मिनट\n• *वेब पोर्टल:* 1 मिनट"}, {"id": "PMMVY-N5", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "Why am I (the Anganwadi worker) not receiving the OTP on my mobile phone?", "q_hi": "मेरे (आगांवड़ी कार्यकर्ता के) मोबाइल पर OTP क्यों नहीं आ रहा है?", "alt_en": "OTP not coming on my phone", "alt_hi": "मेरे फ़ोन पर OTP नहीं आ रहा", "kw": "OTP not received, inbox full, ओटीपी नहीं आ रहा, otp nahi aa raha, otp not coming", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why am I (the Anganwadi worker) not receiving the OTP on my mobile phone?*\n\nOTP may not be received if the mobile inbox storage is full, especially in basic or low-storage devices. Clearing old messages can help resolve this issue.", "wa_hi": "*मेरे (आगांवड़ी कार्यकर्ता के) मोबाइल पर OTP क्यों नहीं आ रहा है?*\n\nमोबाइल का मैसेज बॉक्स भरा होने पर OTP नहीं आता, खासकर साधारण या कम स्टोरेज वाले फ़ोन में। पुराने मैसेज हटाने से समस्या ठीक हो सकती है।"}, {"id": "PMMVY-N6", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "What should be done if the PMMVYsoft app is slow, freezing, or not working?", "q_hi": "यदि PMMVYsoft ऐप धीमा चल रहा है, अटक रहा है या काम नहीं कर रहा, तो क्या करें?", "alt_en": "PMMVY app is slow or not working", "alt_hi": "PMMVY ऐप धीमा है या काम नहीं कर रहा", "kw": "app slow, freezing, not working, ऐप धीमा", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What should be done if the PMMVYsoft app is slow, freezing, or not working?*\n\n• Install the latest version of the app.\n• Clear the app cache and then update the app.", "wa_hi": "*यदि PMMVYsoft ऐप धीमा चल रहा है, अटक रहा है या काम नहीं कर रहा, तो क्या करें?*\n\n• ऐप का नया वर्ज़न इंस्टॉल करें।\n• ऐप की कैश मेमोरी साफ करें और फिर ऐप अपडेट करें।"}, {"id": "PMMVY-N7", "t": "S", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "Why do users need to uninstall and reinstall the PMMVY application for updates?", "q_hi": "ऐप अपडेट करने के लिए उसे हटाकर दोबारा इंस्टॉल क्यों करना पड़ता है?", "alt_en": "Why do I need to uninstall and reinstall the app?", "alt_hi": "ऐप हटाकर दोबारा इंस्टॉल क्यों करना पड़ता है?", "kw": "reinstall, uninstall, update, दोबारा इंस्टॉल", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Why do users need to uninstall and reinstall the PMMVY application for updates?*\n\nThe application currently does not support in-app updates, requiring users to manually uninstall and reinstall the app whenever a new version is released.", "wa_hi": "*ऐप अपडेट करने के लिए उसे हटाकर दोबारा इंस्टॉल क्यों करना पड़ता है?*\n\nअभी ऐप के अंदर से अपडेट करने की सुविधा नहीं है। इसलिए नया वर्ज़न आने पर पुराना ऐप हटाकर नया इंस्टॉल करना पड़ता है।"}, {"id": "PMMVY-N8", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "If the app is not updating on the mobile, what should be done?", "q_hi": "यदि मोबाइल में ऐप अपडेट नहीं हो रहा है, तो क्या करें?", "alt_en": "App is not updating", "alt_hi": "ऐप अपडेट नहीं हो रहा", "kw": "app update, Play Store, ऐप अपडेट", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the app is not updating on the mobile, what should be done?*\n\nFree up mobile storage, check the internet connection and try a manual update from the Play Store.", "wa_hi": "*यदि मोबाइल में ऐप अपडेट नहीं हो रहा है, तो क्या करें?*\n\nमोबाइल का स्टोरेज खाली करें, इंटरनेट कनेक्शन जाँचें और Play Store से खुद अपडेट करने का प्रयास करें।"}, {"id": "PMMVY-N9", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "If the PMMVY app is not installing on the mobile and work has to be done through the web link, is that acceptable?", "q_hi": "यदि PMMVY ऐप मोबाइल में इंस्टॉल नहीं हो रहा और वेब लिंक से काम करना पड़ रहा है, तो क्या यह सही है?", "alt_en": "App not installing, can I use the web link?", "alt_hi": "ऐप इंस्टॉल नहीं हो रहा, क्या वेब लिंक से काम करें?", "kw": "app not installing, web portal, वेब लिंक", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the PMMVY app is not installing on the mobile and work has to be done through the web link, is that acceptable?*\n\n*Yes.* Until the technical problem is solved, working through the web link (portal) is an acceptable option.", "wa_hi": "*यदि PMMVY ऐप मोबाइल में इंस्टॉल नहीं हो रहा और वेब लिंक से काम करना पड़ रहा है, तो क्या यह सही है?*\n\n*हाँ*, तकनीकी समस्या ठीक होने तक वेब लिंक (पोर्टल) से काम करना सही विकल्प है।"}, {"id": "PMMVY-N10", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "If the app does not run properly because the mobile is old, what can be done?", "q_hi": "पुराना मोबाइल होने के कारण ऐप ठीक से नहीं चल रहा है, तो क्या करें?", "alt_en": "App not working because my phone is old", "alt_hi": "पुराना मोबाइल है, ऐप ठीक नहीं चलता", "kw": "old phone, device, पुराना मोबाइल", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the app does not run properly because the mobile is old, what can be done?*\n\nGet the work done using a capable device available with the Supervisor.", "wa_hi": "*पुराना मोबाइल होने के कारण ऐप ठीक से नहीं चल रहा है, तो क्या करें?*\n\nसुपरवाइजर के पास उपलब्ध सही डिवाइस से काम पूरा कराएँ।"}, {"id": "PMMVY-N11", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "If the PMMVY app keeps hanging on the mobile, what should be done?", "q_hi": "यदि PMMVY एप मोबाइल बार-बार Hang हो जाता है, तो क्या करें?", "alt_en": "PMMVY app keeps hanging", "alt_hi": "PMMVY ऐप बार-बार हैंग होता है", "kw": "hang, hanging, storage, हैंग", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the PMMVY app keeps hanging on the mobile, what should be done?*\n\nFree up storage on the mobile (unused apps/data can be removed), restart the mobile and update the app.", "wa_hi": "*यदि PMMVY एप मोबाइल बार-बार Hang हो जाता है, तो क्या करें?*\n\nमोबाईल मे स्टोरेज खाली करें प्रयोग मे न आ रहे ऐप/डेटा हटा सकते हैं, मोबाइल रीस्टार्ट करें और ऐप अपडेट करें।"}, {"id": "PMMVY-N12", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "If the portal is very slow or shows 'Server Error', what should be done?", "q_hi": "यदि पोर्टल बहुत धीमा है या 'Server Error' आ रहा है, तो क्या करें?", "alt_en": "Portal is slow or showing Server Error", "alt_hi": "पोर्टल धीमा है या Server Error आ रहा है", "kw": "server error, portal slow, सर्वर एरर", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the portal is very slow or shows 'Server Error', what should be done?*\n\nTry again after some time and clear the browser cache and history. If the problem continues, inform the technical team.", "wa_hi": "*यदि पोर्टल बहुत धीमा है या 'Server Error' आ रहा है, तो क्या करें?*\n\nकुछ समय बाद दोबारा प्रयास करें, ब्राउज़र की कैश और हिस्ट्री ‘Clear’ करें। फिर भी समस्या रहे तो तकनीकी टीम को बताएँ।"}, {"id": "PMMVY-N13", "t": "A", "sec_en": "N. App, Login, OTP & Technical Issues", "sec_hi": "N. ऐप, लॉगिन, OTP और तकनीकी समस्याएँ", "q_en": "How should work be done on the PMMVY app in areas with weak internet/network? Is an offline facility available?", "q_hi": "कमज़ोर इंटरनेट/नेटवर्क वाले क्षेत्रों में PMMVY ऐप पर काम कैसे करें? क्या ऑफलाइन सुविधा है?", "alt_en": "Is there an offline option for weak network areas?", "alt_hi": "कमज़ोर नेटवर्क में ऑफलाइन काम हो सकता है?", "kw": "offline, weak network, ऑफलाइन, नेटवर्क", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*How should work be done on the PMMVY app in areas with weak internet/network? Is an offline facility available?*\n\nIt is advised to complete the work by moving to an area with better network wherever possible.", "wa_hi": "*कमज़ोर इंटरनेट/नेटवर्क वाले क्षेत्रों में PMMVY ऐप पर काम कैसे करें? क्या ऑफलाइन सुविधा है?*\n\nजहाँ तक हो सके, बेहतर नेटवर्क वाली जगह पर जाकर काम पूरा करने की सलाह दी जाती है।"}, {"id": "PMMVY-O1", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "What is PMMVYsoft and how does it support monitoring?", "q_hi": "PMMVYsoft क्या है और यह निगरानी में कैसे मदद करता है?", "alt_en": "How does PMMVYsoft help in monitoring?", "alt_hi": "PMMVYsoft निगरानी में कैसे मदद करता है?", "kw": "monitoring, MIS, PMMVYsoft, निगरानी", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What is PMMVYsoft and how does it support monitoring?*\n\nPMMVYsoft is the digital MIS platform used to track beneficiary registration, verification, approval, and payment status in real time, enabling data-driven monitoring at all levels.", "wa_hi": "*PMMVYsoft क्या है और यह निगरानी में कैसे मदद करता है?*\n\nPMMVYsoft एक डिजिटल MIS प्लेटफ़ॉर्म है, जिसमें हितग्राही का पंजीकरण, सत्यापन, स्वीकृति और भुगतान की स्थिति उसी समय देखी जा सकती है। इससे हर स्तर पर आँकड़ों के आधार पर निगरानी होती है।"}, {"id": "PMMVY-O2", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "What are the key dashboards available in PMMVYsoft for monitoring?", "q_hi": "निगरानी के लिए PMMVYsoft में कौन-से मुख्य डैशबोर्ड हैं?", "alt_en": "Which dashboards are there in PMMVYsoft?", "alt_hi": "PMMVYsoft में कौन-से डैशबोर्ड हैं?", "kw": "dashboards, reports, डैशबोर्ड", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What are the key dashboards available in PMMVYsoft for monitoring?*\n\n*The system provides the following dashboards:*\n• Registration dashboard\n• Due list from POSHAN Tracker\n• Payment status dashboard\n• Pending cases dashboard\n• Performance summary reports", "wa_hi": "*निगरानी के लिए PMMVYsoft में कौन-से मुख्य डैशबोर्ड हैं?*\n\n*सिस्टम में ये डैशबोर्ड हैं:*\n• पंजीकरण डैशबोर्ड\n• पोषण ट्रैकर से आई Due List\n• भुगतान स्थिति डैशबोर्ड\n• लंबित मामलों का डैशबोर्ड\n• प्रदर्शन सारांश रिपोर्ट"}, {"id": "PMMVY-O3", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How can officials track pending applications in PMMVYsoft?", "q_hi": "अधिकारी PMMVYsoft में लंबित आवेदन कैसे देखें?", "alt_en": "How do officials see pending applications?", "alt_hi": "अधिकारी लंबित आवेदन कैसे देखें?", "kw": "pending cases, officials, लंबित आवेदन", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How can officials track pending applications in PMMVYsoft?*\n\nOfficials can use the 'Pending Cases' or 'Due List' section to identify applications pending at different stages, such as verification, approval, or payment processing.", "wa_hi": "*अधिकारी PMMVYsoft में लंबित आवेदन कैसे देखें?*\n\n'Pending Cases' या 'Due List' भाग में जाकर देखा जा सकता है कि कौन-से आवेदन सत्यापन, स्वीकृति या भुगतान, किस चरण पर लंबित हैं।"}, {"id": "PMMVY-O4", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How can the pendency list be accessed?", "q_hi": "लंबित मामलों की सूची कैसे खोलें?", "alt_en": "How to open the pendency list?", "alt_hi": "लंबित सूची कैसे खोलें?", "kw": "pendency list, hyperlink, लंबित सूची", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*How can the pendency list be accessed?*\n\nClick the hyperlink at the AWW or LS level to expand and view the pendency list in detail.", "wa_hi": "*लंबित मामलों की सूची कैसे खोलें?*\n\nकार्यकर्ता या सुपरवाइजर स्तर पर दिए गए लिंक (हाइपरलिंक) पर क्लिक करें, पूरी सूची खुल जाएगी।"}, {"id": "PMMVY-O5", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Is there a time-based accountability mechanism to clear pendency?", "q_hi": "क्या लंबित मामले निपटाने की कोई तय समय-सीमा है?", "alt_en": "Is there a fixed time limit to clear pending cases?", "alt_hi": "लंबित मामले निपटाने की कोई समय-सीमा है?", "kw": "pendency timeline, accountability, समय सीमा", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Is there a time-based accountability mechanism to clear pendency?*\n\nNo fixed time limit is prescribed. Service providers at all levels are encouraged to clear pendency as soon as possible, though no mandatory timeline exists unless the application is approaching the system's time-lapse deadline.", "wa_hi": "*क्या लंबित मामले निपटाने की कोई तय समय-सीमा है?*\n\nकोई तय समय-सीमा नहीं है। सभी स्तर के कर्मचारियों से उम्मीद है कि वे लंबित मामले जल्द से जल्द निपटाएँ। हाँ, जिन आवेदनों की सिस्टम वाली समय-सीमा (time-lapse) पास आ रही हो, उन्हें पहले निपटाना ज़रूरी है।"}, {"id": "PMMVY-O6", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "What types of reports are available for review in PMMVYsoft?", "q_hi": "PMMVYsoft में समीक्षा के लिए कौन-सी रिपोर्ट मिलती हैं?", "alt_en": "Which reports are available in PMMVYsoft?", "alt_hi": "PMMVYsoft में कौन-सी रिपोर्ट मिलती हैं?", "kw": "reports, beneficiary-wise, instalment-wise, रिपोर्ट", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What types of reports are available for review in PMMVYsoft?*\n\n*Reports available include:*\n• Beneficiary-wise reports\n• Instalment-wise payment reports", "wa_hi": "*PMMVYsoft में समीक्षा के लिए कौन-सी रिपोर्ट मिलती हैं?*\n\n*उपलब्ध रिपोर्ट:*\n• हितग्राही-वार रिपोर्ट\n• किस्त-वार भुगतान रिपोर्ट"}, {"id": "PMMVY-O7", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How are delays identified in PMMVYsoft?", "q_hi": "PMMVYsoft में देरी कैसे पहचानी जाती है?", "alt_en": "How to find delays in PMMVYsoft?", "alt_hi": "PMMVYsoft में देरी कैसे पता करें?", "kw": "ageing report, delays, देरी रिपोर्ट", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How are delays identified in PMMVYsoft?*\n\n*Delays can be identified through:*\n• Ageing reports (cases pending beyond expected timelines)\n• Stage-wise pendency reports\n• Beneficiary line-list pendency reports", "wa_hi": "*PMMVYsoft में देरी कैसे पहचानी जाती है?*\n\n*इन रिपोर्टों से:*\n• एजिंग रिपोर्ट (तय समय से ज़्यादा लंबित मामले)\n• चरण-वार लंबित रिपोर्ट\n• हितग्राही नामवार लंबित सूची"}, {"id": "PMMVY-O8", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Can PMMVYsoft track rejected applications and the reasons for rejection?", "q_hi": "क्या PMMVYsoft में रिजेक्ट हुए आवेदन और उनके कारण देखे जा सकते हैं?", "alt_en": "Can I see rejected applications and reasons?", "alt_hi": "रिजेक्ट आवेदन और कारण कैसे देखें?", "kw": "rejected applications, rejection reasons, रिजेक्शन कारण", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Can PMMVYsoft track rejected applications and the reasons for rejection?*\n\n*Yes.* The system captures rejection reasons, such as eligibility issues, Aadhaar mismatch, or incorrect documentation, to support corrective action.", "wa_hi": "*क्या PMMVYsoft में रिजेक्ट हुए आवेदन और उनके कारण देखे जा सकते हैं?*\n\n*हाँ।* सिस्टम रिजेक्शन का कारण (जैसे पात्रता की समस्या, आधार मेल न खाना, गलत दस्तावेज़) दर्ज करता है, ताकि सुधार किया जा सके।"}, {"id": "PMMVY-O9", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How is payment tracking done in PMMVYsoft?", "q_hi": "PMMVYsoft में भुगतान की ट्रैकिंग कैसे होती है?", "alt_en": "How is payment tracked?", "alt_hi": "भुगतान की ट्रैकिंग कैसे होती है?", "kw": "payment tracking, SNA SPARSH, भुगतान ट्रैकिंग", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How is payment tracking done in PMMVYsoft?*\n\nPayment tracking is done through integration with SNA SPARSH, where officials can view payment status (processed, failed, or pending) and transaction details.", "wa_hi": "*PMMVYsoft में भुगतान की ट्रैकिंग कैसे होती है?*\n\nयह SNA स्पर्श (SNA SPARSH) से जुड़ाव के ज़रिए होती है। अधिकारी वहाँ भुगतान की स्थिति (हो गया, फेल या लंबित) और लेन-देन का विवरण देख सकते हैं।"}, {"id": "PMMVY-O10", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How is child immunisation monitored in PMMVY?", "q_hi": "PMMVY में बच्चे के टीकाकरण की निगरानी कैसे होती है?", "alt_en": "How is child vaccination monitored?", "alt_hi": "बच्चे के टीकाकरण की निगरानी कैसे होती है?", "kw": "immunisation monitoring, SNO report, टीकाकरण निगरानी", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How is child immunisation monitored in PMMVY?*\n\nImmunisation status can be monitored by accessing the State Nodal Officer (SNO) level report within the PMMVY portal.", "wa_hi": "*PMMVY में बच्चे के टीकाकरण की निगरानी कैसे होती है?*\n\nPMMVY पोर्टल पर राज्य नोडल अधिकारी (SNO) स्तर की रिपोर्ट से टीकाकरण की स्थिति देखी जा सकती है।"}, {"id": "PMMVY-O11", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "What role do supervisors play in monitoring through PMMVYsoft?", "q_hi": "PMMVYsoft से निगरानी में अधिकारियों की क्या भूमिका है?", "alt_en": "What do DPO and CDPO do in monitoring?", "alt_hi": "निगरानी में DPO/CDPO क्या करते हैं?", "kw": "supervisor role, DPO, CDPO, अधिकारी भूमिका", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What role do supervisors play in monitoring through PMMVYsoft?*\n\nSupervisors (DPO/CDPO) review dashboards, monitor field-level performance, resolve bottlenecks, and ensure timely approvals using system-generated reports.", "wa_hi": "*PMMVYsoft से निगरानी में अधिकारियों की क्या भूमिका है?*\n\nDPO/CDPO डैशबोर्ड देखते हैं, मैदानी स्तर के काम पर नज़र रखते हैं, रुकावटें दूर करते हैं और सिस्टम की रिपोर्ट के आधार पर समय पर स्वीकृति सुनिश्चित करते हैं।"}, {"id": "PMMVY-O12", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "How does PMMVYsoft support review meetings?", "q_hi": "समीक्षा बैठकों में PMMVYsoft कैसे मदद करता है?", "alt_en": "How is PMMVYsoft used in review meetings?", "alt_hi": "समीक्षा बैठक में PMMVYsoft कैसे काम आता है?", "kw": "review meeting, performance, समीक्षा बैठक", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How does PMMVYsoft support review meetings?*\n\n*Officials use system-generated reports and dashboards to:*\n• Analyse performance trends\n• Identify low-performing areas\n• Review pendency and delays\n• Plan corrective actions", "wa_hi": "*समीक्षा बैठकों में PMMVYsoft कैसे मदद करता है?*\n\n*अधिकारी सिस्टम की रिपोर्ट और डैशबोर्ड से:*\n• काम की प्रगति का रुझान देखते हैं\n• कमज़ोर प्रदर्शन वाले क्षेत्र पहचानते हैं\n• लंबित मामलों और देरी की समीक्षा करते हैं\n• सुधार की योजना बनाते हैं"}, {"id": "PMMVY-O13", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "What actions can be taken based on monitoring insights from PMMVYsoft?", "q_hi": "PMMVYsoft की निगरानी से मिली जानकारी पर क्या कदम उठाए जा सकते हैं?", "alt_en": "What action to take after monitoring?", "alt_hi": "निगरानी के बाद क्या कदम उठाएँ?", "kw": "corrective action, training, follow-up, सुधार कदम", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What actions can be taken based on monitoring insights from PMMVYsoft?*\n\n*Actions include:*\n• Clearing pending applications\n• Correcting data errors\n• Conducting refresher trainings\n• Strengthening field-level follow-up", "wa_hi": "*PMMVYsoft की निगरानी से मिली जानकारी पर क्या कदम उठाए जा सकते हैं?*\n\n*ये कदम उठाए जाते हैं:*\n• लंबित आवेदन निपटाना\n• डेटा की गलतियाँ सुधारना\n• दोबारा प्रशिक्षण (रिफ्रेशर) देना\n• मैदानी स्तर पर फॉलो-अप मज़बूत करना"}, {"id": "PMMVY-O14", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Who is responsible for monitoring PMMVY at different levels?", "q_hi": "अलग-अलग स्तर पर PMMVY की निगरानी कौन करता है?", "alt_en": "Who monitors PMMVY at each level?", "alt_hi": "हर स्तर पर निगरानी कौन करता है?", "kw": "monitoring levels, MoWCD, DPO, CDPO, निगरानी स्तर", "aud": "All", "wa_en": "*Who is responsible for monitoring PMMVY at different levels?*\n\n• *National level:* Ministry of Women and Child Development (MoWCD)\n• *State level:* State PMMVY Cells\n• *District level:* District Programme Officers (DPOs)\n• *Block level:* CDPOs\n• *Field level:* Anganwadi Workers (AWWs)", "wa_hi": "*अलग-अलग स्तर पर PMMVY की निगरानी कौन करता है?*\n\n• *राष्ट्रीय स्तर:* महिला एवं बाल विकास मंत्रालय (MoWCD)\n• *राज्य स्तर:* राज्य PMMVY सेल\n• *जिला स्तर:* जिला कार्यक्रम अधिकारी (DPO)\n• *ब्लॉक स्तर:* CDPO\n• *मैदानी स्तर:* आंगनवाड़ी कार्यकर्ता"}, {"id": "PMMVY-O15", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Why is there a need for AWC-wise time-lapse case lists?", "q_hi": "आंगनवाड़ी-वार टाइम-लैप्स मामलों की सूची की ज़रूरत क्यों है?", "alt_en": "Why do we need centre-wise time-lapse lists?", "alt_hi": "केंद्र-वार टाइम-लैप्स सूची क्यों ज़रूरी है?", "kw": "time-lapse list, 30 days, केंद्र-वार सूची", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why is there a need for AWC-wise time-lapse case lists?*\n\nAWC-wise time-lapse case lists for cases pending beyond 30 days are required to strengthen monitoring, improve follow-up, and ensure timely case closure.", "wa_hi": "*आंगनवाड़ी-वार टाइम-लैप्स मामलों की सूची की ज़रूरत क्यों है?*\n\n30 दिन से ज़्यादा लंबित मामलों की केंद्र-वार सूची होने से निगरानी मज़बूत होती है, फॉलो-अप बेहतर होता है और मामले समय पर निपटते हैं।"}, {"id": "PMMVY-O16", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Why do supervisors require AWC-level data for residency period updates?", "q_hi": "सुपरवाइजर को निवास अवधि अपडेट करने के लिए आंगनवाड़ी-स्तर का डेटा क्यों चाहिए?", "alt_en": "Why do supervisors need AWC data for residency updates?", "alt_hi": "निवास अवधि अपडेट के लिए केंद्र का डेटा क्यों चाहिए?", "kw": "residency period, AWC data, निवास अवधि", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why do supervisors require AWC-level data for residency period updates?*\n\nSupervisors need easy access to AWC-level data to efficiently verify and update beneficiary residency periods. Currently, this information is not readily accessible in the system.", "wa_hi": "*सुपरवाइजर को निवास अवधि अपडेट करने के लिए आंगनवाड़ी-स्तर का डेटा क्यों चाहिए?*\n\nहितग्राही की निवास अवधि जल्दी जाँचने और अपडेट करने के लिए सुपरवाइजर को केंद्र-स्तर का डेटा आसानी से मिलना चाहिए। अभी यह जानकारी सिस्टम में आसानी से उपलब्ध नहीं है।"}, {"id": "PMMVY-O17", "t": "S", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Is there a report available for monitoring AWW login activity?", "q_hi": "क्या कार्यकर्ताओं के लॉगिन की निगरानी के लिए कोई रिपोर्ट है?", "alt_en": "Is there a report of worker login activity?", "alt_hi": "कार्यकर्ता के लॉगिन की रिपोर्ट है?", "kw": "login report, inactive users, लॉगिन रिपोर्ट", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Is there a report available for monitoring AWW login activity?*\n\nCurrently, there is no system-generated report showing AWW login activity, such as last login date or inactive users, which affects monitoring and accountability.", "wa_hi": "*क्या कार्यकर्ताओं के लॉगिन की निगरानी के लिए कोई रिपोर्ट है?*\n\nअभी सिस्टम में ऐसी कोई रिपोर्ट नहीं है जो कार्यकर्ता का आखिरी लॉगिन या निष्क्रिय यूज़र दिखाए। इससे निगरानी और जवाबदेही पर असर पड़ता है।"}, {"id": "PMMVY-O18", "t": "A", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "If the list of beneficiaries is not visible in the PMMVY app, what should be done?", "q_hi": "यदि PMMVY ऐप में हितग्राहियों की सूची नहीं दिख रही है, तो क्या करें?", "alt_en": "Beneficiary list not showing in the app", "alt_hi": "ऐप में हितग्राहियों की सूची नहीं दिख रही", "kw": "list not visible, beneficiary list, सूची नहीं दिख रही", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If the list of beneficiaries is not visible in the PMMVY app, what should be done?*\n\nTry again after some time and clear the browser cache and history. If the problem continues, inform the technical team.", "wa_hi": "*यदि PMMVY ऐप में हितग्राहियों की सूची नहीं दिख रही है, तो क्या करें?*\n\nकुछ समय बाद दोबारा प्रयास करें, ब्राउज़र की कैश और हिस्ट्री साफ करें। फिर भी समस्या रहे तो तकनीकी टीम को बताएँ।"}, {"id": "PMMVY-O19", "t": "A", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "If reports are not visible in the PMMVY app, what should be done?", "q_hi": "यदि PMMVY ऐप में रिपोर्ट नहीं दिख रही है, तो क्या करें?", "alt_en": "Reports not showing in the app", "alt_hi": "ऐप में रिपोर्ट नहीं दिख रही", "kw": "reports not visible, रिपोर्ट नहीं दिख रही", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If reports are not visible in the PMMVY app, what should be done?*\n\nRefresh the app/portal and clear the browser cache and history. If the problem continues, inform the technical team.", "wa_hi": "*यदि PMMVY ऐप में रिपोर्ट नहीं दिख रही है, तो क्या करें?*\n\nऐप/पोर्टल रीफ्रेश करें, ब्राउज़र की कैश और हिस्ट्री साफ करें। फिर भी समस्या रहे तो तकनीकी टीम को बताएँ।"}, {"id": "PMMVY-O20", "t": "A", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "Why is a facility to view the complete name-wise pre-registration list at once needed in the DNO login, and how can it be viewed?", "q_hi": "DNO लॉगिन में pre-registration की पूरी नामवार सूची एक साथ देखने की सुविधा क्यों ज़रूरी है और इसे कैसे देखें?", "alt_en": "Can DNO see full name-wise pre-registration list?", "alt_hi": "DNO लॉगिन में पूरी नामवार सूची कैसे देखें?", "kw": "DNO list, name-wise, pre-registration, नामवार सूची", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*Why is a facility to view the complete name-wise pre-registration list at once needed in the DNO login, and how can it be viewed?*\n\nThis facility is needed to make supervision and verification easier. At present, the portal shows the name-wise list only centre by centre.", "wa_hi": "*DNO लॉगिन में pre-registration की पूरी नामवार सूची एक साथ देखने की सुविधा क्यों ज़रूरी है और इसे कैसे देखें?*\n\nनिगरानी और सत्यापन आसान बनाने के लिए यह सुविधा ज़रूरी है। अभी पोर्टल पर नामवार सूची केवल केंद्र-वार ही देखी जा सकती है।"}, {"id": "PMMVY-O21", "t": "A", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "If the beneficiary's name cannot be copy-pasted while preparing the pre-registration list in the DNO login, what should be done?", "q_hi": "DNO लॉगिन में pre-registration सूची बनाते समय हितग्राही का नाम Copy-Paste नहीं हो रहा है, तो क्या करें?", "alt_en": "Cannot copy-paste name in DNO pre-registration list", "alt_hi": "DNO सूची में नाम कॉपी-पेस्ट नहीं हो रहा", "kw": "copy paste, DNO, कॉपी पेस्ट", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*If the beneficiary's name cannot be copy-pasted while preparing the pre-registration list in the DNO login, what should be done?*\n\nFirst check the text format/special characters and try using a different browser. If the problem continues, type the name manually.", "wa_hi": "*DNO लॉगिन में pre-registration सूची बनाते समय हितग्राही का नाम Copy-Paste नहीं हो रहा है, तो क्या करें?*\n\nपहले टेक्स्ट फॉर्मेट/विशेष चिह्न जाँचें और दूसरे ब्राउज़र में प्रयास करें। फिर भी समस्या रहे तो नाम खुद टाइप करें।"}, {"id": "PMMVY-O22", "t": "A", "sec_en": "O. Monitoring & Review", "sec_hi": "O. निगरानी और समीक्षा", "q_en": "If there are too many old pending cases, how should the Anganwadi worker organise and complete them by priority?", "q_hi": "यदि पुराने लंबित मामले बहुत ज़्यादा हों, तो कार्यकर्ता उन्हें प्राथमिकता से कैसे निपटाए?", "alt_en": "Too many old pending cases, where to start?", "alt_hi": "पुराने लंबित मामले बहुत हैं, कहाँ से शुरू करें?", "kw": "old pending, prioritise, पुराने मामले, प्राथमिकता", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If there are too many old pending cases, how should the Anganwadi worker organise and complete them by priority?*\n\nFirst identify cases that have been pending for a long time and those nearing the time limit, clear them step by step, and maintain a regular review list.", "wa_hi": "*यदि पुराने लंबित मामले बहुत ज़्यादा हों, तो कार्यकर्ता उन्हें प्राथमिकता से कैसे निपटाए?*\n\nसबसे पहले लंबे समय से लंबित और समय-सीमा के करीब पहुँच रहे मामलों को पहचानें, उन्हें एक-एक करके निपटाएँ और नियमित समीक्षा सूची बनाए रखें।"}, {"id": "PMMVY-P1", "t": "S", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "What types of trainings are conducted under PMMVY?", "q_hi": "PMMVY में कौन-से प्रशिक्षण होते हैं?", "alt_en": "What trainings happen under PMMVY?", "alt_hi": "PMMVY में कौन-से प्रशिक्षण होते हैं?", "kw": "training, SPNIWCD, refresher, प्रशिक्षण, ट्रेनिंग", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What types of trainings are conducted under PMMVY?*\n\nThere is no fixed training calendar for PMMVY. Trainings form part of a broader two-day programme organised by SPNIWCD. State/district level trainings include induction training for new staff, need-based refresher trainings, and Training of Trainers (ToT) sessions.", "wa_hi": "*PMMVY में कौन-से प्रशिक्षण होते हैं?*\n\nPMMVY के लिए कोई तय प्रशिक्षण कैलेंडर नहीं है। प्रशिक्षण SPNIWCD द्वारा आयोजित दो दिन के बड़े कार्यक्रम का हिस्सा होता है। राज्य/जिला स्तर पर नए कर्मचारियों का प्रारंभिक प्रशिक्षण, ज़रूरत के अनुसार रिफ्रेशर प्रशिक्षण और मास्टर ट्रेनर (ToT) प्रशिक्षण होते हैं।"}, {"id": "PMMVY-P2", "t": "S", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "What is the Training of Trainers (ToT) approach in PMMVY?", "q_hi": "PMMVY में मास्टर ट्रेनर (ToT) प्रशिक्षण क्या है?", "alt_en": "What is ToT training?", "alt_hi": "ToT प्रशिक्षण क्या है?", "kw": "ToT, master trainer, मास्टर ट्रेनर", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What is the Training of Trainers (ToT) approach in PMMVY?*\n\nToT involves training selected master trainers at the national or state level, who then cascade training down to district, block, and field-level functionaries.", "wa_hi": "*PMMVY में मास्टर ट्रेनर (ToT) प्रशिक्षण क्या है?*\n\nइसमें राष्ट्रीय या राज्य स्तर पर चुने हुए मास्टर ट्रेनरों को प्रशिक्षण दिया जाता है। फिर वे जिला, ब्लॉक और मैदानी स्तर के कर्मचारियों को प्रशिक्षण देते हैं।"}, {"id": "PMMVY-P3", "t": "S", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "What training materials are used for capacity building?", "q_hi": "प्रशिक्षण में कौन-सी सामग्री उपयोग होती है?", "alt_en": "What material is used in training?", "alt_hi": "प्रशिक्षण में कौन-सी सामग्री मिलती है?", "kw": "training material, guidelines, SoP, प्रशिक्षण सामग्री", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What training materials are used for capacity building?*\n\nTraining materials include the PMMVY operational guidelines, SoP documents, and module-wise reference guides made available by MoWCD and SPNIWCD.", "wa_hi": "*प्रशिक्षण में कौन-सी सामग्री उपयोग होती है?*\n\nPMMVY के संचालन दिशा-निर्देश, SoP दस्तावेज़ और MoWCD व SPNIWCD द्वारा दी गई मॉड्यूल-वार मार्गदर्शिकाएँ।"}, {"id": "PMMVY-P4", "t": "S", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "How is digital capacity built for PMMVY implementation?", "q_hi": "PMMVY के लिए डिजिटल प्रशिक्षण कैसे दिया जाता है?", "alt_en": "How is digital training given?", "alt_hi": "डिजिटल प्रशिक्षण कैसे दिया जाता है?", "kw": "digital training, PMMVYsoft training, डिजिटल प्रशिक्षण", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How is digital capacity built for PMMVY implementation?*\n\nOfficials are trained on PMMVYsoft, covering data entry, verification, report generation, and troubleshooting system issues.", "wa_hi": "*PMMVY के लिए डिजिटल प्रशिक्षण कैसे दिया जाता है?*\n\nअधिकारियों को PMMVYsoft पर डेटा एंट्री, सत्यापन, रिपोर्ट निकालने और सिस्टम की समस्याएँ सुलझाने का प्रशिक्षण दिया जाता है।"}, {"id": "PMMVY-P5", "t": "S", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "How frequently are capacity building activities conducted?", "q_hi": "प्रशिक्षण कितनी बार होता है?", "alt_en": "How often is training conducted?", "alt_hi": "प्रशिक्षण कितनी बार होता है?", "kw": "training frequency, कितनी बार प्रशिक्षण", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*How frequently are capacity building activities conducted?*\n\nCapacity building activities are conducted periodically, based on need, typically when new staff join, when system updates are introduced, or when significant implementation gaps are identified at field level.", "wa_hi": "*प्रशिक्षण कितनी बार होता है?*\n\nप्रशिक्षण ज़रूरत के अनुसार समय-समय पर होता है, जैसे नए कर्मचारी आने पर, सिस्टम में बदलाव होने पर, या मैदानी स्तर पर काम में बड़ी कमी दिखने पर।"}, {"id": "PMMVY-P6", "t": "A", "sec_en": "P. Capacity Building", "sec_hi": "P. क्षमता निर्माण (प्रशिक्षण)", "q_en": "If a worker has not received PMMVY training on time, where can she get the necessary information and technical support?", "q_hi": "यदि कार्यकर्ता को समय पर PMMVY प्रशिक्षण नहीं मिला है, तो ज़रूरी जानकारी और तकनीकी मदद कहाँ से मिलेगी?", "alt_en": "I did not get training, where do I get help?", "alt_hi": "मुझे प्रशिक्षण नहीं मिला, मदद कहाँ से लूँ?", "kw": "no training, help, user manual, प्रशिक्षण नहीं मिला", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*If a worker has not received PMMVY training on time, where can she get the necessary information and technical support?*\n\nHelp can be taken from the Supervisor, the CDPO office, the District Programme Officer's office, or the user manual/guide available on the PMMVY portal.", "wa_hi": "*यदि कार्यकर्ता को समय पर PMMVY प्रशिक्षण नहीं मिला है, तो ज़रूरी जानकारी और तकनीकी मदद कहाँ से मिलेगी?*\n\nसुपरवाइजर, CDPO कार्यालय, जिला कार्यक्रम अधिकारी कार्यालय या PMMVY पोर्टल पर उपलब्ध यूज़र मैनुअल/मार्गदर्शिका से मदद ली जा सकती है।"}, {"id": "PMMVY-Q1", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What is grievance redressal in PMMVY?", "q_hi": "PMMVY में शिकायत निवारण क्या है?", "alt_en": "What is grievance redressal in PMMVY?", "alt_hi": "PMMVY में शिकायत निवारण क्या है?", "kw": "grievance, complaint, शिकायत, निवारण", "aud": "All", "wa_en": "*What is grievance redressal in PMMVY?*\n\nIt is the mechanism through which beneficiaries can raise complaints related to registration, eligibility, payment delays, or status of application, and have them resolved in a time-bound manner.", "wa_hi": "*PMMVY में शिकायत निवारण क्या है?*\n\nयह वह व्यवस्था है जिसमें हितग्राही पंजीकरण, पात्रता, भुगतान में देरी या आवेदन की स्थिति से जुड़ी शिकायत दर्ज करा सकती है और तय समय में उसका समाधान होता है।"}, {"id": "PMMVY-Q2", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What types of grievances are commonly reported under PMMVY?", "q_hi": "PMMVY में आमतौर पर कौन-सी शिकायतें आती हैं?", "alt_en": "What kind of complaints come under PMMVY?", "alt_hi": "PMMVY में किस तरह की शिकायतें आती हैं?", "kw": "common grievances, complaint types, शिकायतों के प्रकार", "aud": "All", "wa_en": "*What types of grievances are commonly reported under PMMVY?*\n\n*Common grievances include:*\n• Non-receipt or delay of instalments\n• Incorrect rejection of applications\n• Aadhaar or bank-related issues\n• Errors in beneficiary details\n• Technical problems in PMMVYsoft\n• Incomplete registration of applicants", "wa_hi": "*PMMVY में आमतौर पर कौन-सी शिकायतें आती हैं?*\n\n*आम शिकायतें:*\n• किस्त न मिलना या देर से मिलना\n• आवेदन गलत तरीके से रिजेक्ट होना\n• आधार या बैंक से जुड़ी समस्याएँ\n• हितग्राही की जानकारी में गलती\n• PMMVYsoft में तकनीकी समस्या\n• आवेदक का पंजीकरण अधूरा रहना"}, {"id": "PMMVY-Q3", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "How can beneficiaries register a grievance under PMMVY?", "q_hi": "हितग्राही शिकायत कैसे दर्ज कराए?", "alt_en": "How do I file a complaint?", "alt_hi": "शिकायत कैसे दर्ज करूँ?", "kw": "file complaint, 1515, CPGRAMS, शिकायत दर्ज, helpline, shikayat kaise kare, complaint kaise kare", "aud": "Beneficiary", "wa_en": "*How can beneficiaries register a grievance under PMMVY?*\n\n*Grievances can be registered through:*\n• The online grievance portal on the PMMVY platform\n• The PMMVY toll-free helpline (1515)\n• Official contact channels at the block, district, or state level\n• The CPGRAMS portal", "wa_hi": "*हितग्राही शिकायत कैसे दर्ज कराए?*\n\n*शिकायत यहाँ दर्ज कराई जा सकती है:*\n• PMMVY पोर्टल पर ऑनलाइन शिकायत सुविधा\n• PMMVY टोल-फ्री हेल्पलाइन 1515\n• ब्लॉक, जिला या राज्य स्तर के कार्यालय\n• CPGRAMS पोर्टल"}, {"id": "PMMVY-Q4", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Who is responsible for handling grievances at different levels?", "q_hi": "अलग-अलग स्तर पर शिकायतों का निपटारा कौन करता है?", "alt_en": "Who handles complaints at each level?", "alt_hi": "शिकायत कौन सुनता है?", "kw": "grievance officer, CDPO, DPO, शिकायत कौन सुनेगा", "aud": "All", "wa_en": "*Who is responsible for handling grievances at different levels?*\n\n• *Block level:* CDPO and Supervisors\n• *District level:* District Programme Officer (DPO)\n• *State level:* State PMMVY Cell\n• *National level:* Ministry of Women and Child Development (MoWCD)", "wa_hi": "*अलग-अलग स्तर पर शिकायतों का निपटारा कौन करता है?*\n\n• *ब्लॉक स्तर:* CDPO और सुपरवाइजर\n• *जिला स्तर:* जिला कार्यक्रम अधिकारी (DPO)\n• *राज्य स्तर:* राज्य PMMVY सेल\n• *राष्ट्रीय स्तर:* महिला एवं बाल विकास मंत्रालय (MoWCD)"}, {"id": "PMMVY-Q5", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Is there a timeline for resolving grievances?", "q_hi": "क्या शिकायत निपटाने की कोई समय-सीमा है?", "alt_en": "How long does it take to solve a complaint?", "alt_hi": "शिकायत कितने दिन में हल होगी?", "kw": "grievance timeline, 15 to 30 days, कितने दिन", "aud": "Beneficiary", "wa_en": "*Is there a timeline for resolving grievances?*\n\n*Yes.* Grievances are expected to be resolved within a defined period, typically 15 to 30 days, depending on the nature and complexity of the issue.", "wa_hi": "*क्या शिकायत निपटाने की कोई समय-सीमा है?*\n\n*हाँ।* शिकायत की प्रकृति और जटिलता के अनुसार आमतौर पर 15 से 30 दिन में समाधान होना चाहिए।"}, {"id": "PMMVY-Q6", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What role do frontline workers play in grievance redressal?", "q_hi": "शिकायत निवारण में आंगनवाड़ी कार्यकर्ता की क्या भूमिका है?", "alt_en": "What does the Anganwadi worker do in complaints?", "alt_hi": "शिकायत में कार्यकर्ता क्या मदद करती है?", "kw": "AWW role, frontline, कार्यकर्ता भूमिका", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*What role do frontline workers play in grievance redressal?*\n\nAnganwadi Workers assist beneficiaries in raising complaints, verifying issues at the field level, and coordinating with higher officials for resolution.", "wa_hi": "*शिकायत निवारण में आंगनवाड़ी कार्यकर्ता की क्या भूमिका है?*\n\nकार्यकर्ता हितग्राही को शिकायत दर्ज कराने में मदद करती है, मौके पर समस्या की जाँच करती है और समाधान के लिए बड़े अधिकारियों से तालमेल करती है।"}, {"id": "PMMVY-Q7", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What measures ensure accountability in grievance redressal?", "q_hi": "शिकायत निवारण में जवाबदेही कैसे तय होती है?", "alt_en": "How is accountability ensured in complaints?", "alt_hi": "शिकायत निवारण में जवाबदेही कैसे तय होती है?", "kw": "accountability, escalation, जवाबदेही", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*What measures ensure accountability in grievance redressal?*\n\n• Regular review of pending grievances\n• Escalation mechanisms for unresolved cases\n• Monitoring through MIS dashboards\n• Documentation of actions taken", "wa_hi": "*शिकायत निवारण में जवाबदेही कैसे तय होती है?*\n\n• लंबित शिकायतों की नियमित समीक्षा\n• हल न होने पर शिकायत ऊपर के स्तर पर भेजने की व्यवस्था\n• MIS डैशबोर्ड से निगरानी\n• की गई कार्यवाही का रिकॉर्ड"}, {"id": "PMMVY-Q8", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "How does an effective grievance redressal system benefit PMMVY?", "q_hi": "अच्छी शिकायत निवारण व्यवस्था से PMMVY को क्या फायदा होता है?", "alt_en": "How does a good grievance system help PMMVY?", "alt_hi": "अच्छी शिकायत व्यवस्था से क्या फायदा है?", "kw": "grievance benefits, transparency, पारदर्शिता", "aud": "Official (CDPO/DPO/DNO)", "wa_en": "*How does an effective grievance redressal system benefit PMMVY?*\n\nIt improves transparency, builds beneficiary trust, reduces errors, ensures timely payments, and strengthens overall scheme implementation.", "wa_hi": "*अच्छी शिकायत निवारण व्यवस्था से PMMVY को क्या फायदा होता है?*\n\nइससे पारदर्शिता बढ़ती है, हितग्राही का भरोसा बनता है, गलतियाँ कम होती हैं, भुगतान समय पर होता है और योजना बेहतर ढंग से चलती है।"}, {"id": "PMMVY-Q9", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Where can PMMVY-related grievances be escalated if not resolved at lower levels?", "q_hi": "नीचे के स्तर पर शिकायत हल न हो तो उसे आगे कहाँ भेजें?", "alt_en": "Complaint not solved locally, where to go next?", "alt_hi": "शिकायत हल नहीं हुई, आगे कहाँ जाएँ?", "kw": "escalate, CPGRAMS, State cell, आगे शिकायत", "aud": "Beneficiary", "wa_en": "*Where can PMMVY-related grievances be escalated if not resolved at lower levels?*\n\nIf a grievance remains unresolved at the block or district level, it can be escalated to the State PMMVY Cell and, if necessary, to MoWCD through the Centralised Public Grievance Redress and Monitoring System (CPGRAMS) or the Open House led by NIC.", "wa_hi": "*नीचे के स्तर पर शिकायत हल न हो तो उसे आगे कहाँ भेजें?*\n\nब्लॉक या जिला स्तर पर हल न होने पर शिकायत राज्य PMMVY सेल को भेजी जा सकती है। ज़रूरत हो तो CPGRAMS पोर्टल या NIC के ओपन हाउस के माध्यम से MoWCD तक भी पहुँचाई जा सकती है।"}, {"id": "PMMVY-Q10", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What details do I need to provide while raising a grievance?", "q_hi": "शिकायत दर्ज करते समय कौन-सी जानकारी देनी होगी?", "alt_en": "What details are needed to file a complaint?", "alt_hi": "शिकायत के लिए कौन-सी जानकारी चाहिए?", "kw": "complaint details, application ID, Aadhaar, शिकायत जानकारी", "aud": "Beneficiary", "wa_en": "*What details do I need to provide while raising a grievance?*\n\n• Your Registration/Application ID\n• Aadhaar number (as applicable)\n• Mobile number linked to your application\n• Details of the issue (registration/payment/delay, etc.)", "wa_hi": "*शिकायत दर्ज करते समय कौन-सी जानकारी देनी होगी?*\n\n• पंजीकरण/आवेदन ID\n• आधार नंबर (जहाँ लागू हो)\n• आवेदन से जुड़ा मोबाइल नंबर\n• समस्या का विवरण (पंजीकरण/भुगतान/देरी आदि)"}, {"id": "PMMVY-Q11", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Who can raise a grievance under PMMVY?", "q_hi": "PMMVY में शिकायत कौन दर्ज करा सकता है?", "alt_en": "Who can file a PMMVY complaint?", "alt_hi": "शिकायत कौन कर सकता है?", "kw": "who can complain, family member, शिकायत कौन करे", "aud": "Beneficiary", "wa_en": "*Who can raise a grievance under PMMVY?*\n\nOnly the beneficiary (pregnant woman/lactating mother registered under PMMVY) and immediate family members can raise a grievance regarding her application, payment, or related issues. However, the contact number should remain the same as the one used in the application process.", "wa_hi": "*PMMVY में शिकायत कौन दर्ज करा सकता है?*\n\nकेवल हितग्राही (PMMVY में पंजीकृत गर्भवती/स्तनपान कराने वाली माँ) या उसके निकट परिवार के सदस्य उसके आवेदन, भुगतान या संबंधित समस्या की शिकायत कर सकते हैं। ध्यान रहे, मोबाइल नंबर वही हो जो आवेदन में दिया गया था।"}, {"id": "PMMVY-Q12", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Will I receive any confirmation after raising a grievance?", "q_hi": "शिकायत दर्ज करने के बाद क्या कोई पुष्टि मिलेगी?", "alt_en": "Will I get a complaint number?", "alt_hi": "क्या शिकायत नंबर मिलेगा?", "kw": "complaint number, reference number, शिकायत नंबर", "aud": "Beneficiary", "wa_en": "*Will I receive any confirmation after raising a grievance?*\n\nYes, you should receive a complaint/reference number to track your grievance.", "wa_hi": "*शिकायत दर्ज करने के बाद क्या कोई पुष्टि मिलेगी?*\n\n*हाँ*, आपको एक शिकायत/संदर्भ नंबर मिलेगा, जिससे आप शिकायत की स्थिति देख सकती हैं।"}, {"id": "PMMVY-Q13", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What should I do if my grievance is not resolved?", "q_hi": "यदि मेरी शिकायत हल नहीं हुई तो क्या करूँ?", "alt_en": "My complaint is not solved, what now?", "alt_hi": "मेरी शिकायत हल नहीं हुई, अब क्या करूँ?", "kw": "grievance not resolved, follow up, शिकायत हल नहीं", "aud": "Beneficiary", "wa_en": "*What should I do if my grievance is not resolved?*\n\n• Follow up using your complaint number\n• Contact the higher authority/block or district office\n• Seek support from your AWW/ASHA", "wa_hi": "*यदि मेरी शिकायत हल नहीं हुई तो क्या करूँ?*\n\n• शिकायत नंबर से फॉलो-अप करें\n• ऊपर के अधिकारी/ब्लॉक या जिला कार्यालय से संपर्क करें\n• अपनी आंगनवाड़ी कार्यकर्ता/आशा से मदद लें"}, {"id": "PMMVY-Q14", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Can I raise a grievance for multiple issues at once (e.g., registration + payment)?", "q_hi": "क्या एक साथ कई समस्याओं (जैसे पंजीकरण और भुगतान) की शिकायत कर सकती हूँ?", "alt_en": "Can I complain about two problems together?", "alt_hi": "क्या दो समस्याओं की एक साथ शिकायत कर सकती हूँ?", "kw": "multiple issues, one complaint, एक साथ शिकायत", "aud": "Beneficiary", "wa_en": "*Can I raise a grievance for multiple issues at once (e.g., registration + payment)?*\n\nYes, but it is better to clearly mention all issues in one complaint or raise separate grievances for faster resolution.", "wa_hi": "*क्या एक साथ कई समस्याओं (जैसे पंजीकरण और भुगतान) की शिकायत कर सकती हूँ?*\n\n*हाँ*, लेकिन एक शिकायत में सभी समस्याएँ साफ-साफ लिखें, या जल्दी समाधान के लिए अलग-अलग शिकायत दर्ज करें।"}, {"id": "PMMVY-Q15", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "What if my mobile number has changed? Can I still raise a grievance?", "q_hi": "मेरा मोबाइल नंबर बदल गया है, क्या मैं फिर भी शिकायत कर सकती हूँ?", "alt_en": "My mobile number changed, can I still complain?", "alt_hi": "मोबाइल नंबर बदल गया, क्या शिकायत कर सकती हूँ?", "kw": "mobile changed, complaint, नंबर बदल गया", "aud": "Beneficiary", "wa_en": "*What if my mobile number has changed? Can I still raise a grievance?*\n\n*Yes.* You can still raise a grievance with your Application ID and Aadhaar details.", "wa_hi": "*मेरा मोबाइल नंबर बदल गया है, क्या मैं फिर भी शिकायत कर सकती हूँ?*\n\n*हाँ।* आवेदन ID और आधार की जानकारी से शिकायत दर्ज की जा सकती है।"}, {"id": "PMMVY-Q16", "t": "S", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Can I raise a grievance if I migrated to another district/state?", "q_hi": "दूसरे जिले/राज्य में चले जाने पर क्या मैं शिकायत कर सकती हूँ?", "alt_en": "I moved to another district, can I complain?", "alt_hi": "दूसरे जिले/राज्य में आ गई, क्या शिकायत कर सकती हूँ?", "kw": "migrated, other state, दूसरा जिला", "aud": "Beneficiary", "wa_en": "*Can I raise a grievance if I migrated to another district/state?*\n\n*Yes.* You can still raise a grievance using your existing application details.", "wa_hi": "*दूसरे जिले/राज्य में चले जाने पर क्या मैं शिकायत कर सकती हूँ?*\n\n*हाँ।* अपने पुराने आवेदन की जानकारी से शिकायत दर्ज की जा सकती है।"}, {"id": "PMMVY-Q17", "t": "A", "sec_en": "Q. Grievance Redressal & Help", "sec_hi": "Q. शिकायत निवारण और सहायता", "q_en": "Whom can one contact for help with technical problems in the PMMVY app or portal? Is there a helpdesk?", "q_hi": "PMMVY ऐप या पोर्टल में तकनीकी समस्या होने पर मदद के लिए किससे संपर्क करें? क्या कोई हेल्पडेस्क है?", "alt_en": "Who helps with app or portal technical problems?", "alt_hi": "ऐप/पोर्टल की तकनीकी समस्या में मदद कौन करेगा?", "kw": "helpdesk, technical help, 1515, हेल्पडेस्क, तकनीकी मदद", "aud": "Field worker (AWW/ASHA/LS)", "wa_en": "*Whom can one contact for help with technical problems in the PMMVY app or portal? Is there a helpdesk?*\n\nFor technical problems, contact the PMMVY helpline 1515, the Open House sessions, or the local CDPO/District Programme Office.", "wa_hi": "*PMMVY ऐप या पोर्टल में तकनीकी समस्या होने पर मदद के लिए किससे संपर्क करें? क्या कोई हेल्पडेस्क है?*\n\nतकनीकी समस्या के लिए PMMVY हेल्पलाइन 1515, ओपन हाउस सत्र, या स्थानीय CDPO/जिला कार्यक्रम कार्यालय से संपर्क करें।"}];</script>
<script>
(function () {
  const T = {
    hi: { title: "PMMVY सहायक", sub: "प्रधानमंत्री मातृ वंदना योजना · 202 स्वीकृत प्रश्न-उत्तर", topics: "विषय", send: "भेजें",
      ph: "अपना प्रश्न लिखें… जैसे: पैसा नहीं आया", filter: "सूची में खोजें", filterLabel: "प्रश्न खोजें", askLabel: "अपना प्रश्न लिखें",
      fine: "उत्तर केवल स्वीकृत PMMVY FAQ (नवंबर 2026) से आते हैं। आधार या बैंक नंबर यहाँ न लिखें। अन्य सहायता: हेल्पलाइन 1515",
      hello: "नमस्ते! मैं PMMVY के प्रश्नों के उत्तर देता हूँ। हिंदी, English या Hinglish में पूछें, या नीचे से कोई प्रश्न चुनें।",
      popular: "लोग अक्सर पूछते हैं:", example: "उदाहरण", copy: "WhatsApp के लिए कॉपी करें", copied: "कॉपी हो गया", other: "English में देखें",
      related: "इनसे जुड़े प्रश्न:", unsure: "मुझे पक्का नहीं पता कि आप क्या पूछ रहे हैं। क्या आपका प्रश्न इनमें से कोई है?",
      none: "माफ़ कीजिए, इस प्रश्न का उत्तर स्वीकृत FAQ में नहीं मिला। कृपया दूसरे शब्दों में पूछें, बाईं ओर विषय सूची देखें, या PMMVY हेल्पलाइन 1515 पर कॉल करें।",
      aadhaar: "कृपया यहाँ आधार, बैंक खाता या मोबाइल नंबर न लिखें। इस सहायक को इनकी ज़रूरत नहीं है। अपना प्रश्न बिना नंबर के लिखें।",
      S: "★", A: "◆", copyFail: "कॉपी नहीं हुआ, संदेश चुनकर खुद कॉपी करें" },
    en: { title: "PMMVY FAQ Assistant", sub: "Pradhan Mantri Matru Vandana Yojana · 202 approved answers", topics: "Topics", send: "Send",
      ph: "Type your question… e.g. payment not received", filter: "Search the list", filterLabel: "Search questions", askLabel: "Type your question",
      fine: "Answers come only from the approved PMMVY FAQ (November 2026). Do not type Aadhaar or bank numbers here. Other help: helpline 1515",
      hello: "Hello! I answer questions about PMMVY. Ask in Hindi, English or Hinglish, or pick a question below.",
      popular: "People often ask:", example: "Example", copy: "Copy for WhatsApp", copied: "Copied", other: "हिंदी में देखें",
      related: "Related questions:", unsure: "I'm not sure what you mean. Is your question one of these?",
      none: "Sorry, I couldn't find this in the approved FAQ. Try other words, browse the topics on the left, or call the PMMVY helpline 1515.",
      aadhaar: "Please don't type Aadhaar, bank account or mobile numbers here. This assistant doesn't need them. Ask your question without the number.",
      S: "★", A: "◆", copyFail: "Couldn't copy. Select the message and copy it yourself" }
  };
  const POPULAR = ["PMMVY-C1", "PMMVY-B1", "PMMVY-E4", "PMMVY-M1", "PMMVY-H9", "PMMVY-Q3"];
  let lang = "hi";
  try { const s = localStorage.getItem("pmmvy-lang"); if (s === "en" || s === "hi") lang = s; } catch (e) {}
  let rows = [], byId = {}, engine = null;
  const $ = (id) => document.getElementById(id);
  const chat = $("chat");

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function waToHtml(t) {
    return esc(t).replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>").replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, "$1<em>$2</em>").replace(/\n/g, "<br>");
  }
  const q = (r, l) => (l === "hi" ? r.q_hi : r.q_en);
  const sec = (r, l) => (l === "hi" ? r.sec_hi : r.sec_en);

  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function scroll() { chat.scrollTop = chat.scrollHeight; }
  function addUser(text) { const r = el("div", "row user"); r.appendChild(el("div", "bubble", esc(text))); chat.appendChild(r); scroll(); }
  function addBot(node, cls) { const r = el("div", "row bot"); const b = el("div", "bubble" + (cls ? " " + cls : "")); b.appendChild(node); r.appendChild(b); chat.appendChild(r); scroll(); return b; }
  function chipList(ids) {
    const c = el("div", "chips");
    ids.forEach((id) => { const r = byId[id]; if (!r) return; const b = el("button", "chip"); b.type = "button"; b.textContent = q(r, lang); b.onclick = () => ask(q(r, lang), id); c.appendChild(b); });
    return c;
  }

  function answer(r, related, isExample) {
    let shown = lang;
    const wrap = el("div");
    if (isExample) wrap.appendChild(el("div", "example-tag", T[lang].example));
    const meta = el("div", "meta");
    const body = el("div", "msg");
    const acts = el("div", "actions");
    const copyB = el("button"); copyB.type = "button";
    const swapB = el("button"); swapB.type = "button";
    function paint() {
      meta.innerHTML = `<span class="pill ${r.t}">${T[shown][r.t]}</span><span>${esc(r.id)}</span><span>· ${esc(sec(r, shown).slice(3))}</span>`;
      body.innerHTML = waToHtml(shown === "hi" ? r.wa_hi : r.wa_en);
      copyB.textContent = T[shown].copy; swapB.textContent = T[shown].other;
    }
    copyB.onclick = async () => {
      try { await navigator.clipboard.writeText(shown === "hi" ? r.wa_hi : r.wa_en); copyB.textContent = T[shown].copied; setTimeout(() => (copyB.textContent = T[shown].copy), 1600); }
      catch (e) { copyB.textContent = T[shown].copyFail; }
    };
    swapB.onclick = () => { shown = shown === "hi" ? "en" : "hi"; paint(); };
    paint();
    acts.append(copyB, swapB);
    wrap.append(meta, body, acts);
    if (related && related.length) {
      const rel = el("div", "related"); rel.appendChild(el("p", null, esc(T[lang].related))); rel.appendChild(chipList(related)); wrap.appendChild(rel);
    }
    addBot(wrap);
  }

  function ask(text, forcedId) {
    text = (text || "").trim(); if (!text) return;
    addUser(text);
    if (!forcedId && /(\d[\s-]?){10,}/.test(text)) { addBot(el("div", null, esc(T[lang].aadhaar)), "note"); return; }
    if (forcedId) { const res = engine.search(q(byId[forcedId], "en") + " " + q(byId[forcedId], "hi"), 4).filter((x) => x.row.id !== forcedId).slice(0, 2).map((x) => x.row.id); answer(byId[forcedId], res); return; }
    const res = engine.search(text, 4);
    const top = res[0];
    if (top && top.conf >= 0.5) {
      const rel = res.slice(1).filter((x) => x.conf >= 0.4).slice(0, 2).map((x) => x.row.id);
      answer(top.row, rel);
    } else if (top && top.conf >= 0.35) {
      const w = el("div"); w.appendChild(el("p", null, esc(T[lang].unsure))); w.firstChild.style.margin = "0 0 8px";
      w.appendChild(chipList(res.slice(0, 3).map((x) => x.row.id))); addBot(w);
    } else {
      addBot(el("div", null, esc(T[lang].none)), "note");
    }
  }

  function buildToc(filter) {
    const f = (filter || "").trim().toLowerCase();
    const toc = $("toc"); toc.innerHTML = "";
    const groups = [];
    rows.forEach((r) => { const k = r.sec_en; let g = groups.find((x) => x.k === k); if (!g) { g = { k, rows: [] }; groups.push(g); } g.rows.push(r); });
    groups.forEach((g) => {
      const list = f ? g.rows.filter((r) => (r.q_en + " " + r.q_hi + " " + r.kw).toLowerCase().includes(f)) : g.rows;
      if (!list.length) return;
      const d = el("details"); if (f) d.open = true;
      const s = el("summary", null, `<span>${esc(sec(g.rows[0], lang))}</span><span class="n">${list.length}</span>`);
      d.appendChild(s);
      const ul = el("ul");
      list.forEach((r) => {
        const li = el("li"); const b = el("button"); b.type = "button";
        b.innerHTML = `<span class="mark ${r.t}">${r.t === "S" ? "★" : "◆"}</span><span>${esc(q(r, lang))}</span>`;
        b.onclick = () => { closeDrawer(); ask(q(r, lang), r.id); };
        li.appendChild(b); ul.appendChild(li);
      });
      d.appendChild(ul); toc.appendChild(d);
    });
  }

  function setLang(l) {
    lang = l; try { localStorage.setItem("pmmvy-lang", l); } catch (e) {}
    document.documentElement.lang = l;
    $("lang-hi").setAttribute("aria-pressed", String(l === "hi")); $("lang-en").setAttribute("aria-pressed", String(l === "en"));
    document.querySelectorAll("[data-t]").forEach((n) => { const k = n.getAttribute("data-t"); if (T[l][k]) n.textContent = T[l][k]; });
    $("q").placeholder = T[l].ph; $("filterInput").placeholder = T[l].filter;
    document.title = l === "hi" ? "PMMVY FAQ Assistant" : "PMMVY FAQ Assistant";
    buildToc($("filterInput").value);
  }
  function welcome() {
    chat.innerHTML = "";
    const w = el("div"); w.appendChild(el("p", null, esc(T[lang].hello))); w.firstChild.style.margin = "0 0 8px";
    w.appendChild(el("p", null, `<strong>${esc(T[lang].popular)}</strong>`)); w.lastChild.style.margin = "0 0 6px";
    w.appendChild(chipList(POPULAR)); addBot(w);
    chat.scrollTop = 0;
  }

  const aside = $("topics"), scrim = $("scrim");
  function openDrawer() { aside.classList.add("open"); scrim.classList.add("open"); $("topicsBtn").setAttribute("aria-expanded", "true"); }
  function closeDrawer() { aside.classList.remove("open"); scrim.classList.remove("open"); $("topicsBtn").setAttribute("aria-expanded", "false"); }
  $("topicsBtn").onclick = () => (aside.classList.contains("open") ? closeDrawer() : openDrawer());
  scrim.onclick = closeDrawer;
  $("lang-hi").onclick = () => { setLang("hi"); welcome(); };
  $("lang-en").onclick = () => { setLang("en"); welcome(); };
  $("filterInput").addEventListener("input", (e) => buildToc(e.target.value));
  $("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("q").value; $("q").value = ""; ask(v); });

  Promise.resolve(window.PMMVY_DATA).then((data) => {
    rows = data; rows.forEach((r) => (byId[r.id] = r)); engine = new PMMVYEngine(rows);
    setLang(lang); welcome();
  }).catch(() => { chat.innerHTML = ""; addBot(el("div", null, "The FAQ data could not load. Reload the page, or call the PMMVY helpline 1515."), "note"); });
})();
</script>
</body>
</html>
